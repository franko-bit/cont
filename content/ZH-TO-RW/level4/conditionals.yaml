 # Translation - Common Conditional Phrases
 - id: 17
 type: translation
 问题: "怎么说 'If it rains, I will stay home' 用基尼阿万达语？"
 答案: "Niba imvura iguye, nzaguma mu rugo."
 xp_reward: 20

 - id: 18
 type: translation
 问题: "怎么说 'If I 去 到 Kigali, I will visit my friend' 用基尼阿万达语？"
