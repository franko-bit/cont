    question: "Listen to the conversation and choose what the student needs help with"
    tts_text: "Student: I'm just summarizing each article instead of synthesizing them. Professor: For a literature review, you need to group sources by theme and identify patterns and gaps."
    options: ["Finding sources", "Summarizing vs synthesizing", "Formatting citations", "Writing conclusions"]
