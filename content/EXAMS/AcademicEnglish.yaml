lesson:
  name: "Academic English Final Exam"
  description: "Complete Academic English examination with all exercise types including listening, tap what you hear, speaking, writing, and reading."
  xp_reward: 2500

exercises:

  # ==================== MULTIPLE CHOICE (1-15) ====================

  - id: 1
    type: multiple_choice
    difficulty: medium
    time_limit_seconds: 30
    topic: "vocabulary"
    question: "The lecture was so ______ that many students fell asleep."
    options: ["riveting", "tedious", "provocative", "insightful"]
    answer: "tedious"
    xp_reward: 10

  - id: 2
    type: multiple_choice
    difficulty: medium
    time_limit_seconds: 30
    topic: "vocabulary"
    question: "The study's findings were ______; other researchers could not reproduce them."
    options: ["robust", "conclusive", "dubious", "compelling"]
    answer: "dubious"
    xp_reward: 10

  - id: 3
    type: multiple_choice
    difficulty: medium
    time_limit_seconds: 30
    topic: "vocabulary"
    question: "The two theories are not mutually ______; both could be correct."
    options: ["inclusive", "exclusive", "exhaustive", "expansive"]
    answer: "exclusive"
    xp_reward: 10

  - id: 4
    type: multiple_choice
    difficulty: medium
    time_limit_seconds: 30
    topic: "vocabulary"
    question: "The researcher ______ the data to find patterns."
    options: ["hypothesized", "synthesized", "analyzed", "speculated"]
    answer: "analyzed"
    xp_reward: 10

  - id: 5
    type: multiple_choice
    difficulty: medium
    time_limit_seconds: 30
    topic: "vocabulary"
    question: "Her argument was ______, based on solid evidence."
    options: ["tenuous", "superficial", "cogent", "ambiguous"]
    answer: "cogent"
    xp_reward: 10

  - id: 6
    type: multiple_choice
    difficulty: medium
    time_limit_seconds: 30
    topic: "vocabulary"
    question: "The paper provides a comprehensive ______ of existing literature."
    options: ["summary", "review", "critique", "proposal"]
    answer: "review"
    xp_reward: 10

  - id: 7
    type: multiple_choice
    difficulty: medium
    time_limit_seconds: 30
    topic: "vocabulary"
    question: "The experiment was ______ three times to ensure reliability."
    options: ["replicated", "rejected", "revised", "revealed"]
    answer: "replicated"
    xp_reward: 10

  - id: 8
    type: multiple_choice
    difficulty: medium
    time_limit_seconds: 30
    topic: "vocabulary"
    question: "The study had several ______, including a small sample size."
    options: ["strengths", "implications", "limitations", "contributions"]
    answer: "limitations"
    xp_reward: 10

  - id: 9
    type: multiple_choice
    difficulty: medium
    time_limit_seconds: 30
    topic: "vocabulary"
    question: "The professor asked us to ______ the main arguments."
    options: ["memorize", "summarize", "ignore", "expand"]
    answer: "summarize"
    xp_reward: 10

  - id: 10
    type: multiple_choice
    difficulty: medium
    time_limit_seconds: 30
    topic: "vocabulary"
    question: "The author's ______ were supported by extensive evidence."
    options: ["assertions", "doubts", "denials", "questions"]
    answer: "assertions"
    xp_reward: 10

  - id: 11
    type: multiple_choice
    difficulty: medium
    time_limit_seconds: 30
    topic: "grammar"
    question: "If I had known earlier, I ______ it last week."
    options: ["would complete", "will complete", "would have completed", "completed"]
    answer: "would have completed"
    xp_reward: 10

  - id: 12
    type: multiple_choice
    difficulty: medium
    time_limit_seconds: 30
    topic: "grammar"
    question: "______ the high cost, many students still pursue degrees."
    options: ["Despite", "Although", "Because of", "Due to"]
    answer: "Despite"
    xp_reward: 10

  - id: 13
    type: multiple_choice
    difficulty: medium
    time_limit_seconds: 30
    topic: "grammar"
    question: "Not only ______ the exam, but she finished early."
    options: ["she passed", "did she pass", "passed she", "she did pass"]
    answer: "did she pass"
    xp_reward: 10

  - id: 14
    type: multiple_choice
    difficulty: medium
    time_limit_seconds: 30
    topic: "grammar"
    question: "The theory, the origins of ______ date to the 19th century, remains influential."
    options: ["which", "what", "whom", "whose"]
    answer: "which"
    xp_reward: 10

  - id: 15
    type: multiple_choice
    difficulty: medium
    time_limit_seconds: 30
