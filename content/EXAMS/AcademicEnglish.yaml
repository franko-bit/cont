  # ==================== LISTEN AND CHOOSE (16-25) ====================

  - id: 16
    type: listen_and_choose
    difficulty: medium
    time_limit_seconds: 45
    topic: "listening"
    question: "Listen and choose the correct meaning"
    tts_text: "The results of this study are inconclusive and require further investigation."
    options: ["Results are final", "Results need more study", "Results are wrong", "Results are perfect"]
    answer: "Results need more study"
    xp_reward: 15

  - id: 17
    type: listen_and_choose
    difficulty: medium
    time_limit_seconds: 45
    topic: "listening"
    question: "Listen and choose what the speaker is describing"
    tts_text: "This is a testable prediction about the relationship between two variables."
    options: ["Hypothesis", "Conclusion", "Data", "Theory"]
    answer: "Hypothesis"
    xp_reward: 15

  - id: 18
    type: listen_and_choose
    difficulty: medium
    time_limit_seconds: 45
    topic: "listening"
    question: "Listen and choose the correct meaning"
    tts_text: "The literature review synthesizes findings from multiple studies on this topic."
    options: ["Lists all studies", "Summarizes each study separately", "Combines findings from many studies", "Criticizes all studies"]
    answer: "Combines findings from many studies"
    xp_reward: 15

  - id: 19
    type: listen_and_choose
    difficulty: medium
    time_limit_seconds: 45
    topic: "listening"
    question: "Listen and choose what the speaker is referring to"
    tts_text: "This refers to the extent to which a study measures what it claims to measure."
    options: ["Reliability", "Validity", "Sample size", "Correlation"]
    answer: "Validity"
    xp_reward: 15

  - id: 20
    type: listen_and_choose
    difficulty: medium
    time_limit_seconds: 45
    topic: "listening"
    question: "Listen and choose the correct interpretation"
    tts_text: "The p-value was 0.03, which is less than 0.05."
    options: ["Results are not significant", "Results are statistically significant", "The study failed", "Sample was too small"]
    answer: "Results are statistically significant"
    xp_reward: 15

  - id: 21
    type: listen_and_choose
    difficulty: medium
    time_limit_seconds: 45
    topic: "listening"
    question: "Listen and choose the academic term"
    tts_text: "This is a person's ability to remember information accurately over time."
    options: ["Recall", "Recognition", "Retention", "Retrieval"]
    answer: "Retention"
    xp_reward: 15

  - id: 22
    type: listen_and_choose
    difficulty: medium
    time_limit_seconds: 45
    topic: "listening"
    question: "Listen and choose the correct meaning"
    tts_text: "The researcher used a double-blind procedure to eliminate bias."
    options: ["Participants and researchers know the condition", "Neither participants nor researchers know the condition", "Only researchers know", "Only participants know"]
    answer: "Neither participants nor researchers know the condition"
    xp_reward: 15

  - id: 23
    type: listen_and_choose
    difficulty: medium
    time_limit_seconds: 45
    topic: "listening"
    question: "Listen and choose the academic concept"
    tts_text: "This fallacy occurs when someone attacks the person instead of the argument."
    options: ["Straw man", "Ad hominem", "False dichotomy", "Circular reasoning"]
    answer: "Ad hominem"
    xp_reward: 15

  - id: 24
    type: listen_and_choose
    difficulty: hard
    time_limit_seconds: 50
    topic: "listening"
    question: "Listen to the mini-lecture and choose the main topic"
    tts_text: "Cognitive load theory suggests that working memory has limited capacity. Intrinsic load is the difficulty of the material. Extraneous load comes from poor presentation. Germane load is productive mental effort."
    options: ["Memory loss", "Learning styles", "Cognitive load theory", "Study habits"]
    answer: "Cognitive load theory"
    xp_reward: 20

  - id: 25
    type: listen_and_choose
    difficulty: hard
    time_limit_seconds: 50
