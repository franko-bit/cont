lesson:
  name: "Everyday Business English - Complete Exam (200 Exercises)"
  description: "Full examination covering Telephoning, Company Visits, Job Information, Presentations, Meetings, Entertaining, Travel, and Emailing. Includes 19 exercise types with adaptive difficulty."
