exercises:

  # ==================== MULTIPLE CHOICE (Questions 1-30) ====================

  - id: 1
    type: multiple_choice
    difficulty: medium
    time_limit_seconds: 45
    topic: "telephoning"
    question: "What is the most appropriate way to ask for someone on the phone?"
    options: ["I need to talk with someone", "I'd like to speak to Max Reed, please", "Give me Max Reed", "Where is Max Reed?"]
    answer: "I'd like to speak to Max Reed, please"
    xp_reward: 10

  - id: 2
    type: multiple_choice
    difficulty: medium
    time_limit_seconds: 45
    topic: "telephoning"
    question: "If you are the person answering the phone and you are Max Reed, what should you say?"
    options: ["I am Max", "Speaking", "Yes, who wants to know?", "Here I am"]
    answer: "Speaking"
    xp_reward: 10

  - id: 3
    type: multiple_choice
    difficulty: medium
    time_limit_seconds: 45
    topic: "telephoning"
    question: "What does 'Please hold on' mean?"
    options: ["Please call back later", "Please wait on the line", "Please leave a message", "Please hang up"]
    answer: "Please wait on the line"
    xp_reward: 10

  - id: 4
    type: multiple_choice
    difficulty: medium
    time_limit_seconds: 45
    topic: "telephoning"
    question: "What does 'You're breaking up' mean during a call?"
    options: ["The caller is angry", "The connection is poor", "The call is ending", "The number is wrong"]
    answer: "The connection is poor"
    xp_reward: 10

