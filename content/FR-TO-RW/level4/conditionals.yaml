  # Translation - Common Conditional Phrases
  - id: 17
    type: translation
    question: "Comment dit-on 'S'il pleut, je resterai à la maison' en kinyarwanda ?"
    answer: "Niba imvura iguye, nzaguma mu rugo."
    xp_reward: 20

  - id: 18
    type: translation
    question: "Comment dit-on 'Si je vais à Kigali, je rendrai visite à mon ami' en kinyarwanda ?"
    answer: "Niba ngiye i Kigali, nzasura inshuti yanjye."
    xp_reward: 20

  - id: 19
    type: translation
    question: "Comment dit-on 'Si tu étudies, tu réussiras' en kinyarwanda ?"
    answer: "Niba wiga, uzatsinda."
    xp_reward: 18

  - id: 20
    type: translation
    question: "Comment dit-on 'S'il vient, nous commencerons la réunion' en kinyarwanda ?"
    answer: "Niba aje, tuzatangira inama."
    xp_reward: 20

  - id: 21
    type: translation
    question: "Comment dit-on 'Sauf si tu te dépêches, tu rateras le bus' en kinyarwanda ?"
    answer: "Ntiwihutira, uzacika bisi."
    xp_reward: 20

  - id: 22
    type: translation
    question: "Comment dit-on 'Si j'avais de l'argent, j'achèterais une voiture' en kinyarwanda ?"
    answer: "Niba nari mfite amafaranga, nari kugura imodoka."
    xp_reward: 22

  - id: 23
    type: translation
    question: "Comment dit-on 'Si elle était ici, elle pourrait aider' en kinyarwanda ?"
    answer: "Iyo yari hano, yashoboraga gufasha."
    xp_reward: 22

  - id: 24
    type: translation
    question: "Comment dit-on 'Je voyagerais si j'avais plus de temps' en kinyarwanda ?"
    answer: "Nari gutembera iyo nari mfite igihe kinini."
    xp_reward: 22

  - id: 25
    type: translation
    question: "Comment dit-on 'Tu devrais manger avant de partir' en kinyarwanda ?"
    answer: "Bikwiye ko urya mbere yo kugenda."
    xp_reward: 20

  - id: 26
    type: translation
    question: "Comment dit-on 'Si c'est possible, je viendrai demain' en kinyarwanda ?"
    answer: "Niba bishoboka, nzaza ejo."
    xp_reward: 18

