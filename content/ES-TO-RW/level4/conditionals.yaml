  # Translation - Common Conditional Phrases
  - id: 17
    type: translation
    question: "How do you say 'If it rains, I will stay home' in Kinyarwanda?"
    answer: "Niba imvura iguye, nzaguma mu rugo."
    xp_reward: 20

  - id: 18
    type: translation
    question: "How do you say 'If I go to Kigali, I will visit my friend' in Kinyarwanda?"
    answer: "Niba ngiye i Kigali, nzasura inshuti yanjye."
    xp_reward: 20

  - id: 19
    type: translation
    question: "How do you say 'If you study, you will succeed' in Kinyarwanda?"
    answer: "Niba wiga, uzatsinda."
    xp_reward: 18

  - id: 20
    type: translation
    question: "How do you say 'If he comes, we will start the meeting' in Kinyarwanda?"
    answer: "Niba aje, tuzatangira inama."
    xp_reward: 20

  - id: 21
    type: translation
    question: "How do you say 'Unless you hurry, you will miss the bus' in Kinyarwanda?"
    answer: "Ntiwihutira, uzacika bisi."
    xp_reward: 20

  - id: 22
    type: translation
    question: "How do you say 'If I had money, I would buy a car' in Kinyarwanda?"
    answer: "Niba nari mfite amafaranga, nari kugura imodoka."
    xp_reward: 22

  - id: 23
    type: translation
    question: "How do you say 'If she were here, she could help' in Kinyarwanda?"
    answer: "Iyo yari hano, yashoboraga gufasha."
    xp_reward: 22

  - id: 24
    type: translation
    question: "How do you say 'I would travel if I had more time' in Kinyarwanda?"
    answer: "Nari gutembera iyo nari mfite igihe kinini."
    xp_reward: 22

  - id: 25
    type: translation
    question: "How do you say 'You should eat before leaving' in Kinyarwanda?"
    answer: "Bikwiye ko urya mbere yo kugenda."
    xp_reward: 20

  - id: 26
    type: translation
    question: "How do you say 'If it is possible, I will come tomorrow' in Kinyarwanda?"
    answer: "Niba bishoboka, nzaza ejo."
    xp_reward: 18

