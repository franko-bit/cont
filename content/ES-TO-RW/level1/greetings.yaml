lesson:
  name: "Saludos - Amakuru"
  description: "Aprende saludos comunes y expresiones en Kinyarwanda"
  xp_reward: 500

exercises:

  # 1. Ejercicios de Traducción - Solo Saludos ONLY (Safe for single words/phrases)
  - id: 1
    type: translation
    question: "¿Cómo dices 'Hola' en Kinyarwanda?"
    answer: "Muraho"
    xp_reward: 10

  - id: 2
    type: translation
    question: "¿Cómo dices 'Buenos días' en Kinyarwanda?"
    answer: "Mwaramutse"
    xp_reward: 10

  - id: 3
    type: translation
    question: "¿Cómo dices 'Buenas tardes / Buenas noches' en Kinyarwanda?"
    answer: "Mwiriwe"
    xp_reward: 10

  - id: 4
    type: translation
    question: "¿Cómo dices 'Buenas noches' en Kinyarwanda?"
    answer: "Ijoro ryiza"
    xp_reward: 10

  - id: 5
