  # Traducción - Saludos con Miembros de la Familia (Combinaciones simples)
  - id: 15
    type: translation
    question: "¿Cómo dices 'Hola, ¡madre!' en Kinyarwanda?"
    answer: "Muraho, Mama!"
    xp_reward: 12

  - id: 16
    type: translation
    question: "¿Cómo dices 'Buenos días, ¡padre!' en Kinyarwanda?"
    answer: "Mwaramutse, Data!"
    xp_reward: 12

  - id: 17
    type: translation
    question: "¿Cómo dices 'Buenas noches, ¡hijo mío!' en Kinyarwanda?"
    answer: "Ijoro ryiza, mwana wanjye!"
    xp_reward: 15

  # Traducción - Preguntas Comunes (Expresiones fijas)
  - id: 18
    type: translation
    question: "¿Cómo preguntas '¿Cómo estás hoy?' en Kinyarwanda?"
    answer: "Amakuru uyu munsi?"
    xp_reward: 15

  - id: 19
    type: translation
    question: "¿Cómo dices 'Estoy bien, gracias' en Kinyarwanda?"
    answer: "Ni meza, murakoze."
    xp_reward: 15

  - id: 20
    type: translation
    question: "¿Cómo preguntas '¿Qué tal contigo hoy?' en Kinyarwanda?"
    answer: "Ni iki kuri wowe uyu munsi?"
    xp_reward: 18

