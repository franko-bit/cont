      - "A high-growth business unit"
      - "A struggling business unit"
    answer: "A business unit with high market share in a low-growth market - generates steady cash"
    xp_reward: 15

  - id: 25
    type: multiple_choice
    question: "What is 'organic growth'?"
    options:
      - "Growth that is natural"
      - "Growth achieved through internal activities and expansion, not acquisitions"
      - "Growth from farming"
      - "Slow growth"
    answer: "Growth achieved through internal activities and expansion, not acquisitions"
    xp_reward: 15

  - id: 26
    type: multiple_choice
    question: "What is 'inorganic growth'?"
