      - "Growth that is artificial"
      - "Growth achieved through mergers, acquisitions, and strategic partnerships"
      - "Unnatural growth"
      - "Rapid growth"
    answer: "Growth achieved through mergers, acquisitions, and strategic partnerships"
    xp_reward: 15

  - id: 27
    type: multiple_choice
    question: "What is 'vertical integration'?"
    options:
