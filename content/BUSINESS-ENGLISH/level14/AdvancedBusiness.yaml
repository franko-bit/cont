  # MULTIPLE CHOICE (21-28)
  - id: 21
    type: multiple_choice
    question: "What is 'corporate strategy'?"
    options:
      - "A strategy for corporations"
      - "The overall scope, direction, and resource allocation of a company to achieve its long-term goals"
