      - "Horizontal expansion"
    answer: "A strategy where a company acquires suppliers or distributors to control its supply chain"
    xp_reward: 15

  - id: 28
    type: multiple_choice
    question: "What is 'horizontal integration'?"
    options:
      - "Integration that is horizontal"
      - "A strategy where a company acquires competitors in the same industry"
      - "A type of merger"
      - "Vertical expansion"
    answer: "A strategy where a company acquires competitors in the same industry"
    xp_reward: 15

  # FILL IN THE BLANK (29-33)
  - id: 29
