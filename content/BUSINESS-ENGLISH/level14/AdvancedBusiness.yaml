    question: "What is 'portfolio strategy' in corporate strategy?"
    options:
      - "A strategy for portfolios"
      - "Management of a company's collection of business units and investments"
      - "A type of investment strategy"
      - "A product strategy"
    answer: "Management of a company's collection of business units and investments"
    xp_reward: 15

  - id: 23
    type: multiple_choice
    question: "What is the BCG Matrix used for?"
    options:
      - "A consulting tool"
