lesson:
  name: "Advanced Business English"
  description: "Master advanced business English for executive-level communication including corporate strategy, business reports, industry analysis, crisis communication, governance, and high-stakes negotiations"
  xp_reward: 500

exercises:

  # ============================================
  # SECTION 1: EXECUTIVE COMMUNICATION (1-20)
  # ============================================

  # MULTIPLE CHOICE (1-7)
  - id: 1
    type: multiple_choice
    question: "What is 'executive communication'?"
    options:
      - "Communication by executives"
      - "Strategic communication used by senior leaders to influence stakeholders, align teams, and drive organizational direction"
      - "Internal memos only"
      - "Press releases"
    answer: "Strategic communication used by senior leaders to influence stakeholders, align teams, and drive organizational direction"
    xp_reward: 15

  - id: 2
    type: multiple_choice
    question: "What is the 'executive summary' in a business document?"
    options:
      - "A summary written by executives"
      - "A concise overview at the beginning of a document highlighting key findings and recommendations"
      - "A table of contents"
      - "An appendix"
    answer: "A concise overview at the beginning of a document highlighting key findings and recommendations"
    xp_reward: 15

  - id: 3
    type: multiple_choice
    question: "What is 'BLUF' (Bottom Line Up Front) communication?"
    options:
      - "A type of military communication"
      - "Presenting the main conclusion or recommendation first, then supporting details"
      - "A writing style"
      - "An email format"
    answer: "Presenting the main conclusion or recommendation first, then supporting details"
    xp_reward: 15

  - id: 4
    type: multiple_choice
    question: "What is the ideal length of an executive summary?"
    options:
      - "20-30 pages"
      - "1-2 pages"
      - "5-10 sentences"
      - "10-15 pages"
    answer: "1-2 pages"
    xp_reward: 15

  - id: 5
    type: multiple_choice
    question: "What is 'board-level communication'?"
    options:
      - "Communication at board level"
      - "Communication directed to or from a board of directors, focusing on strategy, governance, and major decisions"
      - "Internal team communication"
      - "Shareholder letters"
    answer: "Communication directed to or from a board of directors, focusing on strategy, governance, and major decisions"
    xp_reward: 15

  - id: 6
    type: multiple_choice
    question: "What is 'stakeholder management' in executive communication?"
    options:
      - "Managing stakeholders"
      - "Identifying, understanding, and communicating with all parties affected by business decisions"
      - "A type of project management"
      - "Investor relations only"
    answer: "Identifying, understanding, and communicating with all parties affected by business decisions"
    xp_reward: 15

  - id: 7
    type: multiple_choice
    question: "What is the 'Pyramid Principle' in business writing?"
    options:
      - "A pyramid-shaped document"
      - "A communication structure where the main answer comes first, followed by supporting arguments and data"
      - "A type of organizational chart"
      - "A leadership model"
    answer: "A communication structure where the main answer comes first, followed by supporting arguments and data"
    xp_reward: 15

  # FILL IN THE BLANK (8-12)
  - id: 8
    type: fill_blank
    question: "Complete the executive summary opening"
    text_with_blank: "This report recommends a strategic ___ into the Asian market with an initial investment of $25M."
    options: ["expansion", "entry", "penetration", "move"]
    correct_answer: "expansion"
    xp_reward: 15

  - id: 9
    type: fill_blank
    question: "Complete the BLUF statement"
    text_with_blank: "___ : We recommend proceeding with the acquisition of TechCorp."
    options: ["Bottom line", "BLUF", "Conclusion", "Recommendation"]
    correct_answer: "BLUF"
    xp_reward: 15

  - id: 10
    type: fill_blank
    question: "Complete the board communication phrase"
    text_with_blank: "The board has ___ the proposed budget for the upcoming fiscal year."
    options: ["approved", "authorized", "ratified", "endorsed"]
    correct_answer: "approved"
    xp_reward: 15

  - id: 11
    type: fill_blank
    question: "Complete the stakeholder update phrase"
    text_with_blank: "We are ___ to all stakeholders that the merger will close by Q3."
    options: ["communicating", "announcing", "confirming", "advising"]
    correct_answer: "communicating"
    xp_reward: 15

  - id: 12
    type: fill_blank
    question: "Complete the executive briefing phrase"
    text_with_blank: "Please provide a ___ briefing on the competitive landscape before the strategy offsite."
    options: ["concise", "brief", "high-level", "executive"]
    correct_answer: "concise"
    xp_reward: 15

  # TRUE / FALSE (13-15)
  - id: 13
    type: true_false
    question: "Is this statement true or false? Executive summaries should be written in dense, technical language."
    statement: "Executive summaries should be written in dense, technical language."
    correct_answer: false
    xp_reward: 10

  - id: 14
    type: true_false
    question: "Is this statement true or false? BLUF communication is most effective when the recipient needs to make a quick decision."
    statement: "BLUF communication is most effective when the recipient needs to make a quick decision."
    correct_answer: true
    xp_reward: 10

  - id: 15
    type: true_false
    question: "Is this statement true or false? Executive communication should focus on strategic implications, not operational details."
    statement: "Executive communication should focus on strategic implications, not operational details."
    correct_answer: true
    xp_reward: 10

