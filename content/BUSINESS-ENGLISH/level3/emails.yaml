      - question: "What to do for urgent matters"
        answer: "Mark as urgent and call"
      - question: "How to end a follow-up email"
        answer: "Thank you for your time"
      - question: "What to include after your closing"
        answer: "Signature block"
      - question: "How to handle no response after multiple follow-ups"
        answer: "Change communication method"
    xp_reward: 35

  # ============================================
  # SECTION 3: REQUEST EMAILS (51-75)
  # ============================================

  # MULTIPLE CHOICE (51-55)
  - id: 51
    type: multiple_choice
    question: "Which is the most polite way to make a request in an email?"
    options:
      - "Give me the report by Friday"
      - "I need the report"
      - "Could you please send me the report by Friday?"
      - "Report. Friday. Now."
    answer: "Could you please send me the report by Friday?"
    xp_reward: 15

  - id: 52
    type: multiple_choice
    question: "What should you include when making a request?"
    options:
      - "Only what you want"
      - "What you want, why you need it, and when you need it"
      - "A complaint about previous requests"
      - "A threat if they don't comply"
    answer: "What you want, why you need it, and when you need it"
    xp_reward: 15

  - id: 53
    type: multiple_choice
    question: "How do you request information from someone you don't know well?"
    options:
      - "Send me the info"
      - "I need information"
      - "Would you mind sharing the information when you have a moment?"
      - "Info now"
    answer: "Would you mind sharing the information when you have a moment?"
    xp_reward: 15

  - id: 54
    type: multiple_choice
    question: "What is the best way to make a request with a tight deadline?"
    options:
      - "Demand it immediately"
      - "I apologize for the short notice, but could you please have this ready by 2 PM today?"
      - "Get this done now or else"
      - "ASAP!!!!!"
    answer: "I apologize for the short notice, but could you please have this ready by 2 PM today?"
    xp_reward: 15

  - id: 55
    type: multiple_choice
    question: "What does 'EOD' mean in a request email?"
    options:
      - "Every Other Day"
      - "End of Day"
      - "Early Onward Delivery"
      - "End of Discussion"
    answer: "End of Day"
    xp_reward: 15

  # FILL IN THE BLANK (56-60)
  - id: 56
    type: fill_blank
    question: "Complete the polite request"
    text_with_blank: "Could you please ___ me the updated files by tomorrow?"
    options: ["send", "give", "provide", "forward"]
