lesson:
  name: "Professional Emails and Messages"
  description: "Master professional email writing including greetings, closings, follow-ups, requests, complaints, thank-yous, and internal communication"
  xp_reward: 500

exercises:

  # ============================================
  # SECTION 1: WRITING EMAILS & EMAIL GREETINGS/CLOSINGS (1-25)
  # ============================================

  # MULTIPLE CHOICE (1-8)
  - id: 1
    type: multiple_choice
    question: "What is the most important element of a professional email subject line?"
    options:
      - "Being funny and clever"
      - "Being clear, specific, and descriptive"
      - "Using all capital letters"
      - "Making it as short as possible (one word)"
    answer: "Being clear, specific, and descriptive"
    xp_reward: 15

  - id: 2
    type: multiple_choice
    question: "Which email greeting is most appropriate for a formal business email?"
    options:
      - "Hey team,"
      - "Dear Mr. Johnson,"
      - "Hi there,"
      - "To whom it may concern,"
    answer: "Dear Mr. Johnson,"
    xp_reward: 15

  - id: 3
    type: multiple_choice
    question: "Which email closing is most professional for a standard business email?"
    options:
      - "Best regards,"
      - "Later,"
      - "TTYL,"
      - "XOXO,"
    answer: "Best regards,"
    xp_reward: 15

  - id: 4
    type: multiple_choice
    question: "What should you do before sending an important email?"
    options:
      - "Send it immediately without reading"
      - "Proofread for spelling, grammar, and tone"
      - "Add emojis to make it friendly"
      - "Remove the subject line"
    answer: "Proofread for spelling, grammar, and tone"
    xp_reward: 15

  - id: 5
    type: multiple_choice
    question: "When should you use 'Reply All'?"
    options:
      - "Always, for every email"
      - "Never use it"
      - "Only when everyone on the thread needs to see your response"
      - "Only when you want to annoy people"
    answer: "Only when everyone on the thread needs to see your response"
    xp_reward: 15

  - id: 6
    type: multiple_choice
    question: "What does CC stand for in email?"
    options:
      - "Closed Communication"
      - "Carbon Copy - sends a copy to others"
      - "Confidential Copy"
      - "Complete Correspondence"
    answer: "Carbon Copy - sends a copy to others"
    xp_reward: 15

  - id: 7
    type: multiple_choice
    question: "What does BCC stand for and when should you use it?"
    options:
      - "Big Carbon Copy - use for important people"
      - "Blind Carbon Copy - use when recipients should not see each other's addresses"
      - "Broadcast Copy - use for company-wide emails"
      - "Basic Correspondence - use for routine emails"
    answer: "Blind Carbon Copy - use when recipients should not see each other's addresses"
    xp_reward: 15

  - id: 8
    type: multiple_choice
    question: "Which subject line is most effective for a follow-up email?"
    options:
      - "Following up"
      - "Hey, remember me?"
      - "Follow-up: Meeting request for October 15th"
      - "Urgent!!!"
    answer: "Follow-up: Meeting request for October 15th"
    xp_reward: 15

  # FILL IN THE BLANK (9-15)
  - id: 9
    type: fill_blank
    question: "Complete the formal email greeting"
    text_with_blank: "Dear Mr. Johnson, I hope this email ___ you well."
    options: ["finds", "treats", "greets", "meets"]
    correct_answer: "finds"
    xp_reward: 15

  - id: 10
    type: fill_blank
    question: "Complete the professional email closing"
    text_with_blank: "Thank you for your time and consideration. ___ regards, Michael Chen"
    options: ["Best", "Warm", "Kind", "Friendly"]
    correct_answer: "Best"
    xp_reward: 15

  - id: 11
    type: fill_blank
    question: "Complete the subject line"
    text_with_blank: "Subject: ___ regarding the Q3 sales report"
    options: ["Question", "Inquiry", "Request", "Query"]
    correct_answer: "Inquiry"
    xp_reward: 15

  - id: 12
    type: fill_blank
    question: "Complete the email opening line"
    text_with_blank: "I am ___ to you regarding the upcoming conference."
    options: ["writing", "emailing", "contacting", "reaching out"]
    correct_answer: "writing"
    xp_reward: 15

  - id: 13
    type: fill_blank
    question: "Complete the attachment reference"
    text_with_blank: "Please find the document ___ to this email."
    options: ["attached", "enclosed", "included", "added"]
    correct_answer: "attached"
    xp_reward: 15

  - id: 14
    type: fill_blank
    question: "Complete the call to action"
    text_with_blank: "Please let me know if you have any ___ or concerns."
    options: ["questions", "doubts", "issues", "problems"]
    correct_answer: "questions"
    xp_reward: 15

  - id: 15
    type: fill_blank
    question: "Complete the email sign-off before the closing"
    text_with_blank: "I look ___ to hearing from you soon."
    options: ["forward", "ahead", "on", "out"]
    correct_answer: "forward"
    xp_reward: 15

  # TRUE / FALSE (16-19)
  - id: 16
    type: true_false
    question: "Is this statement true or false? Using ALL CAPS in an email subject line is considered professional."
    statement: "Using ALL CAPS in an email subject line is considered professional."
    correct_answer: false
    xp_reward: 10

  - id: 17
    type: true_false
    question: "Is this statement true or false? You should always include a subject line in professional emails."
    statement: "You should always include a subject line in professional emails."
    correct_answer: true
    xp_reward: 10

  - id: 18
    type: true_false
    question: "Is this statement true or false? Emojis are always inappropriate in professional emails."
    statement: "Emojis are always inappropriate in professional emails."
    correct_answer: false
    xp_reward: 10

  - id: 19
    type: true_false
    question: "Is this statement true or false? It is acceptable to write an email in all lowercase letters."
    statement: "It is acceptable to write an email in all lowercase letters."
    correct_answer: false
    xp_reward: 10

  # MATCHING (20-22)
  - id: 20
    type: matching
    question: "Match the email greeting with its appropriate use"
    pairs:
      - left: "Dear Sir or Madam,"
        right: "Formal, recipient name unknown"
      - left: "Dear Dr. Williams,"
        right: "Recipient has a doctorate"
      - left: "Hi Sarah,"
        right: "Casual, colleague you know well"
      - left: "Good morning team,"
        right: "Group email to your department"
      - left: "To the Hiring Manager,"
        right: "Job application cover letter"
    xp_reward: 25

  - id: 21
    type: matching
    question: "Match the email closing with its formality level"
    pairs:
      - left: "Yours faithfully,"
        right: "Very formal (name unknown)"
      - left: "Sincerely,"
        right: "Formal"
      - left: "Best regards,"
        right: "Standard professional"
      - left: "Best,"
        right: "Casual professional"
      - left: "Thanks,"
        right: "Informal/friendly"
    xp_reward: 25

  - id: 22
    type: matching
    question: "Match the email section with its purpose"
    pairs:
      - left: "Subject line"
        right: "Summarizes email content"
      - left: "Greeting"
        right: "Addresses the recipient"
      - left: "Opening line"
        right: "States purpose or builds rapport"
      - left: "Body"
        right: "Contains main message and details"
      - left: "Closing"
        right: "Summarizes and ends politely"
    xp_reward: 25

  # FLASHCARDS (23-25)
  - id: 23
    type: flashcards
    question: "Flashcards: Email Greetings"
    flashcards:
      - front: "Dear Mr. Smith,"
        back: "Formal greeting for a male"
      - front: "Dear Ms. Johnson,"
        back: "Formal greeting for a female"
      - front: "Dear Dr. Chen,"
        back: "For someone with a doctorate"
      - front: "To whom it may concern,"
        back: "When recipient name is unknown"
      - front: "Hi everyone,"
        back: "Casual group greeting"
    xp_reward: 30

  - id: 24
    type: flashcards
    question: "Flashcards: Email Closings"
    flashcards:
      - front: "Best regards,"
        back: "Standard professional closing"
      - front: "Sincerely,"
        back: "Formal closing"
      - front: "Warmly,"
        back: "Friendly but professional"
      - front: "Thank you for your time,"
        back: "Appreciative closing"
      - front: "Looking forward to your reply,"
        back: "Expecting a response"
    xp_reward: 30

  - id: 25
    type: flashcards
    question: "Flashcards: Email Structure"
    flashcards:
      - front: "Subject line"
        back: "Clear, specific, 5-10 words"
      - front: "Greeting"
        back: "Appropriate for recipient and context"
      - front: "Opening sentence"
        back: "State purpose or reference previous contact"
      - front: "Body paragraphs"
        back: "Clear, concise, organized"
      - front: "Closing + signature"
        back: "Politely end with contact info"
    xp_reward: 30

  # ============================================
  # SECTION 2: FOLLOW-UP EMAILS (26-50)
  # ============================================

  # MULTIPLE CHOICE (26-30)
  - id: 26
    type: multiple_choice
    question: "How long should you typically wait before sending a follow-up email?"
    options:
      - "1 hour"
      - "24-48 business hours"
      - "1 month"
      - "The same day, multiple times"
    answer: "24-48 business hours"
    xp_reward: 15

  - id: 27
    type: multiple_choice
    question: "Which is the most professional follow-up email subject line?"
    options:
      - "Following up"
      - "Did you get my last email?"
      - "Following up: Proposal for Q4 strategy (sent October 10th)"
      - "Hello??? Anyone there?"
    answer: "Following up: Proposal for Q4 strategy (sent October 10th)"
    xp_reward: 15

  - id: 28
    type: multiple_choice
    question: "What should you include in a follow-up email?"
    options:
      - "Only the word 'following up'"
      - "Reference to original email, polite reminder, and clear next step"
      - "A complaint about slow response"
      - "Multiple exclamation marks"
    answer: "Reference to original email, polite reminder, and clear next step"
    xp_reward: 15

  - id: 29
    type: multiple_choice
    question: "What is the best way to phrase a polite follow-up reminder?"
    options:
      - "You never responded to my email!"
      - "I'm just checking in on this. Do you have an update?"
      - "Hello??? It's been a week!"
      - "Did you see my email or not?"
    answer: "I'm just checking in on this. Do you have an update?"
    xp_reward: 15

  - id: 30
    type: multiple_choice
    question: "How many follow-up emails are generally acceptable before changing approach?"
    options:
      - "1 follow-up"
      - "2-3 follow-ups, then pick up the phone"
      - "10 follow-ups"
      - "Never follow up more than once"
    answer: "2-3 follow-ups, then pick up the phone"
    xp_reward: 15

  # FILL IN THE BLANK (31-35)
  - id: 31
    type: fill_blank
    question: "Complete the follow-up opening"
    text_with_blank: "I'm just ___ in on the proposal I sent last week."
    options: ["checking", "following", "looking", "touching"]
    correct_answer: "checking"
    xp_reward: 15

  - id: 32
    type: fill_blank
    question: "Complete the polite reminder phrase"
    text_with_blank: "I wanted to gently ___ you about our upcoming deadline."
    options: ["remind", "remember", "recall", "notify"]
    correct_answer: "remind"
    xp_reward: 15

  - id: 33
    type: fill_blank
    question: "Complete the reference to previous email"
    text_with_blank: "I'm writing to ___ up on the email I sent on October 10th."
    options: ["follow", "check", "look", "touch"]
    correct_answer: "follow"
    xp_reward: 15

  - id: 34
    type: fill_blank
    question: "Complete the polite pressure phrase"
    text_with_blank: "Could you please ___ me know if you've had a chance to review this?"
    options: ["let", "make", "have", "get"]
    correct_answer: "let"
    xp_reward: 15

  - id: 35
    type: fill_blank
    question: "Complete the final follow-up phrase"
    text_with_blank: "I'll ___ this as resolved unless I hear back by Friday."
    options: ["consider", "assume", "mark", "take"]
    correct_answer: "assume"
    xp_reward: 15

  # TRUE / FALSE (36-38)
  - id: 36
    type: true_false
    question: "Is this statement true or false? Sending multiple follow-up emails in one day is professional."
    statement: "Sending multiple follow-up emails in one day is professional."
    correct_answer: false
    xp_reward: 10

  - id: 37
    type: true_false
    question: "Is this statement true or false? You should always reference the original email in your follow-up."
    statement: "You should always reference the original email in your follow-up."
    correct_answer: true
    xp_reward: 10

  - id: 38
    type: true_false
    question: "Is this statement true or false? Using 'urgent' in every follow-up subject line is effective."
    statement: "Using 'urgent' in every follow-up subject line is effective."
    correct_answer: false
    xp_reward: 10

  # MATCHING (39-42)
  - id: 39
    type: matching
    question: "Match the follow-up scenario with the best approach"
    pairs:
      - left: "No response after 2 days"
        right: "Polite check-in: 'Just checking in on this'"
      - left: "No response after 1 week"
        right: "Re-send original email with follow-up note"
      - left: "No response after 2 weeks"
        right: "Pick up the phone or try alternate contact"
      - left: "Urgent matter needs response"
        right: "Mark subject as 'URGENT' and call"
      - left: "Non-urgent information request"
        right: "One follow-up, then assume no interest"
    xp_reward: 25

  - id: 40
    type: matching
    question: "Match the follow-up phrase with its tone"
    pairs:
      - left: "I'm just circling back on this"
        right: "Friendly, casual"
      - left: "Per my previous email"
        right: "Formal, slightly firm"
      - left: "I wanted to gently remind you"
        right: "Polite, soft"
      - left: "Could you please provide an update?"
        right: "Professional, direct"
      - left: "I look forward to your response"
        right: "Professional, expectant"
    xp_reward: 25

  - id: 41
    type: matching
    question: "Match the follow-up timing with the situation"
    pairs:
      - left: "Job application"
        right: "Wait 1-2 weeks, send polite follow-up"
      - left: "Meeting request with CEO"
        right: "Wait 3-5 business days, then follow up"
      - left: "Client proposal (urgent)"
        right: "Follow up next day, mark urgent"
      - left: "Internal task reminder"
        right: "Wait 2-3 days, send gentle reminder"
      - left: "Invoice payment (overdue)"
        right: "Follow up same day, escalate if needed"
    xp_reward: 25

  - id: 42
    type: matching
    question: "Match the follow-up subject line with its purpose"
    pairs:
      - left: "Following up: Q3 report due Friday"
        right: "Gentle reminder"
      - left: "URGENT: Client issue needs immediate attention"
        right: "High priority"
      - left: "Checking in - proposal sent Oct 10th"
        right: "Standard follow-up"
      - left: "Final reminder: Deadline tomorrow"
        right: "Urgent final reminder"
      - left: "Any updates on this?"
        right: "Casual check-in"
    xp_reward: 25

  # FLASHCARDS (43-46)
  - id: 43
    type: flashcards
    question: "Flashcards: First Follow-up Phrases"
    flashcards:
      - front: "I'm just checking in on"
        back: "Casual, friendly follow-up"
      - front: "I wanted to follow up on"
        back: "Standard professional follow-up"
      - front: "Have you had a chance to review?"
        back: "Polite status request"
      - front: "Just circling back on"
        back: "Friendly, slightly informal"
      - front: "I'm touching base regarding"
        back: "Professional check-in"
    xp_reward: 30

  - id: 44
    type: flashcards
    question: "Flashcards: Second Follow-up Phrases"
    flashcards:
      - front: "I'm writing to gently remind you"
        back: "Soft reminder"
      - front: "Per my previous email"
        back: "Formal reference to earlier message"
      - front: "I wanted to bring this back to your attention"
        back: "Polite but firm"
      - front: "Following up again on"
        back: "Acknowledges this is not the first contact"
      - front: "Is there any update on this matter?"
        back: "Direct but polite"
    xp_reward: 30

  - id: 45
    type: flashcards
    question: "Flashcards: Final Follow-up Phrases"
    flashcards:
      - front: "This is my final reminder"
        back: "Clear that no more follow-ups"
      - front: "I'll assume this is resolved unless"
        back: "Puts responsibility on recipient"
      - front: "Please advise by [date]"
        back: "Sets clear deadline"
      - front: "I'll be following up by phone"
        back: "Changes communication method"
      - front: "Unless I hear otherwise, I will proceed with"
        back: "States planned action"
    xp_reward: 30

  - id: 46
    type: flashcards
    question: "Flashcards: Follow-up Best Practices"
    flashcards:
      - front: "Reference original email"
        back: "Include date or subject"
      - front: "Be polite, not pushy"
        back: "Assume good intentions"
      - front: "Restate your ask clearly"
        back: "Don't assume they remember"
      - front: "Provide a deadline"
        back: "Gives clear expectation"
      - front: "Suggest next steps"
        back: "Makes it easy to respond"
    xp_reward: 30

  # TIMED CHALLENGES (47-50)
  - id: 47
    type: timed_challenge
    title: "Lightning Round: Follow-up Phrases"
    time_limit_seconds: 30
    questions_count: 5
    questions:
