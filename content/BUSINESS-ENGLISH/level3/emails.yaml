    xp_reward: 15

  - id: 59
    type: fill_blank
    question: "Complete the request for meeting"
    text_with_blank: "Would you be ___ for a 30-minute meeting on Thursday?"
    options: ["available", "free", "able", "open"]
    correct_answer: "available"
    xp_reward: 15

  - id: 60
    type: fill_blank
    question: "Complete the request acknowledgment"
    text_with_blank: "I understand you're busy, but if you could ___ this request, I would appreciate it."
    options: ["prioritize", "prefer", "preview", "prepare"]
    correct_answer: "prioritize"
    xp_reward: 15

  # TRUE / FALSE (61-63)
  - id: 61
    type: true_false
    question: "Is this statement true or false? You should always explain why you are making a request."
    statement: "You should always explain why you are making a request."
    correct_answer: true
    xp_reward: 10

  - id: 62
    type: true_false
    question: "Is this statement true or false? Demanding something is more effective than politely requesting it."
    statement: "Demanding something is more effective than politely requesting it."
    correct_answer: false
    xp_reward: 10

  - id: 63
    type: true_false
    question: "Is this statement true or false? It is acceptable to assume someone will fulfill your request without asking."
    statement: "It is acceptable to assume someone will fulfill your request without asking."
    correct_answer: false
    xp_reward: 10

  # MATCHING (64-67)
  - id: 64
    type: matching
    question: "Match the request type with the best phrasing"
    pairs:
      - left: "Request for information"
        right: "Could you please provide me with the sales figures?"
      - left: "Request for action"
        right: "Would you be able to review this document?"
      - left: "Request for meeting"
