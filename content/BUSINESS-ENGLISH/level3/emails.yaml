  - id: 65
    type: matching
    question: "Match the request urgency with appropriate phrasing"
    pairs:
      - left: "Routine request"
        right: "When you have a moment, could you..."
      - left: "Time-sensitive request"
        right: "Could you please have this ready by end of day?"
      - left: "Urgent request"
        right: "I apologize for the urgency, but I need this within the hour"
