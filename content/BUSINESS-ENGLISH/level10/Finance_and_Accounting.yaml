        right: "Year-to-date - from start of fiscal year"
      - front: "YoY"
        right: "Year-over-year comparison"
      - front: "QoQ"
        right: "Quarter-over-quarter comparison"
    xp_reward: 30

  # ============================================
  # SECTION 4: BANKING TERMS (66-85)
  # ============================================

  # MULTIPLE CHOICE (66-73)
  - id: 66
    type: multiple_choice
    question: "What is a 'business bank account'?"
    options:
      - "A personal bank account for business owners"
      - "A bank account specifically for business transactions"
      - "A savings account"
      - "An investment account"
    answer: "A bank account specifically for business transactions"
    xp_reward: 15

  - id: 67
    type: multiple_choice
    question: "What is 'interest rate'?"
    options:
      - "The rate of interesting things"
      - "The percentage charged on borrowed money or paid on deposits"
      - "The rate of inflation"
      - "The exchange rate"
    answer: "The percentage charged on borrowed money or paid on deposits"
    xp_reward: 15

  - id: 68
