      - front: "Non-current/Long-term"
        right: "Due beyond one year"
    xp_reward: 30

  - id: 62
    type: flashcards
    question: "Flashcards: Income Statement Terms"
    flashcards:
      - front: "Top line"
        right: "Revenue"
      - front: "Bottom line"
        right: "Net income"
      - front: "Operating income"
        right: "Income from core operations"
      - front: "EBIT"
        right: "Earnings Before Interest and Taxes"
      - front: "EBITDA"
        right: "Earnings Before Interest, Taxes, Depreciation, Amortization"
    xp_reward: 30

  - id: 63
    type: flashcards
    question: "Flashcards: Accounting Methods"
    flashcards:
      - front: "GAAP"
