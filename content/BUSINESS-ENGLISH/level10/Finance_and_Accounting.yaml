    xp_reward: 30

  - id: 64
    type: flashcards
    question: "Flashcards: Audit Terms"
    flashcards:
      - front: "Internal audit"
        right: "Conducted by company employees"
      - front: "External audit"
        right: "Conducted by independent CPA firm"
      - front: "Material misstatement"
        right: "Significant error affecting decisions"
      - front: "Unqualified opinion"
        right: "Clean audit report"
      - front: "Qualified opinion"
        right: "Audit report with exceptions"
    xp_reward: 30

  - id: 65
    type: flashcards
    question: "Flashcards: Reporting Periods"
    flashcards:
      - front: "Fiscal year"
        right: "12-month accounting period (not necessarily calendar year)"
      - front: "Quarter (Q1, Q2, Q3, Q4)"
