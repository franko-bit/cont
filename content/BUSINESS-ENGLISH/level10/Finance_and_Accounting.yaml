lesson:
  name: "Finance and Accounting English"
  description: "Master professional finance and accounting communication including budgeting, revenue, expenses, financial reports, banking, investments, metrics, and vocabulary"
  xp_reward: 500

exercises:

  # ============================================
  # SECTION 1: BUDGETING (1-20)
  # ============================================

  # MULTIPLE CHOICE (1-7)
  - id: 1
    type: multiple_choice
    question: "What is a 'budget' in business?"
    options:
      - "A cheap price"
      - "A financial plan estimating income and expenses for a specific period"
      - "A type of bank account"
      - "A tax document"
    answer: "A financial plan estimating income and expenses for a specific period"
    xp_reward: 15

  - id: 2
    type: multiple_choice
    question: "What is a 'capital budget'?"
    options:
      - "A budget for capital cities"
      - "A budget for major investments in long-term assets like equipment or buildings"
      - "A budget for daily operations"
      - "A budget for marketing"
    answer: "A budget for major investments in long-term assets like equipment or buildings"
    xp_reward: 15

  - id: 3
    type: multiple_choice
    question: "What is an 'operating budget'?"
    options:
      - "A budget for surgeries"
      - "A budget for day-to-day business operations and expenses"
      - "A budget for capital investments"
      - "A budget for employee salaries only"
    answer: "A budget for day-to-day business operations and expenses"
    xp_reward: 15

  - id: 4
    type: multiple_choice
    question: "What does 'variance' mean in budgeting?"
    options:
      - "Something that varies"
      - "The difference between budgeted and actual amounts"
      - "A type of variance report"
      - "A financial statement"
    answer: "The difference between budgeted and actual amounts"
    xp_reward: 15

  - id: 5
    type: multiple_choice
    question: "What is a 'zero-based budget'?"
    options:
      - "A budget with zero expenses"
      - "A budget where every expense must be justified for each new period"
      - "A budget with zero revenue"
      - "A budget that is completely empty"
    answer: "A budget where every expense must be justified for each new period"
    xp_reward: 15

  - id: 6
    type: multiple_choice
    question: "What is a 'flexible budget'?"
    options:
      - "A budget that can bend"
      - "A budget that adjusts based on actual activity levels"
      - "A budget that never changes"
      - "A budget for flexible spending"
    answer: "A budget that adjusts based on actual activity levels"
    xp_reward: 15

  - id: 7
    type: multiple_choice
    question: "What does 'budget allocation' mean?"
    options:
      - "Allocating blame for budget problems"
      - "Distributing budgeted funds across departments or projects"
      - "Removing funds from the budget"
      - "Creating a budget"
    answer: "Distributing budgeted funds across departments or projects"
    xp_reward: 15

  # FILL IN THE BLANK (8-12)
  - id: 8
    type: fill_blank
    question: "Complete the budget statement"
    text_with_blank: "We need to ___ the budget for Q3 and submit it by Friday."
    options: ["finalize", "complete", "prepare", "approve"]
    correct_answer: "finalize"
    xp_reward: 15

  - id: 9
    type: fill_blank
    question: "Complete the variance explanation"
    text_with_blank: "The favorable variance was due to lower-than-expected ___ costs."
    options: ["operating", "material", "labor", "overhead"]
    correct_answer: "operating"
    xp_reward: 15

  - id: 10
    type: fill_blank
    question: "Complete the budget request"
    text_with_blank: "We are requesting a budget ___ of $50,000 for the new marketing initiative."
    options: ["allocation", "appropriation", "assignment", "designation"]
    correct_answer: "allocation"
    xp_reward: 15

  - id: 11
    type: fill_blank
    question: "Complete the budget overrun statement"
    text_with_blank: "We are currently 15% ___ budget due to unexpected repairs."
    options: ["over", "above", "exceeding", "beyond"]
    correct_answer: "over"
    xp_reward: 15

  - id: 12
    type: fill_blank
    question: "Complete the budget cut announcement"
    text_with_blank: "Due to lower revenue, we must ___ the marketing budget by 10%."
    options: ["cut", "reduce", "decrease", "trim"]
    correct_answer: "reduce"
    xp_reward: 15

  # TRUE / FALSE (13-15)
  - id: 13
    type: true_false
    question: "Is this statement true or false? A favorable variance means actual results are better than budgeted."
    statement: "A favorable variance means actual results are better than budgeted."
    correct_answer: true
    xp_reward: 10

  - id: 14
    type: true_false
    question: "Is this statement true or false? Budgets should never be changed once created."
    statement: "Budgets should never be changed once created."
    correct_answer: false
    xp_reward: 10

  - id: 15
    type: true_false
    question: "Is this statement true or false? A budget deficit occurs when expenses exceed revenue."
    statement: "A budget deficit occurs when expenses exceed revenue."
    correct_answer: true
    xp_reward: 10

  # MATCHING (16-18)
  - id: 16
    type: matching
    question: "Match the budget type with its description"
    pairs:
      - left: "Static budget"
        right: "Does not change with activity level"
      - left: "Rolling budget"
        right: "Continuously updated, always 12 months forward"
      - left: "Incremental budget"
        right: "Based on previous period plus adjustments"
      - left: "Activity-based budget"
        right: "Based on cost drivers and activities"
      - left: "Cash budget"
        right: "Projects cash inflows and outflows"
    xp_reward: 25

  - id: 17
    type: matching
    question: "Match the variance type with its cause"
    pairs:
      - left: "Volume variance"
        right: "Difference due to actual vs budgeted quantity sold"
      - left: "Price variance"
        right: "Difference due to actual vs budgeted price"
      - left: "Efficiency variance"
        right: "Difference due to productivity levels"
      - left: "Spending variance"
        right: "Difference due to actual vs budgeted cost"
      - left: "Mix variance"
        right: "Difference due to product or input mix"
    xp_reward: 25

  - id: 18
    type: matching
    question: "Match the budgeting term with its definition"
    pairs:
      - left: "Baseline"
        right: "Starting point or reference for budget"
      - left: "Contingency"
        right: "Reserve funds for unexpected events"
      - left: "CapEx"
        right: "Capital Expenditure - long-term asset purchases"
      - left: "OpEx"
        right: "Operating Expenditure - day-to-day expenses"
      - left: "Run rate"
        right: "Current spending level projected forward"
    xp_reward: 25

  # FLASHCARDS (19-20)
  - id: 19
    type: flashcards
    question: "Flashcards: Budgeting Vocabulary"
    flashcards:
      - front: "Top-down budgeting"
        right: "Senior management sets budget targets"
      - front: "Bottom-up budgeting"
        right: "Department managers submit budget requests"
      - front: "Budget cycle"
        right: "Timeline from planning to approval"
      - front: "Budget holder"
        right: "Person responsible for managing budget"
      - front: "Zero-based budgeting (ZBB)"
        right: "All expenses must be justified each period"
    xp_reward: 30

  - id: 20
    type: flashcards
    question: "Flashcards: Budget Variance Phrases"
    flashcards:
      - front: "Favorable variance"
        right: "Revenue higher or expense lower than budget"
      - front: "Unfavorable variance"
        right: "Revenue lower or expense higher than budget"
      - front: "Material variance"
        right: "Significant difference requiring investigation"
      - front: "Volume variance"
        right: "Difference due to quantity of activity"
      - front: "Spending variance"
        right: "Difference in cost per unit"
    xp_reward: 30

  # ============================================
  # SECTION 2: REVENUE AND EXPENSES (21-40)
  # ============================================

  # MULTIPLE CHOICE (21-28)
  - id: 21
    type: multiple_choice
    question: "What is 'revenue' in business?"
    options:
      - "The cost of goods sold"
      - "Income generated from normal business operations"
      - "The profit after expenses"
      - "The taxes paid"
    answer: "Income generated from normal business operations"
    xp_reward: 15

  - id: 22
    type: multiple_choice
    question: "What is 'gross revenue'?"
    options:
      - "Revenue after all deductions"
      - "Total revenue before any deductions or returns"
      - "Revenue from gross products"
      - "Net profit"
    answer: "Total revenue before any deductions or returns"
    xp_reward: 15

  - id: 23
    type: multiple_choice
    question: "What is 'net revenue'?"
    options:
      - "Revenue after subtracting returns, allowances, and discounts"
      - "Revenue caught in a net"
      - "Total revenue before deductions"
      - "Revenue from internet sales"
    answer: "Revenue after subtracting returns, allowances, and discounts"
    xp_reward: 15

  - id: 24
    type: multiple_choice
    question: "What is 'cost of goods sold' (COGS)?"
    options:
      - "The cost of selling goods"
      - "Direct costs attributable to producing goods sold by a company"
      - "Marketing expenses"
      - "Administrative salaries"
    answer: "Direct costs attributable to producing goods sold by a company"
    xp_reward: 15

  - id: 25
    type: multiple_choice
    question: "What are 'operating expenses' (OPEX)?"
    options:
      - "Expenses for operating machinery"
      - "Costs required to run day-to-day business operations"
      - "Capital investments"
      - "Tax payments"
    answer: "Costs required to run day-to-day business operations"
    xp_reward: 15

  - id: 26
    type: multiple_choice
    question: "What is 'fixed cost'?"
    options:
      - "A cost that can be fixed"
      - "A cost that does not change with production volume"
      - "A cost that changes with production"
      - "A one-time cost"
    answer: "A cost that does not change with production volume"
    xp_reward: 15

  - id: 27
    type: multiple_choice
    question: "What is 'variable cost'?"
    options:
      - "A cost that varies depending on who you ask"
      - "A cost that changes proportionally with production volume"
      - "A cost that never changes"
      - "A cost that is always the same"
    answer: "A cost that changes proportionally with production volume"
    xp_reward: 15

  - id: 28
    type: multiple_choice
    question: "What is 'EBITDA'?"
    options:
      - "Earnings Before Interest, Taxes, Depreciation, and Amortization"
      - "Earnings Before Investment, Trade, Debt, and Assets"
      - "Expenses Before Interest, Taxes, Debt, and Amortization"
      - "Earnings Before Income Tax and Depreciation Amortization"
    answer: "Earnings Before Interest, Taxes, Depreciation, and Amortization"
    xp_reward: 15

  # FILL IN THE BLANK (29-33)
  - id: 29
    type: fill_blank
    question: "Complete the revenue statement"
    text_with_blank: "Q3 revenue grew by 12% ___ to $5.2 million."
    options: ["year-over-year", "YoY", "annually", "from last year"]
    correct_answer: "year-over-year"
    xp_reward: 15

  - id: 30
    type: fill_blank
    question: "Complete the expense description"
    text_with_blank: "Our largest operating ___ is employee salaries and benefits."
    options: ["expense", "cost", "outlay", "spend"]
    correct_answer: "expense"
    xp_reward: 15

  - id: 31
    type: fill_blank
    question: "Complete the margin statement"
    text_with_blank: "Our gross ___ is 45%, which is above industry average."
    options: ["margin", "profit", "ratio", "percentage"]
    correct_answer: "margin"
    xp_reward: 15

  - id: 32
    type: fill_blank
    question: "Complete the cost classification"
    text_with_blank: "Rent is a ___ cost because it doesn't change with production volume."
    options: ["fixed", "constant", "stable", "periodic"]
    correct_answer: "fixed"
    xp_reward: 15

  - id: 33
    type: fill_blank
    question: "Complete the revenue recognition"
    text_with_blank: "Revenue is ___ when the service is delivered, regardless of when payment is received."
    options: ["recognized", "recorded", "booked", "accounted"]
    correct_answer: "recognized"
    xp_reward: 15

  # TRUE / FALSE (34-36)
  - id: 34
    type: true_false
    question: "Is this statement true or false? Higher revenue always means higher profit."
    statement: "Higher revenue always means higher profit."
    correct_answer: false
    xp_reward: 10

  - id: 35
    type: true_false
    question: "Is this statement true or false? Operating expenses are also known as overhead."
    statement: "Operating expenses are also known as overhead."
    correct_answer: true
    xp_reward: 10

  - id: 36
    type: true_false
    question: "Is this statement true or false? A company can have positive revenue but negative profit."
    statement: "A company can have positive revenue but negative profit."
    correct_answer: true
    xp_reward: 10

  # MATCHING (37-38)
  - id: 37
    type: matching
    question: "Match the expense type with its example"
    pairs:
      - left: "Fixed cost"
        right: "Monthly rent, insurance premiums"
      - left: "Variable cost"
        right: "Raw materials, shipping costs"
      - left: "Semi-variable cost"
        right: "Electricity (base + usage), phone bills"
      - left: "Direct cost"
        right: "Materials and labor for production"
      - left: "Indirect cost"
        right: "Utilities, administrative salaries"
    xp_reward: 25

  - id: 38
    type: matching
    question: "Match the revenue term with its description"
    pairs:
      - left: "Recurring revenue"
        right: "Predictable, repeating income (subscriptions)"
      - left: "Non-recurring revenue"
        right: "One-time income (asset sale, one-off project)"
      - left: "Deferred revenue"
        right: "Payment received before service is delivered"
      - left: "Accrued revenue"
        right: "Service delivered but payment not yet received"
      - left: "Passive revenue"
        right: "Income from activities not requiring active work"
    xp_reward: 25

  # FLASHCARDS (39-40)
  - id: 39
    type: flashcards
    question: "Flashcards: Revenue Metrics"
    flashcards:
      - front: "ARR"
        right: "Annual Recurring Revenue (subscription businesses)"
      - front: "MRR"
        right: "Monthly Recurring Revenue"
      - front: "NRR"
        right: "Net Revenue Retention (accounts for churn and expansion)"
      - front: "ARPU"
        right: "Average Revenue Per User"
      - front: "LTV"
        right: "Customer Lifetime Value"
    xp_reward: 30

  - id: 40
    type: flashcards
    question: "Flashcards: Expense Categories"
    flashcards:
      - front: "COGS"
        right: "Cost of Goods Sold - direct production costs"
      - front: "SG&A"
        right: "Selling, General & Administrative expenses"
      - front: "R&D"
        right: "Research & Development expenses"
      - front: "Depreciation"
        right: "Allocation of tangible asset cost over time"
      - front: "Amortization"
        right: "Allocation of intangible asset cost over time"
    xp_reward: 30

  # ============================================
  # SECTION 3: FINANCIAL REPORTS (41-65)
  # ============================================

  # MULTIPLE CHOICE (41-48)
  - id: 41
    type: multiple_choice
    question: "What is an 'income statement' (Profit & Loss statement)?"
    options:
      - "A statement about income"
      - "A financial report showing revenue, expenses, and profit over a period"
      - "A list of assets and liabilities"
      - "A cash flow statement"
    answer: "A financial report showing revenue, expenses, and profit over a period"
    xp_reward: 15

  - id: 42
    type: multiple_choice
    question: "What is a 'balance sheet'?"
    options:
      - "A sheet that balances"
      - "A financial statement showing assets, liabilities, and equity at a specific point in time"
      - "A list of income and expenses"
      - "A tax return"
    answer: "A financial statement showing assets, liabilities, and equity at a specific point in time"
    xp_reward: 15

  - id: 43
    type: multiple_choice
    question: "What is the accounting equation?"
    options:
      - "Revenue - Expenses = Profit"
      - "Assets = Liabilities + Equity"
      - "Cash In - Cash Out = Net Cash"
      - "Income + Expenses = Assets"
    answer: "Assets = Liabilities + Equity"
    xp_reward: 15

  - id: 44
    type: multiple_choice
    question: "What is 'net income' (net profit)?"
    options:
      - "Revenue minus all expenses"
      - "Gross revenue"
      - "Total assets"
      - "Cash in bank"
    answer: "Revenue minus all expenses"
    xp_reward: 15

  - id: 45
    type: multiple_choice
    question: "What is 'shareholders' equity'?"
    options:
      - "Money shareholders owe"
      - "The residual interest in assets after deducting liabilities"
      - "The price of shares"
      - "Dividends paid"
    answer: "The residual interest in assets after deducting liabilities"
    xp_reward: 15

  - id: 46
    type: multiple_choice
    question: "What is a 'cash flow statement'?"
    options:
      - "A statement about cash flowing"
      - "A financial report showing cash inflows and outflows from operations, investments, and financing"
      - "A bank statement"
      - "A profit report"
    answer: "A financial report showing cash inflows and outflows from operations, investments, and financing"
    xp_reward: 15

  - id: 47
    type: multiple_choice
    question: "What does 'accrual accounting' mean?"
    options:
      - "Accounting that is accurate"
      - "Recording revenue when earned and expenses when incurred, regardless of cash movement"
      - "Recording only when cash is received or paid"
      - "Accounting for accidents"
    answer: "Recording revenue when earned and expenses when incurred, regardless of cash movement"
    xp_reward: 15

  - id: 48
    type: multiple_choice
    question: "What does 'cash accounting' mean?"
    options:
      - "Accounting with cash only"
      - "Recording revenue when cash is received and expenses when cash is paid"
      - "Accounting for cash transactions only"
      - "An accounting method for cashiers"
    answer: "Recording revenue when cash is received and expenses when cash is paid"
    xp_reward: 15

  # FILL IN THE BLANK (49-53)
  - id: 49
    type: fill_blank
    question: "Complete the income statement line"
    text_with_blank: "Our gross ___ was $10 million, with COGS of $6 million."
    options: ["revenue", "sales", "income", "turnover"]
    correct_answer: "revenue"
    xp_reward: 15

  - id: 50
    type: fill_blank
    question: "Complete the balance sheet classification"
    text_with_blank: "Cash and inventory are considered ___ assets."
    options: ["current", "liquid", "short-term", "operating"]
    correct_answer: "current"
    xp_reward: 15

  - id: 51
    type: fill_blank
    question: "Complete the cash flow classification"
    text_with_blank: "Purchasing equipment is a cash ___ from investing activities."
    options: ["outflow", "payment", "expenditure", "use"]
    correct_answer: "outflow"
    xp_reward: 15

  - id: 52
    type: fill_blank
    question: "Complete the depreciation description"
    text_with_blank: "We ___ the equipment over its 10-year useful life."
    options: ["depreciate", "amortize", "expense", "write off"]
    correct_answer: "depreciate"
    xp_reward: 15

  - id: 53
    type: fill_blank
    question: "Complete the year-end statement"
    text_with_blank: "The ___ financial statements have been audited and approved by the board."
    options: ["annual", "year-end", "fiscal", "periodic"]
    correct_answer: "annual"
    xp_reward: 15

  # TRUE / FALSE (54-56)
  - id: 54
    type: true_false
    question: "Is this statement true or false? A company can be profitable but have negative cash flow."
    statement: "A company can be profitable but have negative cash flow."
    correct_answer: true
    xp_reward: 10

  - id: 55
    type: true_false
    question: "Is this statement true or false? Public companies are required to file audited financial statements."
    statement: "Public companies are required to file audited financial statements."
    correct_answer: true
    xp_reward: 10

  - id: 56
    type: true_false
    question: "Is this statement true or false? Accounts receivable is a liability."
    statement: "Accounts receivable is a liability."
    correct_answer: false
    xp_reward: 10

  # MATCHING (57-60)
  - id: 57
    type: matching
    question: "Match the financial statement with what it shows"
    pairs:
      - left: "Income statement"
        right: "Profitability over time (revenue - expenses)"
      - left: "Balance sheet"
        right: "Financial position at a point in time (assets = liabilities + equity)"
      - left: "Cash flow statement"
        right: "Sources and uses of cash"
      - left: "Statement of equity"
        right: "Changes in shareholders' equity"
      - left: "Notes to financial statements"
        right: "Additional details and explanations"
    xp_reward: 25

  - id: 58
    type: matching
    question: "Match the income statement line item with its description"
    pairs:
      - left: "Revenue"
        right: "Income from sales"
      - left: "COGS"
        right: "Direct cost to produce goods sold"
      - left: "Gross profit"
        right: "Revenue - COGS"
      - left: "Operating expenses"
        right: "SG&A, R&D, etc."
      - left: "Net income"
        right: "Bottom line profit"
    xp_reward: 25

  - id: 59
    type: matching
    question: "Match the balance sheet line item with its category"
    pairs:
      - left: "Cash"
        right: "Current asset"
      - left: "Accounts receivable"
        right: "Current asset"
      - left: "Inventory"
        right: "Current asset"
      - left: "Accounts payable"
        right: "Current liability"
      - left: "Long-term debt"
        right: "Non-current liability"
    xp_reward: 25

  - id: 60
    type: matching
    question: "Match the cash flow category with its example"
    pairs:
      - left: "Operating activities"
        right: "Cash from customer sales, payments to suppliers"
      - left: "Investing activities"
        right: "Purchase of equipment, sale of investments"
      - left: "Financing activities"
        right: "Issuing stock, borrowing loans, paying dividends"
      - left: "Free cash flow"
        right: "Operating cash flow minus capital expenditures"
      - left: "Net cash flow"
        right: "Sum of all three categories"
    xp_reward: 25

  # FLASHCARDS (61-65)
  - id: 61
    type: flashcards
    question: "Flashcards: Balance Sheet Terms"
    flashcards:
      - front: "Assets"
        right: "Resources owned by the company"
      - front: "Liabilities"
        right: "Obligations owed to others"
      - front: "Equity"
        right: "Owners' claim on assets"
