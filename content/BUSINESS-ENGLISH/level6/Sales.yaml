lesson:
  name: "Sales and Marketing English"
  description: "Master professional sales and marketing communication including conversations, product descriptions, negotiations, customer communication, advertising, and pitching"
  xp_reward: 500

exercises:

  # ============================================
  # SECTION 1: SALES CONVERSATIONS (1-20)
  # ============================================

  # MULTIPLE CHOICE (1-7)
  - id: 1
    type: multiple_choice
    question: "What is the best way to open a sales conversation with a new prospect?"
    options:
      - "Do you want to buy our product?"
      - "Hi, I'm calling to sell you something."
      - "Hello, I'm [Name] from [Company]. Do you have a few minutes to discuss how we might help your business?"
      - "You need our product."
    answer: "Hello, I'm [Name] from [Company]. Do you have a few minutes to discuss how we might help your business?"
    xp_reward: 15

  - id: 2
    type: multiple_choice
    question: "What is the SPIN selling methodology?"
    options:
      - "Sell, Price, Invoice, Negotiate"
      - "Situation, Problem, Implication, Need-payoff"
      - "Start, Present, Interest, Close"
      - "Sample, Product, Information, Name"
    answer: "Situation, Problem, Implication, Need-payoff"
    xp_reward: 15

  - id: 3
    type: multiple_choice
    question: "What is a 'discovery question' in a sales conversation?"
    options:
      - "A question about the customer's discovery of your company"
      - "A question asked to understand the customer's needs and challenges"
      - "A question at the end of the sale"
      - "A question about pricing"
    answer: "A question asked to understand the customer's needs and challenges"
    xp_reward: 15

  - id: 4
    type: multiple_choice
    question: "How should you handle a customer's objection about price?"
    options:
      - "Immediately offer a discount"
      - "Agree that it's too expensive"
      - "Acknowledge their concern, reinforce value, then discuss pricing options"
      - "Argue with them about the price"
    answer: "Acknowledge their concern, reinforce value, then discuss pricing options"
    xp_reward: 15

  - id: 5
    type: multiple_choice
    question: "What is the best way to ask for the sale (close)?"
    options:
      - "So, are you going to buy it or not?"
      - "Based on what we've discussed, shall we move forward with the implementation?"
      - "When can you sign?"
      - "Take it or leave it."
    answer: "Based on what we've discussed, shall we move forward with the implementation?"
    xp_reward: 15

  - id: 6
    type: multiple_choice
    question: "What is a 'warm lead'?"
    options:
      - "A potential customer who is hot-tempered"
      - "A potential customer who has shown previous interest in your product"
      - "A customer who just bought something"
      - "A customer in a warm climate"
    answer: "A potential customer who has shown previous interest in your product"
    xp_reward: 15

  - id: 7
    type: multiple_choice
    question: "What is the meaning of 'BANT' in sales qualification?"
    options:
      - "Buy, Ask, Negotiate, Test"
      - "Budget, Authority, Need, Timeline"
      - "Business, Account, Number, Time"
      - "Basic, Advanced, Normal, Technical"
    answer: "Budget, Authority, Need, Timeline"
    xp_reward: 15

  # FILL IN THE BLANK (8-12)
  - id: 8
    type: fill_blank
    question: "Complete the discovery question"
    text_with_blank: "What are the biggest ___ you're currently facing in your operations?"
    options: ["challenges", "problems", "issues", "difficulties"]
    correct_answer: "challenges"
    xp_reward: 15

  - id: 9
    type: fill_blank
    question: "Complete the objection handling phrase"
    text_with_blank: "I understand your concern about price. Let me ___ the value you would receive."
    options: ["explain", "show", "demonstrate", "highlight"]
    correct_answer: "demonstrate"
    xp_reward: 15

  - id: 10
    type: fill_blank
    question: "Complete the closing question"
    text_with_blank: "Based on our conversation, does it ___ sense to move forward?"
    options: ["make", "do", "have", "take"]
    correct_answer: "make"
    xp_reward: 15

  - id: 11
    type: fill_blank
    question: "Complete the follow-up commitment"
    text_with_blank: "I'll ___ a proposal to you by end of day tomorrow."
    options: ["send", "forward", "email", "share"]
    correct_answer: "send"
    xp_reward: 15

  - id: 12
    type: fill_blank
    question: "Complete the need identification"
    text_with_blank: "So if I understand correctly, you're looking to ___ your customer retention?"
    options: ["improve", "increase", "boost", "enhance"]
    correct_answer: "improve"
    xp_reward: 15

  # TRUE / FALSE (13-15)
  - id: 13
    type: true_false
    question: "Is this statement true or false? The best sales conversations focus on product features rather than customer needs."
    statement: "The best sales conversations focus on product features rather than customer needs."
    correct_answer: false
    xp_reward: 10

  - id: 14
    type: true_false
    question: "Is this statement true or false? Asking open-ended questions helps uncover customer needs."
    statement: "Asking open-ended questions helps uncover customer needs."
    correct_answer: true
    xp_reward: 10

  - id: 15
    type: true_false
    question: "Is this statement true or false? You should always try to close the sale multiple times during a conversation."
    statement: "You should always try to close the sale multiple times during a conversation."
    correct_answer: false
    xp_reward: 10

  # MATCHING (16-18)
  - id: 16
    type: matching
    question: "Match the sales questioning technique with its purpose"
    pairs:
      - left: "Situation questions"
        right: "Gather facts about current circumstances"
      - left: "Problem questions"
        right: "Identify difficulties or dissatisfactions"
      - left: "Implication questions"
        right: "Explore consequences of problems"
      - left: "Need-payoff questions"
        right: "Show value of solving the problem"
    xp_reward: 25

  - id: 17
    type: matching
    question: "Match the sales stage with the appropriate conversation focus"
    pairs:
      - left: "Prospecting"
        right: "Identifying potential customers"
      - left: "Discovery"
        right: "Understanding customer needs"
      - left: "Presentation"
        right: "Demonstrating value proposition"
      - left: "Handling objections"
        right: "Addressing concerns"
      - left: "Closing"
        right: "Asking for commitment"
    xp_reward: 25

  - id: 18
    type: matching
    question: "Match the BANT qualification criteria with its meaning"
    pairs:
      - left: "Budget"
        right: "Does the customer have financial resources?"
      - left: "Authority"
        right: "Can the person make the decision?"
      - left: "Need"
        right: "Does the customer have a genuine requirement?"
      - left: "Timeline"
        right: "When does the customer need a solution?"
    xp_reward: 25

  # FLASHCARDS (19-20)
  - id: 19
    type: flashcards
    question: "Flashcards: Sales Opening Phrases"
    flashcards:
      - front: "Is now a good time to talk?"
        right: "Respects prospect's time"
      - front: "I was hoping to learn more about your current process"
        right: "Discovery-focused opening"
      - front: "We've helped similar companies with [problem]"
        right: "Social proof opening"
      - front: "I'm following up on our conversation about"
        right: "Warm lead opening"
      - front: "I came across your company and was impressed by"
        right: "Personalized opening"
    xp_reward: 30

  - id: 20
    type: flashcards
    question: "Flashcards: Sales Closing Phrases"
    flashcards:
      - front: "Shall we move forward with the next steps?"
        right: "Assumptive close"
      - front: "Would you like to proceed with implementation?"
        right: "Direct close"
      - front: "I'll send over the contract - when can you review it?"
        right: "Action close"
      - front: "If we can address this last concern, are you ready to move ahead?"
        right: "Objection close"
      - front: "Which of these options works better for you?"
        right: "Alternative choice close"
    xp_reward: 30

  # ============================================
  # SECTION 2: PRODUCT DESCRIPTIONS (21-40)
  # ============================================

  # MULTIPLE CHOICE (21-27)
  - id: 21
    type: multiple_choice
    question: "What is the difference between a feature and a benefit?"
    options:
      - "Features are negative, benefits are positive"
      - "Features describe what the product does, benefits describe what the customer gains"
      - "Features are for internal use, benefits are for customers"
      - "There is no difference"
    answer: "Features describe what the product does, benefits describe what the customer gains"
    xp_reward: 15

  - id: 22
    type: multiple_choice
    question: "Which is an example of a benefit statement?"
    options:
      - "Our software has 256-bit encryption"
      - "Our software includes cloud backup"
      - "Our software gives you peace of mind knowing your data is secure"
      - "Our software runs on Windows 10"
    answer: "Our software gives you peace of mind knowing your data is secure"
    xp_reward: 15

  - id: 23
    type: multiple_choice
    question: "What does 'FAB' stand for in product description?"
    options:
      - "Facts, Analysis, Benefits"
      - "Features, Advantages, Benefits"
      - "Functions, Applications, Brands"
      - "Focus, Action, Buy"
    answer: "Features, Advantages, Benefits"
    xp_reward: 15

  - id: 24
    type: multiple_choice
    question: "What is a 'unique selling proposition' (USP)?"
    options:
      - "The price of the product"
      - "What makes your product different and better than competitors"
      - "The color of the packaging"
      - "The shipping method"
    answer: "What makes your product different and better than competitors"
    xp_reward: 15

  - id: 25
    type: multiple_choice
    question: "Which phrase best describes a product's value proposition?"
    options:
      - "The product is cheap"
      - "The product has many buttons"
      - "The specific value a customer will receive from purchasing the product"
      - "The product's weight and dimensions"
    answer: "The specific value a customer will receive from purchasing the product"
    xp_reward: 15

  - id: 26
    type: multiple_choice
    question: "What does 'customer pain point' mean?"
    options:
      - "A physical injury the customer has"
      - "A specific problem the customer is experiencing"
      - "The customer's budget"
      - "The customer's location"
    answer: "A specific problem the customer is experiencing"
    xp_reward: 15

  - id: 27
    type: multiple_choice
    question: "Which phrase creates a stronger product description?"
    options:
      - "Our product has a long battery life"
      - "Our product keeps you powered all day without recharging"
      - "Our product has a battery"
      - "The battery exists"
    answer: "Our product keeps you powered all day without recharging"
    xp_reward: 15

  # FILL IN THE BLANK (28-32)
  - id: 28
    type: fill_blank
    question: "Complete the feature-to-benefit conversion"
    text_with_blank: "Our software includes real-time reporting, which ___ you make faster, data-driven decisions."
    options: ["lets", "allows", "enables", "helps"]
    correct_answer: "enables"
    xp_reward: 15

  - id: 29
    type: fill_blank
    question: "Complete the value statement"
    text_with_blank: "What sets us apart from the competition is our ___ customer support."
    options: ["24/7", "dedicated", "responsive", "exceptional"]
    correct_answer: "dedicated"
    xp_reward: 15

  - id: 30
    type: fill_blank
    question: "Complete the problem-solution description"
    text_with_blank: "Tired of wasting time on manual data entry? Our platform ___ this process."
    options: ["automates", "simplifies", "streamlines", "optimizes"]
    correct_answer: "automates"
    xp_reward: 15

  - id: 31
    type: fill_blank
    question: "Complete the outcome statement"
    text_with_blank: "Customers who use our product typically see a 30% ___ in productivity."
    options: ["increase", "improvement", "boost", "gain"]
    correct_answer: "increase"
    xp_reward: 15

  - id: 32
    type: fill_blank
    question: "Complete the proof statement"
    text_with_blank: "Our solution has been ___ by over 10,000 satisfied customers."
    options: ["trusted", "chosen", "selected", "adopted"]
    correct_answer: "trusted"
    xp_reward: 15

  # TRUE / FALSE (33-35)
  - id: 33
    type: true_false
    question: "Is this statement true or false? The best product descriptions focus only on features, not benefits."
    statement: "The best product descriptions focus only on features, not benefits."
    correct_answer: false
    xp_reward: 10

  - id: 34
    type: true_false
    question: "Is this statement true or false? Using customer testimonials adds credibility to product descriptions."
    statement: "Using customer testimonials adds credibility to product descriptions."
    correct_answer: true
    xp_reward: 10

  - id: 35
    type: true_false
    question: "Is this statement true or false? A strong product description should address customer pain points."
    statement: "A strong product description should address customer pain points."
    correct_answer: true
    xp_reward: 10

  # MATCHING (36-38)
  - id: 36
    type: matching
    question: "Match the product description element with its example"
    pairs:
      - left: "Feature"
        right: "12-megapixel camera"
      - left: "Advantage"
        right: "Crisp, detailed photos in any lighting"
      - left: "Benefit"
        right: "Capture precious memories you'll treasure forever"
      - left: "Pain point addressed"
        right: "Never miss a perfect shot due to poor lighting again"
      - left: "Proof point"
        right: "Voted 'Best Camera' by Photography Magazine"
    xp_reward: 25

  - id: 37
    type: matching
    question: "Match the product adjective with what it conveys"
    pairs:
      - left: "Innovative"
        right: "New and cutting-edge"
      - left: "Reliable"
        right: "Consistently performs as expected"
      - left: "User-friendly"
        right: "Easy to use without training"
      - left: "Cost-effective"
        right: "Good value for the price"
      - left: "Scalable"
        right: "Can grow with your needs"
    xp_reward: 25

  - id: 38
    type: matching
    question: "Match the product description phrase with its strength"
    pairs:
      - left: "It's good"
        right: "Weak, vague"
      - left: "It will transform your workflow"
        right: "Strong, aspirational"
      - left: "It has a 99.9% uptime guarantee"
        right: "Specific, credible"
      - left: "Trusted by industry leaders"
        right: "Social proof"
      - left: "Try it risk-free for 30 days"
        right: "Reduces purchase anxiety"
    xp_reward: 25

  # FLASHCARDS (39-40)
  - id: 39
    type: flashcards
    question: "Flashcards: Benefit Language"
    flashcards:
      - front: "Save time"
        right: "Benefit for efficiency seekers"
      - front: "Reduce costs"
        right: "Financial benefit"
      - front: "Increase revenue"
        right: "Growth benefit"
      - front: "Gain peace of mind"
        right: "Emotional benefit"
      - front: "Stay ahead of competitors"
        right: "Competitive benefit"
    xp_reward: 30

  - id: 40
    type: flashcards
    question: "Flashcards: Powerful Product Adjectives"
    flashcards:
      - front: "Revolutionary"
        right: "Completely new and different"
      - front: "Award-winning"
        right: "Recognized by experts"
      - front: "Industry-leading"
        right: "Better than competitors"
      - front: "Proven"
        right: "Tested and validated"
      - front: "Seamless"
        right: "Works without friction"
    xp_reward: 30

  # ============================================
  # SECTION 3: NEGOTIATION LANGUAGE (41-60)
  # ============================================

  # MULTIPLE CHOICE (41-47)
  - id: 41
    type: multiple_choice
    question: "What is the first rule of business negotiation?"
    options:
      - "Always say no first"
      - "Never negotiate"
      - "Know your best alternative (BATNA) before you start"
      - "Always accept the first offer"
    answer: "Know your best alternative (BATNA) before you start"
    xp_reward: 15

  - id: 42
    type: multiple_choice
    question: "What does BATNA stand for?"
    options:
      - "Best Alternative To a Negotiated Agreement"
      - "Basic Agreement Terms and Negotiation Approach"
      - "Business And Trade Negotiation Association"
      - "Before Any Talk, Note Alternatives"
    answer: "Best Alternative To a Negotiated Agreement"
    xp_reward: 15

  - id: 43
    type: multiple_choice
    question: "What is the best way to respond to a lowball offer?"
    options:
      - "Get angry and walk away"
      - "Accept it immediately"
      - "Stay calm, acknowledge the offer, and counter with your position"
      - "Laugh at them"
    answer: "Stay calm, acknowledge the offer, and counter with your position"
    xp_reward: 15

  - id: 44
    type: multiple_choice
    question: "What is 'win-win' negotiation?"
    options:
      - "One side wins everything"
      - "Both sides feel they gained value from the agreement"
      - "Neither side gets anything"
      - "The negotiation ends in a tie"
    answer: "Both sides feel they gained value from the agreement"
    xp_reward: 15

  - id: 45
    type: multiple_choice
    question: "What should you say when you need to compromise?"
    options:
      - "Fine, whatever"
      - "You win, I lose"
      - "I can agree to that if you can agree to X"
      - "Never compromise"
    answer: "I can agree to that if you can agree to X"
    xp_reward: 15

  - id: 46
    type: multiple_choice
    question: "What is 'anchoring' in negotiation?"
    options:
      - "Ships and boats reference"
      - "The first offer or price mentioned, which sets the reference point"
      - "Refusing to move from a position"
      - "Ending the negotiation"
    answer: "The first offer or price mentioned, which sets the reference point"
    xp_reward: 15

  - id: 47
    type: multiple_choice
    question: "How should you handle a negotiation impasse?"
    options:
      - "Yell at the other party"
      - "Walk away permanently"
      - "Take a break, change the topic, or suggest involving a mediator"
      - "Accept their last offer"
    answer: "Take a break, change the topic, or suggest involving a mediator"
    xp_reward: 15

  # FILL IN THE BLANK (48-52)
  - id: 48
    type: fill_blank
    question: "Complete the counteroffer phrase"
    text_with_blank: "I understand your position. However, we were hoping for something in the ___ of $50,000."
    options: ["range", "area", "ballpark", "vicinity"]
    correct_answer: "range"
    xp_reward: 15

  - id: 49
    type: fill_blank
    question: "Complete the conditional offer"
    text_with_blank: "We can agree to that price if you can ___ on the delivery timeline."
    options: ["flex", "budge", "compromise", "concede"]
    correct_answer: "compromise"
    xp_reward: 15

  - id: 50
    type: fill_blank
    question: "Complete the concession statement"
    text_with_blank: "If you're willing to increase the volume, we would be ___ to reduce the unit price."
    options: ["prepared", "ready", "willing", "able"]
    correct_answer: "prepared"
    xp_reward: 15

  - id: 51
    type: fill_blank
    question: "Complete the deadlock resolution"
    text_with_blank: "It seems we've reached a ___ on this point. Shall we take a break and revisit?"
    options: ["stalemate", "deadlock", "impasse", "standoff"]
    correct_answer: "impasse"
    xp_reward: 15

  - id: 52
    type: fill_blank
    question: "Complete the agreement confirmation"
    text_with_blank: "Let me ___ what we've agreed so far to ensure we're aligned."
    options: ["recap", "summarize", "review", "repeat"]
    correct_answer: "recap"
    xp_reward: 15

  # TRUE / FALSE (53-55)
  - id: 53
    type: true_false
    question: "Is this statement true or false? In negotiation, you should always reveal your bottom line immediately."
    statement: "In negotiation, you should always reveal your bottom line immediately."
    correct_answer: false
    xp_reward: 10

  - id: 54
    type: true_false
    question: "Is this statement true or false? Silence can be a powerful negotiation tactic."
    statement: "Silence can be a powerful negotiation tactic."
    correct_answer: true
    xp_reward: 10

  - id: 55
    type: true_false
    question: "Is this statement true or false? Personal attacks can be effective negotiation strategies."
    statement: "Personal attacks can be effective negotiation strategies."
    correct_answer: false
    xp_reward: 10

  # MATCHING (56-58)
  - id: 56
    type: matching
    question: "Match the negotiation term with its definition"
    pairs:
      - left: "BATNA"
        right: "Your best alternative if no deal is reached"
      - left: "Reservation price"
        right: "Your walk-away point"
      - left: "ZOPA"
        right: "Zone of Possible Agreement - overlap of acceptable ranges"
      - left: "Concession"
        right: "Giving up something to reach agreement"
      - left: "Trade-off"
        right: "Exchanging one thing for another"
    xp_reward: 25

  - id: 57
    type: matching
    question: "Match the negotiation strategy with its approach"
    pairs:
      - left: "Distributive negotiation"
        right: "Fixed pie - one winner, one loser"
      - left: "Integrative negotiation"
        right: "Expand the pie - both sides gain"
      - left: "Principled negotiation"
        right: "Focus on interests, not positions"
      - left: "Competitive negotiation"
        right: "Aggressive, high-pressure tactics"
      - left: "Collaborative negotiation"
        right: "Problem-solving, partnership focus"
    xp_reward: 25

  - id: 58
    type: matching
    question: "Match the negotiation phrase with its intention"
    pairs:
      - left: "Help me understand your position better"
        right: "Seek information"
      - left: "What if we...?"
        right: "Suggest alternative"
      - left: "Is that your best offer?"
        right: "Test firmness"
      - left: "Let me check with my team"
        right: "Buy time"
      - left: "I appreciate your flexibility on this"
        right: "Build goodwill"
    xp_reward: 25

  # FLASHCARDS (59-60)
  - id: 59
    type: flashcards
    question: "Flashcards: Negotiation Phrases"
    flashcards:
      - front: "Let me see if I understand correctly"
        right: "Confirm understanding"
      - front: "What would it take to make this work?"
        right: "Explore possibilities"
      - front: "We're not that far apart"
        right: "Find common ground"
      - front: "Let me propose a compromise"
        right: "Suggest middle ground"
      - front: "I think we're making progress"
        right: "Positive reinforcement"
    xp_reward: 30

  - id: 60
    type: flashcards
    question: "Flashcards: Concession Language"
    flashcards:
      - front: "If you, then I"
        right: "Conditional concession"
      - front: "We can agree to X, provided that you"
        right: "Traded concession"
      - front: "I'll need to get approval for that"
        right: "Create room for later"
      - front: "That's less than we hoped for, but let's see"
        right: "Accept with reservation"
      - front: "We can meet you halfway"
        right: "Split the difference"
    xp_reward: 30

  # ============================================
  # SECTION 4: MARKETING TERMINOLOGY (61-80)
  # ============================================

  # MULTIPLE CHOICE (61-67)
  - id: 61
    type: multiple_choice
    question: "What is a 'target market'?"
    options:
      - "A store that sells targets"
      - "The specific group of consumers a company aims to reach"
      - "The price of a product"
      - "A type of marketing campaign"
    answer: "The specific group of consumers a company aims to reach"
    xp_reward: 15

  - id: 62
    type: multiple_choice
    question: "What does 'ROI' stand for in marketing?"
    options:
      - "Return on Investment"
      - "Rate of Interest"
      - "Return of Income"
      - "Reach of Impressions"
    answer: "Return on Investment"
    xp_reward: 15

  - id: 63
    type: multiple_choice
    question: "What is a 'buyer persona'?"
    options:
      - "A person who buys things"
      - "A fictional representation of your ideal customer"
      - "A type of marketing software"
      - "A sales technique"
    answer: "A fictional representation of your ideal customer"
    xp_reward: 15

  - id: 64
    type: multiple_choice
    question: "What does 'lead generation' mean?"
    options:
      - "Generating electricity"
      - "The process of attracting and converting strangers into potential customers"
      - "Leading a team"
      - "Generating metal leads"
    answer: "The process of attracting and converting strangers into potential customers"
    xp_reward: 15

  - id: 65
    type: multiple_choice
    question: "What is the 'marketing funnel'?"
    options:
      - "A physical funnel used in stores"
      - "The model describing the customer journey from awareness to purchase"
      - "A type of advertising"
      - "A pricing strategy"
    answer: "The model describing the customer journey from awareness to purchase"
    xp_reward: 15

  - id: 66
    type: multiple_choice
    question: "What does 'KPI' stand for in marketing?"
    options:
      - "Keep Promoting Internally"
      - "Key Performance Indicator"
      - "Knowledge Product Information"
      - "Kind Personal Interaction"
    answer: "Key Performance Indicator"
    xp_reward: 15

  - id: 67
    type: multiple_choice
    question: "What is 'brand awareness'?"
    options:
      - "How much a brand costs"
      - "The extent to which consumers recognize a brand"
      - "The color of a brand's logo"
      - "The brand's website"
    answer: "The extent to which consumers recognize a brand"
    xp_reward: 15

  # FILL IN THE BLANK (68-72)
  - id: 68
    type: fill_blank
    question: "Complete the market segmentation phrase"
    text_with_blank: "Our primary ___ market is professionals aged 25-40."
    options: ["target", "focus", "key", "core"]
    correct_answer: "target"
    xp_reward: 15

  - id: 69
    type: fill_blank
