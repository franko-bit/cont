lesson:
  name: "Customer Service English"
  description: "Master professional customer service communication including helping customers, handling complaints, solving problems, apologies, relationship building, and support vocabulary"
  xp_reward: 500

exercises:

  # ============================================
  # SECTION 1: HELPING CUSTOMERS (1-25)
  # ============================================

  # MULTIPLE CHOICE (1-8)
  - id: 1
    type: multiple_choice
    question: "What is the most important opening phrase when a customer approaches for help?"
    options:
      - "What do you want?"
      - "How can I help you today?"
      - "I'm busy right now."
      - "Go to the other counter."
    answer: "How can I help you today?"
    xp_reward: 15

  - id: 2
    type: multiple_choice
    question: "What should you say while helping a customer to show you're listening?"
    options:
      - "Silence"
      - "Uh-huh, I see, okay, let me check"
      - "Whatever you say"
      - "Is that all?"
    answer: "Uh-huh, I see, okay, let me check"
    xp_reward: 15

  - id: 3
    type: multiple_choice
    question: "How should you ask clarifying questions to better understand a customer's need?"
    options:
      - "What are you talking about?"
      - "Just to make sure I understand, you're looking for..."
      - "I don't get it"
      - "Say that again"
    answer: "Just to make sure I understand, you're looking for..."
    xp_reward: 15

  - id: 4
    type: multiple_choice
    question: "What is the best way to confirm you've understood the customer's request?"
    options:
      - "Okay, bye"
      - "So if I understand correctly, you need..."
      - "Whatever"
      - "Next"
    answer: "So if I understand correctly, you need..."
    xp_reward: 15

  - id: 5
    type: multiple_choice
    question: "How should you respond when a customer asks for something outside your scope?"
    options:
      - "That's not my job"
      - "I'm not sure, but let me find someone who can help you with that"
      - "You're asking the wrong person"
      - "Figure it out yourself"
    answer: "I'm not sure, but let me find someone who can help you with that"
    xp_reward: 15

  - id: 6
    type: multiple_choice
    question: "What is the best way to put a customer on hold?"
    options:
      - "Hold on" (click)
      - "Would you mind holding for a moment while I look into that for you?"
      - "Wait here"
      - "Be quiet and wait"
    answer: "Would you mind holding for a moment while I look into that for you?"
    xp_reward: 15

  - id: 7
    type: multiple_choice
    question: "What should you say when you return to a customer after placing them on hold?"
    options:
      - "Thanks for waiting. I've found the information you need."
      - "You're still here?"
      - "Okay, what was the question?"
      - "Sorry about the wait"
    answer: "Thanks for waiting. I've found the information you need."
    xp_reward: 15

  - id: 8
    type: multiple_choice
    question: "How should you end a customer service interaction?"
    options:
      - "Is there anything else I can help you with today?"
      - "You're done, goodbye"
      - "Leave now"
      - "That's it"
    answer: "Is there anything else I can help you with today?"
    xp_reward: 15

  # FILL IN THE BLANK (9-14)
  - id: 9
    type: fill_blank
    question: "Complete the opening greeting"
    text_with_blank: "Welcome to [Company Name]. How may I ___ you today?"
    options: ["assist", "help", "serve", "support"]
    correct_answer: "assist"
    xp_reward: 15

  - id: 10
    type: fill_blank
    question: "Complete the confirmation phrase"
    text_with_blank: "So if I understand correctly, you're ___ for a replacement part."
    options: ["looking", "searching", "checking", "asking"]
    correct_answer: "looking"
    xp_reward: 15

  - id: 11
    type: fill_blank
    question: "Complete the hold request"
    text_with_blank: "Would you mind ___ for just a moment while I check our system?"
    options: ["holding", "waiting", "staying", "remaining"]
    correct_answer: "holding"
    xp_reward: 15

  - id: 12
    type: fill_blank
    question: "Complete the thank you for waiting"
    text_with_blank: "Thanks for your ___. I appreciate you bearing with me."
    options: ["patience", "wait", "time", "understanding"]
    correct_answer: "patience"
    xp_reward: 15

  - id: 13
    type: fill_blank
    question: "Complete the clarification request"
    text_with_blank: "Could you please ___ that for me? I want to make sure I get it right."
    options: ["repeat", "say again", "clarify", "explain"]
    correct_answer: "repeat"
    xp_reward: 15

  - id: 14
    type: fill_blank
    question: "Complete the closing check"
    text_with_blank: "Is there ___ else I can do for you before you go?"
    options: ["anything", "something", "nothing", "everything"]
    correct_answer: "anything"
    xp_reward: 15

  # TRUE / FALSE (15-17)
  - id: 15
    type: true_false
    question: "Is this statement true or false? Making eye contact with a customer shows you are engaged and listening."
    statement: "Making eye contact with a customer shows you are engaged and listening."
    correct_answer: true
    xp_reward: 10

  - id: 16
    type: true_false
    question: "Is this statement true or false? It is acceptable to multitask (e.g., typing) while a customer is speaking."
    statement: "It is acceptable to multitask (e.g., typing) while a customer is speaking."
    correct_answer: false
    xp_reward: 10

  - id: 17
    type: true_false
    question: "Is this statement true or false? Using the customer's name during conversation builds rapport."
    statement: "Using the customer's name during conversation builds rapport."
    correct_answer: true
    xp_reward: 10

  # MATCHING (18-20)
  - id: 18
    type: matching
    question: "Match the customer service phrase with its purpose"
    pairs:
      - left: "How may I help you?"
        right: "Open the conversation"
      - left: "Let me look into that for you"
        right: "Take ownership of the issue"
      - left: "I'll be right back"
        right: "Set expectation for absence"
      - left: "Thank you for your patience"
        right: "Acknowledge customer's time"
      - left: "Is there anything else?"
        right: "Ensure complete satisfaction"
    xp_reward: 25

  - id: 19
    type: matching
    question: "Match the customer type with the best approach"
    pairs:
      - left: "New/unsure customer"
        right: "Be patient, explain options clearly"
      - left: "In a hurry customer"
        right: "Be efficient, get to the point quickly"
      - left: "Detailed-oriented customer"
        right: "Provide thorough information"
      - left: "Returning customer"
        right: "Acknowledge their loyalty, personalized service"
      - left: "First-time customer"
        right: "Welcome warmly, explain processes"
    xp_reward: 25

  - id: 20
    type: matching
    question: "Match the customer question with the best response"
    pairs:
      - left: "Where can I find X?"
        right: "It's in aisle 4, on the left. Let me show you."
      - left: "Do you have this in a different color?"
        right: "Let me check our inventory for other colors."
      - left: "How much does this cost?"
        right: "That item is $49.99. Would you like me to check for any promotions?"
      - left: "Can I return this if I change my mind?"
        right: "Yes, we have a 30-day return policy with receipt."
      - left: "When will this be back in stock?"
        right: "Let me check our system for the expected arrival date."
    xp_reward: 25

  # FLASHCARDS (21-25)
  - id: 21
    type: flashcards
    question: "Flashcards: Opening Phrases"
    flashcards:
      - front: "How can I help you today?"
        right: "Standard customer greeting"
      - front: "Welcome to [Company Name]"
        right: "Warm onboarding"
      - front: "Good morning/afternoon/evening"
        right: "Time-appropriate greeting"
      - front: "Thank you for calling [Company Name]"
        right: "Phone greeting"
      - front: "I'm happy to help you with that"
        right: "Positive response"
    xp_reward: 30

  - id: 22
    type: flashcards
    question: "Flashcards: Clarifying Questions"
    flashcards:
      - front: "Just to confirm, you need..."
        right: "Verify understanding"
      - front: "Could you tell me more about that?"
        right: "Gather details"
      - front: "What specifically are you looking for?"
        right: "Narrow down request"
      - front: "When did this happen?"
        right: "Timeline clarification"
      - front: "Can you describe the issue?"
        right: "Problem specification"
    xp_reward: 30

  - id: 23
    type: flashcards
    question: "Flashcards: Going Above and Beyond"
    flashcards:
      - front: "Let me see what I can do"
        right: "Show willingness"
      - front: "I'll personally make sure this gets resolved"
        right: "Take ownership"
      - front: "I'll follow up with you tomorrow"
        right: "Proactive commitment"
      - front: "Is there anything specific you'd prefer?"
        right: "Show personalization"
      - front: "I'll make an exception for you this time"
        right: "Show flexibility"
    xp_reward: 30

  - id: 24
    type: flashcards
    question: "Flashcards: Closing Interactions"
    flashcards:
      - front: "Is there anything else I can help with?"
        right: "Offer additional assistance"
      - front: "Have a wonderful day"
        right: "Positive closing"
      - front: "Thank you for choosing us"
        right: "Appreciate their business"
      - front: "We look forward to serving you again"
        right: "Future-focused closing"
      - front: "Please come back anytime"
        right: "Open invitation"
    xp_reward: 30

  - id: 25
    type: flashcards
    question: "Flashcards: Phone Customer Service"
    flashcards:
      - front: "Thank you for calling. This is [Name] speaking"
        right: "Phone greeting"
      - front: "May I ask who's calling?"
        right: "Identify caller"
      - front: "I'll need to transfer you to that department"
        right: "Transfer notification"
      - front: "Let me make sure I have your number correct"
        right: "Verify call-back info"
      - front: "I'll call you back within the hour"
        right: "Promise return call"
    xp_reward: 30

  # ============================================
  # SECTION 2: HANDLING COMPLAINTS (26-55)
  # ============================================

  # MULTIPLE CHOICE (26-33)
  - id: 26
    type: multiple_choice
    question: "What is the first thing you should do when a customer complains?"
    options:
      - "Argue with them"
      - "Tell them they're wrong"
      - "Listen actively without interrupting"
      - "Walk away"
    answer: "Listen actively without interrupting"
    xp_reward: 15

  - id: 27
    type: multiple_choice
    question: "What is the best response to an angry customer?"
    options:
      - "Calm down!"
      - "I understand why you're upset. Let me help you resolve this."
      - "It's not my fault"
      - "You're overreacting"
    answer: "I understand why you're upset. Let me help you resolve this."
    xp_reward: 15

  - id: 28
    type: multiple_choice
    question: "What does the 'HEAT' model stand for in complaint handling?"
    options:
      - "Hear, Empathize, Apologize, Take action"
      - "Help, Explain, Argue, Terminate"
      - "Hold, Evaluate, Assess, Talk"
      - "Hurry, End, Avoid, Transfer"
    answer: "Hear, Empathize, Apologize, Take action"
    xp_reward: 15

  - id: 29
    type: multiple_choice
    question: "Why is it important to thank a customer for complaining?"
    options:
      - "It makes you look weak"
      - "It shows you value their feedback and gives you a chance to improve"
      - "It ends the conversation quickly"
      - "It confuses them"
    answer: "It shows you value their feedback and gives you a chance to improve"
    xp_reward: 15

  - id: 30
    type: multiple_choice
    question: "What should you avoid saying to a complaining customer?"
    options:
      - "I understand"
      - "That's not my department"
      - "Let me see what I can do"
      - "I apologize for the inconvenience"
    answer: "That's not my department"
    xp_reward: 15

  - id: 31
    type: multiple_choice
    question: "After resolving a complaint, what should you do?"
    answers:
      - "Forget about it"
      - "Follow up with the customer to ensure they are satisfied"
      - "Tell your colleagues about the difficult customer"
      - "Avoid that customer in the future"
    answer: "Follow up with the customer to ensure they are satisfied"
    xp_reward: 15

  - id: 32
    type: multiple_choice
    question: "What does 'escalation' mean in customer service?"
    options:
      - "Going up an elevator"
      - "Referring the issue to a higher authority or manager"
      - "Ignoring the issue"
      - "Ending the call"
    answer: "Referring the issue to a higher authority or manager"
    xp_reward: 15

  - id: 33
    type: multiple_choice
    question: "How should you document a customer complaint?"
    options:
      - "On a napkin"
      - "In your head"
      - "Clearly in the customer record with details of the issue and resolution"
      - "Don't document it"
    answer: "Clearly in the customer record with details of the issue and resolution"
    xp_reward: 15

  # FILL IN THE BLANK (34-39)
  - id: 34
    type: fill_blank
    question: "Complete the empathy statement"
    text_with_blank: "I ___ understand why you would be frustrated about this situation."
    options: ["completely", "totally", "fully", "absolutely"]
    correct_answer: "completely"
    xp_reward: 15

  - id: 35
    type: fill_blank
    question: "Complete the appreciation for feedback"
    text_with_blank: "Thank you for ___ this to our attention. We appreciate your honesty."
    options: ["bringing", "raising", "reporting", "telling"]
    correct_answer: "bringing"
    xp_reward: 15

  - id: 36
    type: fill_blank
    question: "Complete the resolution commitment"
    text_with_blank: "Let me take ___ of this issue and get it resolved for you."
    options: ["ownership", "care", "charge", "responsibility"]
    correct_answer: "ownership"
    xp_reward: 15

  - id: 37
    type: fill_blank
    question: "Complete the escalation phrase"
    text_with_blank: "I want to make sure this gets handled properly, so I'm going to ___ this to my manager."
    options: ["escalate", "raise", "send", "transfer"]
    correct_answer: "escalate"
    xp_reward: 15

  - id: 38
    type: fill_blank
    question: "Complete the follow-up promise"
    text_with_blank: "I will ___ back to you within 24 hours with an update."
    options: ["get", "reach", "call", "come"]
    correct_answer: "get"
    xp_reward: 15

  - id: 39
    type: fill_blank
    question: "Complete the satisfaction check"
    text_with_blank: "Does this resolution ___ your expectations?"
    options: ["meet", "satisfy", "fulfill", "match"]
    correct_answer: "meet"
    xp_reward: 15

  # TRUE / FALSE (40-42)
  - id: 40
    type: true_false
    question: "Is this statement true or false? You should never interrupt a complaining customer, even if they are being unreasonable."
    statement: "You should never interrupt a complaining customer, even if they are being unreasonable."
    correct_answer: true
    xp_reward: 10

  - id: 41
    type: true_false
    question: "Is this statement true or false? Taking complaints personally helps you resolve them better."
    statement: "Taking complaints personally helps you resolve them better."
    correct_answer: false
    xp_reward: 10

  - id: 42
    type: true_false
    question: "Is this statement true or false? A resolved complaint can turn an unhappy customer into a loyal one."
    statement: "A resolved complaint can turn an unhappy customer into a loyal one."
    correct_answer: true
    xp_reward: 10

  # MATCHING (43-46)
  - id: 43
    type: matching
    question: "Match the complaint handling step with the correct action"
    pairs:
      - left: "Hear"
        right: "Listen without interrupting"
      - left: "Empathize"
        right: "Show you understand their feelings"
      - left: "Apologize"
        right: "Say sorry for the situation"
      - left: "Take action"
        right: "Solve the problem or escalate"
    xp_reward: 25

  - id: 44
    type: matching
    question: "Match the complaint type with the appropriate response"
    pairs:
      - left: "Product defect complaint"
        right: "Apologize, offer replacement or refund, expedite shipping"
      - left: "Billing error complaint"
        right: "Apologize, correct the error immediately, confirm with customer"
      - left: "Shipping delay complaint"
        right: "Apologize, provide tracking, offer shipping fee refund if appropriate"
      - left: "Rude staff complaint"
        right: "Apologize sincerely, assure action will be taken, offer compensation"
      - left: "Policy dissatisfaction"
        right: "Explain policy rationale, acknowledge frustration, seek alternative if possible"
    xp_reward: 25

  - id: 45
    type: matching
    question: "Match the phrase with the complaint handling stage"
    pairs:
      - left: "Tell me more about what happened"
        right: "Hearing/Information gathering"
      - left: "I can see why that would be upsetting"
        right: "Empathy"
      - left: "I'm really sorry this happened to you"
        right: "Apology"
      - left: "Here's what I'm going to do for you"
        right: "Taking action"
      - left: "I'll follow up to make sure everything is resolved"
        right: "Closing/Follow-up"
    xp_reward: 25

  - id: 46
    type: matching
    question: "Match the escalation trigger with the appropriate action"
    pairs:
      - left: "Customer asks for a manager"
        right: "Get the manager immediately"
      - left: "Issue beyond your authority"
        right: "Ask supervisor for approval"
      - left: "Customer threatens legal action"
        right: "Escalate to legal department and senior management"
      - left: "You don't know how to solve the problem"
        right: "Ask colleague or supervisor for help"
      - left: "Customer is abusive or threatening"
        right: "Warn, then terminate call per policy"
    xp_reward: 25

  # FLASHCARDS (47-50)
  - id: 47
    type: flashcards
    question: "Flashcards: Empathy Phrases"
    flashcards:
      - front: "I understand how frustrating that must be"
        right: "Acknowledge emotion"
      - front: "I can see why you'd be upset about this"
        right: "Validate feelings"
      - front: "That sounds very inconvenient"
        right: "Acknowledge impact"
      - front: "I would feel the same way in your situation"
        right: "Personal connection"
      - front: "You have every right to be disappointed"
        right: "Validate complaint"
    xp_reward: 30

  - id: 48
    type: flashcards
    question: "Flashcards: Complaint Response Don'ts"
    flashcards:
      - front: "Don't say: Calm down"
        right: "It invalidates feelings"
      - front: "Don't say: It's not my fault"
        right: "Defensive, unhelpful"
      - front: "Don't say: That's our policy"
        right: "Cold, unhelpful"
      - front: "Don't say: You're wrong"
        right: "Confrontational"
      - front: "Don't say: Other customers don't complain"
        right: "Dismissive"
    xp_reward: 30

  - id: 49
    type: flashcards
    question: "Flashcards: Complaint Documentation"
    flashcards:
      - front: "Date and time of complaint"
        right: "When it happened"
      - front: "Customer name and contact"
        right: "Who complained"
      - front: "Description of issue"
        right: "What went wrong"
      - front: "Action taken"
        right: "How it was resolved"
      - front: "Resolution outcome"
        right: "Was customer satisfied"
    xp_reward: 30

  - id: 50
    type: flashcards
    question: "Flashcards: De-escalation Phrases"
    flashcards:
      - front: "Let me see what I can do"
        right: "Shows willingness"
      - front: "I want to help you resolve this"
        right: "Shows intention"
      - front: "Thank you for your patience"
        right: "Acknowledges their effort"
      - front: "Let me get the right person to help"
        right: "Shows action"
      - front: "You've made a fair point"
        right: "Validates concern"
    xp_reward: 30

  # TIMED CHALLENGES (51-55)
  - id: 51
    type: timed_challenge
    title: "Lightning Round: Complaint Handling"
    time_limit_seconds: 30
    questions_count: 5
    questions:
      - question: "First thing to do when customer complains"
        answer: "Listen without interrupting"
      - question: "What does H in HEAT stand for"
        answer: "Hear"
      - question: "What does E in HEAT stand for"
        answer: "Empathize"
      - question: "What does A in HEAT stand for"
        answer: "Apologize"
      - question: "What does T in HEAT stand for"
        answer: "Take action"
    xp_reward: 35

  - id: 52
    type: timed_challenge
    title: "Lightning Round: Complaint Responses"
    time_limit_seconds: 30
    questions_count: 5
    questions:
      - question: "Phrase to show you understand customer's feelings"
        answer: "I understand your frustration"
      - question: "What to say before explaining a solution"
        answer: "Here's what I can do"
      - question: "How to thank a customer for complaining"
        answer: "Thank you for bringing this to our attention"
      - question: "What to say when you need to involve a manager"
        answer: "Let me escalate this to my manager"
      - question: "How to check if customer is satisfied with resolution"
        answer: "Does this resolve your issue"
    xp_reward: 35

  - id: 53
    type: timed_challenge
    title: "Lightning Round: Escalation"
    time_limit_seconds: 30
    questions_count: 5
    questions:
      - question: "When to escalate a complaint"
        answer: "Beyond your authority"
      - question: "What to say when escalating"
        answer: "I'm going to escalate this"
      - question: "Who to escalate to"
        answer: "Supervisor or manager"
      - question: "What to do after escalation"
        answer: "Follow up with customer"
      - question: "What to avoid when escalating"
        answer: "Blaming the customer"
    xp_reward: 35

  - id: 54
    type: timed_challenge
    title: "Lightning Round: Angry Customers"
    time_limit_seconds: 30
    questions_count: 5
    questions:
      - question: "What to avoid saying to an angry customer"
        answer: "Calm down"
      - question: "First response to anger"
        answer: "I understand you're upset"
      - question: "What tone to use"
        answer: "Calm and professional"
      - question: "What to focus on"
        answer: "Solving the problem"
      - question: "How to end interaction with angry customer"
        answer: "Thank you for your patience"
    xp_reward: 35

  - id: 55
    type: timed_challenge
    title: "Lightning Round: Complaint Follow-up"
    time_limit_seconds: 30
    questions_count: 5
    questions:
      - question: "When to follow up after resolution"
        answer: "24 to 48 hours"
      - question: "What to ask in follow-up"
        answer: "Are you satisfied with the resolution"
      - question: "What to document"
        answer: "Resolution and customer response"
      - question: "What a resolved complaint can create"
        answer: "Loyal customer"
      - question: "How to end follow-up call"
        answer: "Thank you for your business"
    xp_reward: 35

  # ============================================
  # SECTION 3: SOLVING PROBLEMS (56-80)
  # ============================================

  # MULTIPLE CHOICE (56-63)
  - id: 56
    type: multiple_choice
    question: "What is the first step in problem-solving with a customer?"
    options:
      - "Offer a solution immediately"
      - "Blame someone else"
      - "Identify and define the problem clearly"
      - "Ignore the problem"
    answer: "Identify and define the problem clearly"
    xp_reward: 15

  - id: 57
    type: multiple_choice
    question: "What does it mean to 'think outside the box' in customer service?"
    options:
      - "Stand outside a cardboard box"
      - "Find creative, non-standard solutions to problems"
      - "Refuse to help"
      - "Follow rules exactly without exception"
    answer: "Find creative, non-standard solutions to problems"
    xp_reward: 15

  - id: 58
    type: multiple_choice
    question: "What should you do if the first solution doesn't work?"
    options:
      - "Give up"
      - "Blame the customer"
      - "Apologize and try an alternative solution"
      - "Pretend it worked"
    answer: "Apologize and try an alternative solution"
    xp_reward: 15

  - id: 59
    type: multiple_choice
    question: "What is a 'root cause' in problem-solving?"
    options:
      - "The cause that grows like a plant"
      - "The underlying, fundamental reason why a problem occurred"
      - "The first cause you think of"
      - "The cause that is easiest to fix"
    answer: "The underlying, fundamental reason why a problem occurred"
    xp_reward: 15

  - id: 60
    type: multiple_choice
    question: "How should you communicate a problem solution to a customer?"
    options:
      - "In technical jargon they won't understand"
      - "In clear, simple language explaining what will happen"
      - "Don't explain anything"
      - "In a very long, complex email"
    answer: "In clear, simple language explaining what will happen"
    xp_reward: 15

  - id: 61
    type: multiple_choice
    question: "What does 'troubleshooting' mean in customer service?"
    options:
      - "Shooting trouble with a gun"
      - "A systematic process of identifying and resolving problems"
      - "Giving up on a problem"
      - "Creating more problems"
    answer: "A systematic process of identifying and resolving problems"
    xp_reward: 15

  - id: 62
    type: multiple_choice
    question: "When should you involve a specialist to solve a customer problem?"
    options:
      - "Never"
      - "Only when you're lazy"
      - "When the problem is outside your expertise or authority"
      - "Always, for every problem"
    answer: "When the problem is outside your expertise or authority"
    xp_reward: 15

  - id: 63
    type: multiple_choice
    question: "What is a 'workaround' in problem-solving?"
