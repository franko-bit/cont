lesson:
  name: "International Business English"
  description: "Master professional international business communication including cross-cultural communication, global trade, business travel, networking, partnerships, and global markets"
  xp_reward: 500

exercises:

  # ============================================
  # SECTION 1: CROSS-CULTURAL COMMUNICATION (1-20)
  # ============================================

  # MULTIPLE CHOICE (1-7)
  - id: 1
    type: multiple_choice
    question: "What is 'cross-cultural communication'?"
    options:
      - "Communication across different cultures"
      - "The process of exchanging information between people from different cultural backgrounds"
      - "A type of language learning"
      - "Communication about culture"
    answer: "The process of exchanging information between people from different cultural backgrounds"
    xp_reward: 15

  - id: 2
    type: multiple_choice
    question: "What is 'high-context culture'?"
    options:
      - "A culture with high context"
      - "A culture where communication relies heavily on implicit messages, non-verbal cues, and shared context"
      - "A culture that talks a lot"
      - "A culture that is formal"
    answer: "A culture where communication relies heavily on implicit messages, non-verbal cues, and shared context"
    xp_reward: 15

  - id: 3
    type: multiple_choice
    question: "What is 'low-context culture'?"
    options:
      - "A culture with low context"
      - "A culture where communication is explicit, direct, and relies primarily on words"
      - "A culture that is informal"
      - "A culture that is quiet"
    answer: "A culture where communication is explicit, direct, and relies primarily on words"
    xp_reward: 15

  - id: 4
    type: multiple_choice
    question: "Which countries are typically considered high-context cultures?"
    options:
      - "USA, Germany, Canada"
      - "Japan, China, Arab countries"
      - "Australia, UK, New Zealand"
      - "Brazil, Mexico, Spain"
    answer: "Japan, China, Arab countries"
    xp_reward: 15

  - id: 5
    type: multiple_choice
    question: "What is 'cultural intelligence' (CQ)?"
    options:
      - "Intelligence about culture"
      - "The ability to function effectively across different cultural contexts"
      - "A type of IQ test"
      - "Knowledge of foreign languages"
    answer: "The ability to function effectively across different cultural contexts"
    xp_reward: 15

  - id: 6
    type: multiple_choice
    question: "What is 'chronemics' in cross-cultural communication?"
    options:
      - "The study of time"
      - "The study of how time perception and use varies across cultures"
      - "A type of chronograph"
      - "Time management"
    answer: "The study of how time perception and use varies across cultures"
    xp_reward: 15

  - id: 7
    type: multiple_choice
    question: "What is the difference between monochronic and polychronic cultures?"
    options:
      - "No difference"
      - "Monochronic cultures prefer doing one thing at a time; polychronic cultures prefer multitasking"
      - "Monochronic is faster; polychronic is slower"
      - "Monochronic is Western; polychronic is Eastern"
    answer: "Monochronic cultures prefer doing one thing at a time; polychronic cultures prefer multitasking"
    xp_reward: 15

  # FILL IN THE BLANK (8-12)
  - id: 8
    type: fill_blank
    question: "Complete the cultural awareness statement"
    text_with_blank: "When doing business in Japan, it's important to be aware of the cultural ___ around bowing and exchanging business cards."
    options: ["norms", "customs", "practices", "etiquette"]
    correct_answer: "norms"
    xp_reward: 15

  - id: 9
    type: fill_blank
    question: "Complete the direct vs indirect statement"
    text_with_blank: "In low-context cultures like Germany, communication tends to be very ___ and direct."
    options: ["explicit", "clear", "straightforward", "overt"]
    correct_answer: "explicit"
    xp_reward: 15

  - id: 10
    type: fill_blank
    question: "Complete the cultural sensitivity phrase"
    text_with_blank: "We need to be culturally ___ when negotiating with partners from different backgrounds."
    options: ["sensitive", "aware", "mindful", "attentive"]
    correct_answer: "sensitive"
    xp_reward: 15

  - id: 11
    type: fill_blank
    question: "Complete the time orientation statement"
    text_with_blank: "In ___ cultures, being late to a meeting is considered disrespectful."
    options: ["monochronic", "linear-time", "strict", "punctual"]
    correct_answer: "monochronic"
    xp_reward: 15

  - id: 12
    type: fill_blank
    question: "Complete the non-verbal communication statement"
    text_with_blank: "The 'OK' hand gesture has different ___ in different countries, so be careful using it."
    options: ["meanings", "interpretations", "significance", "implications"]
    correct_answer: "meanings"
    xp_reward: 15

  # TRUE / FALSE (13-15)
  - id: 13
    type: true_false
    question: "Is this statement true or false? Direct eye contact is considered respectful in all cultures."
    statement: "Direct eye contact is considered respectful in all cultures."
    correct_answer: false
    xp_reward: 10

  - id: 14
    type: true_false
    question: "Is this statement true or false? In many Asian cultures, saving face is an important concept in business interactions."
    statement: "In many Asian cultures, saving face is an important concept in business interactions."
    correct_answer: true
    xp_reward: 10

  - id: 15
    type: true_false
    question: "Is this statement true or false? Silence during a conversation always means agreement in every culture."
    statement: "Silence during a conversation always means agreement in every culture."
    correct_answer: false
    xp_reward: 10

  # MATCHING (16-18)
  - id: 16
    type: matching
    question: "Match the cultural dimension (Hofstede) with its description"
    pairs:
      - left: "Power distance"
