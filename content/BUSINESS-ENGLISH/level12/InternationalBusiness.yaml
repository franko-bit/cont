  # MULTIPLE CHOICE (41-48)
  - id: 41
    type: multiple_choice
    question: "What is 'international trade'?"
    options:
      - "Trade within a country"
      - "The exchange of goods, services, and capital across international borders"
      - "A type of trade agreement"
      - "Importing only"
    answer: "The exchange of goods, services, and capital across international borders"
    xp_reward: 15

  - id: 42
    type: multiple_choice
    question: "What is 'exporting'?"
    options:
      - "Porting out"
      - "Selling goods or services produced in one country to another country"
      - "Buying from another country"
      - "A type of shipping"
    answer: "Selling goods or services produced in one country to another country"
    xp_reward: 15

  - id: 43
    type: multiple_choice
    question: "What is 'importing'?"
    options:
      - "Porting in"
      - "Buying goods or services from another country for domestic use"
      - "Selling to another country"
      - "A type of customs"
    answer: "Buying goods or services from another country for domestic use"
    xp_reward: 15

  - id: 44
    type: multiple_choice
    question: "What is a 'tariff'?"
    options:
