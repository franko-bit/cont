        right: "Middle East"
      - left: "Direct 'no' is acceptable"
        right: "Netherlands, Germany"
      - left: "Gift giving is expected"
        right: "China, Japan, Korea"
      - left: "Decision making is hierarchical"
        right: "Many Asian and Latin American countries"
    xp_reward: 25

  # FLASHCARDS (19-20)
  - id: 19
    type: flashcards
    question: "Flashcards: Cultural Dimensions"
    flashcards:
      - front: "Universalism vs. particularism"
