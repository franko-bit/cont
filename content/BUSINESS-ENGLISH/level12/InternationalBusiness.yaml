    pairs:
      - left: "Handshake"
        right: "Firm vs. soft, duration varies by culture"
      - left: "Personal space"
        right: "Distance varies (Latin America closer, Northern Europe farther)"
      - left: "Nodding"
        right: "May mean 'I hear you' not 'I agree' in some cultures"
      - left: "Pointing"
        right: "Use whole hand in some cultures; pointing with finger is rude"
      - left: "Thumbs up"
        right: "Positive in West, offensive in parts of Middle East"
