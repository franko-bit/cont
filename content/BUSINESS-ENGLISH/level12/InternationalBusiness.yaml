    xp_reward: 30

  # ============================================
  # SECTION 2: GLOBAL BUSINESS VOCABULARY (21-40)
  # ============================================

  # MULTIPLE CHOICE (21-28)
  - id: 21
    type: multiple_choice
    question: "What is 'globalization'?"
    options:
      - "The process of becoming global"
      - "The increasing integration and interdependence of economies, cultures, and populations across the world"
      - "A type of business strategy"
      - "International trade only"
    answer: "The increasing integration and interdependence of economies, cultures, and populations across the world"
    xp_reward: 15

  - id: 22
    type: multiple_choice
    question: "What is a 'multinational corporation' (MNC)?"
