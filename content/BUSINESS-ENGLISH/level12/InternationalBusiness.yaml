  - id: 20
    type: flashcards
    question: "Flashcards: Cultural Faux Pas to Avoid"
    flashcards:
      - front: "Left hand for eating/giving"
        right: "Offensive in Middle East, India, parts of Africa"
      - front: "Showing soles of shoes"
        right: "Offensive in many Asian and Arab cultures"
      - front: "Touching someone's head"
        right: "Head is sacred in Buddhist cultures"
      - front: "Giving white flowers"
