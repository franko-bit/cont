      - "A tax imposed on imported or exported goods"
      - "A trade agreement"
      - "A shipping cost"
    answer: "A tax imposed on imported or exported goods"
    xp_reward: 15

  - id: 45
    type: multiple_choice
    question: "What is a 'quota' in international trade?"
    options:
