lesson:
  name: "Entrepreneurship and Startups"
  description: "Master professional entrepreneurship and startup communication including business ideas, models, fundraising, investor meetings, vocabulary, growth strategies, and pitch decks"
  xp_reward: 500

exercises:

  # ============================================
  # SECTION 1: BUSINESS IDEAS (1-20)
  # ============================================

  # MULTIPLE CHOICE (1-7)
  - id: 1
    type: multiple_choice
    question: "What is a 'business idea'?"
    options:
      - "An idea about business"
      - "A concept that can be used to start a business or create value"
      - "A type of business plan"
      - "A product only"
    answer: "A concept that can be used to start a business or create value"
    xp_reward: 15

  - id: 2
    type: multiple_choice
    question: "What is a 'pain point' in entrepreneurship?"
    options:
      - "A point of physical pain"
      - "A specific problem that potential customers are experiencing"
      - "A type of business metric"
      - "A financial issue"
    answer: "A specific problem that potential customers are experiencing"
    xp_reward: 15

  - id: 3
    type: multiple_choice
    question: "What is 'problem-solution fit'?"
    options:
      - "When a problem fits a solution"
      - "The validation that a proposed solution actually addresses a real customer problem"
      - "A type of market research"
      - "A product design phase"
    answer: "The validation that a proposed solution actually addresses a real customer problem"
    xp_reward: 15

  - id: 4
    type: multiple_choice
    question: "What is 'market validation'?"
    options:
      - "Validating a market"
      - "The process of testing a business idea with real potential customers to confirm demand"
      - "A type of market research"
      - "A sales process"
    answer: "The process of testing a business idea with real potential customers to confirm demand"
    xp_reward: 15

  - id: 5
    type: multiple_choice
    question: "What is a 'minimum viable product' (MVP)?"
    options:
      - "A product with minimum viability"
      - "The simplest version of a product that can be released to test core assumptions"
      - "A prototype"
      - "A beta version"
    answer: "The simplest version of a product that can be released to test core assumptions"
    xp_reward: 15

  - id: 6
    type: multiple_choice
    question: "What is 'customer discovery'?"
    options:
      - "Discovering customers"
      - "The process of interviewing potential customers to understand their problems and needs"
      - "A type of marketing"
      - "A sales technique"
    answer: "The process of interviewing potential customers to understand their problems and needs"
    xp_reward: 15

  - id: 7
    type: multiple_choice
    question: "What is the 'lean startup methodology'?"
    options:
      - "A lean approach to startups"
      - "A methodology that emphasizes building MVPs, measuring customer feedback, and iterating quickly"
      - "A type of business plan"
      - "A fundraising strategy"
    answer: "A methodology that emphasizes building MVPs, measuring customer feedback, and iterating quickly"
    xp_reward: 15

  # FILL IN THE BLANK (8-12)
  - id: 8
    type: fill_blank
    question: "Complete the problem identification"
    text_with_blank: "Our business idea addresses the ___ point of inefficient inventory management for small retailers."
    options: ["pain", "problem", "challenge", "issue"]
    correct_answer: "pain"
    xp_reward: 15

  - id: 9
    type: fill_blank
    question: "Complete the validation statement"
    text_with_blank: "We need to ___ our idea by talking to at least 50 potential customers."
    options: ["validate", "test", "confirm", "verify"]
    correct_answer: "validate"
    xp_reward: 15

  - id: 10
    type: fill_blank
    question: "Complete the MVP statement"
    text_with_blank: "We'll launch an ___ within three months to test our core assumptions."
    options: ["MVP", "minimum viable product", "prototype", "beta version"]
    correct_answer: "MVP"
    xp_reward: 15

  - id: 11
    type: fill_blank
    question: "Complete the customer discovery statement"
    text_with_blank: "We conducted 25 customer ___ interviews to understand their needs."
    options: ["discovery", "development", "validation", "research"]
    correct_answer: "discovery"
    xp_reward: 15

  - id: 12
    type: fill_blank
    question: "Complete the iteration statement"
    text_with_blank: "Based on customer feedback, we need to ___ our product design."
    options: ["iterate", "pivot", "change", "adjust"]
    correct_answer: "iterate"
    xp_reward: 15

  # TRUE / FALSE (13-15)
  - id: 13
    type: true_false
    question: "Is this statement true or false? The best business ideas come from solving your own problems."
    statement: "The best business ideas come from solving your own problems."
    correct_answer: true
    xp_reward: 10

  - id: 14
    type: true_false
    question: "Is this statement true or false? You should build a full product before talking to any customers."
    statement: "You should build a full product before talking to any customers."
    correct_answer: false
    xp_reward: 10

  - id: 15
    type: true_false
    question: "Is this statement true or false? Pivoting means completely abandoning your idea without learning anything."
    statement: "Pivoting means completely abandoning your idea without learning anything."
    correct_answer: false
    xp_reward: 10

  # MATCHING (16-18)
  - id: 16
    type: matching
    question: "Match the lean startup concept with its description"
    pairs:
      - left: "Build"
        right: "Create MVP based on hypotheses"
      - left: "Measure"
        right: "Collect data on how customers use product"
      - left: "Learn"
        right: "Analyze data to validate or invalidate hypotheses"
      - left: "Pivot"
        right: "Change strategy based on learning"
      - left: "Persevere"
        right: "Continue with same strategy if validated"
    xp_reward: 25

  - id: 17
    type: matching
    question: "Match the customer discovery question with its purpose"
    pairs:
      - left: "What's the hardest part of your job?"
        right: "Identify pain points"
      - left: "How do you currently solve this problem?"
        right: "Understand current alternatives"
      - left: "What don't you like about current solutions?"
        right: "Identify gaps in market"
      - left: "How much would you pay for a solution?"
        right: "Test price sensitivity"
      - left: "Would you be interested in trying our solution?"
        right: "Gauge early interest"
    xp_reward: 25

  - id: 18
    type: matching
    question: "Match the idea generation technique with its description"
    pairs:
      - left: "Brainstorming"
        right: "Generating many ideas without judgment"
      - left: "Problem interviews"
        right: "Finding problems through customer conversations"
      - left: "Competitor analysis"
        right: "Identifying gaps in existing solutions"
      - left: "Trend spotting"
        right: "Identifying emerging market trends"
      - left: "SCAMPER"
        right: "Substitute, Combine, Adapt, Modify, Put to other use, Eliminate, Reverse"
    xp_reward: 25

  # FLASHCARDS (19-20)
  - id: 19
    type: flashcards
    question: "Flashcards: Idea Validation Questions"
    flashcards:
      - front: "Is the problem real?"
        right: "Does anyone actually need this solved?"
      - front: "Is the problem urgent?"
        right: "Do people need a solution now?"
      - front: "Is the market large enough?"
        right: "Can this be a sustainable business?"
      - front: "Can we solve it profitably?"
        right: "Is there a viable business model?"
      - front: "Why us?"
        right: "What is our unfair advantage?"
    xp_reward: 30

  - id: 20
    type: flashcards
    question: "Flashcards: Common Startup Mistakes"
    flashcards:
      - front: "Building before validating"
        right: "Wasting time on unwanted features"
      - front: "Solving non-urgent problems"
        right: "Customers won't pay for nice-to-haves"
      - front: "Targeting everyone"
        right: "Too broad, no clear focus"
      - front: "Ignoring competition"
        right: "Entering overcrowded market"
      - front: "Founder solution bias"
        right: "Falling in love with your own idea"
    xp_reward: 30

  # ============================================
  # SECTION 2: BUSINESS MODELS (21-40)
  # ============================================

  # MULTIPLE CHOICE (21-28)
  - id: 21
    type: multiple_choice
    question: "What is a 'business model'?"
    options:
      - "A model of a business"
      - "The plan for how a company creates, delivers, and captures value"
      - "A type of business plan"
      - "A revenue model"
    answer: "The plan for how a company creates, delivers, and captures value"
    xp_reward: 15

  - id: 22
    type: multiple_choice
    question: "What is a 'subscription business model'?"
    options:
      - "A model about subscriptions"
      - "A model where customers pay recurring fees for ongoing access to a product or service"
      - "A one-time payment model"
      - "A freemium model"
    answer: "A model where customers pay recurring fees for ongoing access to a product or service"
    xp_reward: 15

  - id: 23
    type: multiple_choice
    question: "What is a 'freemium business model'?"
    options:
      - "A model that is free and premium"
      - "A model where basic features are free, premium features require payment"
      - "A free-only model"
      - "A premium-only model"
    answer: "A model where basic features are free, premium features require payment"
    xp_reward: 15

  - id: 24
    type: multiple_choice
    question: "What is a 'marketplace business model'?"
    options:
      - "A marketplace for businesses"
      - "A platform connecting buyers and sellers, taking a transaction fee"
      - "A retail model"
      - "An e-commerce model"
    answer: "A platform connecting buyers and sellers, taking a transaction fee"
    xp_reward: 15

  - id: 25
    type: multiple_choice
    question: "What is a 'SaaS' business model?"
    options:
      - "Software as a Service - customers pay subscription for cloud-based software"
      - "Software as a Solution"
      - "Service as a Software"
      - "Sales as a Service"
    answer: "Software as a Service - customers pay subscription for cloud-based software"
    xp_reward: 15

  - id: 26
    type: multiple_choice
    question: "What is the 'razor and blades' business model?"
    options:
      - "A model about razors"
      - "Selling a durable product at low price and consumables at high price"
      - "A subscription model"
      - "A freemium model"
    answer: "Selling a durable product at low price and consumables at high price"
    xp_reward: 15

  - id: 27
    type: multiple_choice
    question: "What is 'Customer Lifetime Value' (LTV) in a business model?"
    options:
      - "The value of a customer's life"
      - "The total revenue a customer generates over their entire relationship with a company"
      - "The cost to acquire a customer"
      - "The profit per customer"
    answer: "The total revenue a customer generates over their entire relationship with a company"
    xp_reward: 15

  - id: 28
    type: multiple_choice
    question: "What is 'Customer Acquisition Cost' (CAC)?"
    options:
      - "The cost to acquire a customer"
      - "The total cost of sales and marketing to acquire a new customer"
      - "The cost of customer service"
      - "The product cost"
    answer: "The total cost of sales and marketing to acquire a new customer"
    xp_reward: 15

  # FILL IN THE BLANK (29-33)
  - id: 29
    type: fill_blank
    question: "Complete the LTV:CAC statement"
    text_with_blank: "A healthy business model typically has an LTV to CAC ratio of at least ___."
    options: ["3:1", "3 to 1", "three to one", "greater than 3"]
    correct_answer: "3:1"
    xp_reward: 15

  - id: 30
    type: fill_blank
    question: "Complete the unit economics statement"
    text_with_blank: "We need to have positive unit ___ , meaning each sale generates a profit."
    options: ["economics", "profit", "margins", "contribution"]
    correct_answer: "economics"
    xp_reward: 15

  - id: 31
    type: fill_blank
    question: "Complete the revenue stream statement"
    text_with_blank: "Our primary ___ stream comes from monthly subscription fees."
    options: ["revenue", "income", "profit", "cash flow"]
    correct_answer: "revenue"
    xp_reward: 15

  - id: 32
    type: fill_blank
    question: "Complete the gross margin statement"
    text_with_blank: "Our subscription model has high gross ___ since there are minimal variable costs."
    options: ["margins", "profit", "returns", "yields"]
    correct_answer: "margins"
    xp_reward: 15

  - id: 33
    type: fill_blank
    question: "Complete the churn statement"
    text_with_blank: "In a subscription model, reducing customer ___ is critical for long-term success."
    options: ["churn", "attrition", "turnover", "loss"]
    correct_answer: "churn"
    xp_reward: 15

  # TRUE / FALSE (34-36)
  - id: 34
    type: true_false
    question: "Is this statement true or false? The same business model works for every startup."
    statement: "The same business model works for every startup."
    correct_answer: false
    xp_reward: 10

  - id: 35
    type: true_false
    question: "Is this statement true or false? In a freemium model, typically 2-5% of users convert to paid."
    statement: "In a freemium model, typically 2-5% of users convert to paid."
    correct_answer: true
    xp_reward: 10

  - id: 36
    type: true_false
    question: "Is this statement true or false? Positive unit economics means each customer generates profit before accounting for fixed costs."
    statement: "Positive unit economics means each customer generates profit before accounting for fixed costs."
    correct_answer: true
    xp_reward: 10

  # MATCHING (37-38)
  - id: 37
    type: matching
    question: "Match the business model with its example"
    pairs:
