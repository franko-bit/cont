      - "A type of venture capital fund"
      - "A bank lender"
    answer: "A wealthy individual who invests personal money in early-stage startups"
    xp_reward: 15

  - id: 44
    type: multiple_choice
    question: "What is 'venture capital' (VC)?"
    options:
      - "Capital for ventures"
      - "Professional investment funds that invest in high-growth startups in exchange for equity"
      - "A type of loan"
      - "Government grants"
    answer: "Professional investment funds that invest in high-growth startups in exchange for equity"
    xp_reward: 15

  - id: 45
    type: multiple_choice
    question: "What is a 'term sheet' in fundraising?"
    options:
      - "A sheet with terms"
      - "A non-binding document outlining the key terms of a proposed investment"
      - "A binding contract"
      - "An investment agreement"
    answer: "A non-binding document outlining the key terms of a proposed investment"
    xp_reward: 15

  - id: 46
    type: multiple_choice
    question: "What is 'valuation' in startup fundraising?"
    options:
      - "The value of something"
      - "The estimated worth of a company, used to determine how much equity investors get for their money"
      - "The price of shares"
      - "The market cap"
    answer: "The estimated worth of a company, used to determine how much equity investors get for their money"
    xp_reward: 15

  - id: 47
    type: multiple_choice
    question: "What is a 'convertible note'?"
