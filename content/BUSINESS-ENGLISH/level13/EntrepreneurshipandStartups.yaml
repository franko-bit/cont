  # ============================================
  # SECTION 3: FUNDRAISING (41-60)
  # ============================================

  # MULTIPLE CHOICE (41-48)
  - id: 41
    type: multiple_choice
    question: "What is 'bootstrapping' in startup funding?"
    options:
      - "Pulling yourself up by your bootstraps"
      - "Funding a startup using personal savings and revenue, without external investment"
      - "A type of loan"
      - "A grant"
    answer: "Funding a startup using personal savings and revenue, without external investment"
    xp_reward: 15

  - id: 42
    type: multiple_choice
    question: "What are 'friends and family' investors?"
    options:
      - "Investors who are friends and family"
