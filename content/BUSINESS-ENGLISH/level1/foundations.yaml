  # ============================================
  # SECTION 3: COMPANY & JOB TITLES (31-50)
  # ============================================

  # MULTIPLE CHOICE (31-35)
  - id: 31
    type: multiple_choice
    question: "Who is the highest-ranking executive in a company?"
    options:
      - "Manager"
      - "Director"
      - "CEO (Chief Executive Officer)"
      - "Team Lead"
