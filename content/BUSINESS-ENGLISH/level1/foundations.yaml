lesson:
  name: "Business English Foundations"
  description: "Professional Business English covering greetings, introductions, company roles, workplace vocabulary, etiquette, and small talk"
  xp_reward: 500

exercises:

  # ============================================
  # SECTION 1: PROFESSIONAL GREETINGS (1-15)
  # ============================================

  # MULTIPLE CHOICE (1-5)
  - id: 1
    type: multiple_choice
    question: "Which greeting is most appropriate for a formal business email to a client you've never met?"
    options:
      - "Hey there,"
      - "Hi guys,"
      - "Dear Mr. Johnson,"
      - "Yo,"
    answer: "Dear Mr. Johnson,"
    xp_reward: 15

  - id: 2
    type: multiple_choice
    question: "Which closing is most professional for a business email?"
    options:
      - "Best regards,"
      - "Later,"
      - "Cheers,"
      - "Talk soon,"
    answer: "Best regards,"
    xp_reward: 15

  - id: 3
    type: multiple_choice
    question: "When answering a business call, which greeting is most professional?"
    options:
      - "Yeah, who's this?"
      - "Hello, this is Sarah from ABC Corp. How may I help you?"
      - "Hey, what's up?"
      - "Talk to me."
    answer: "Hello, this is Sarah from ABC Corp. How may I help you?"
    xp_reward: 15

  - id: 4
    type: multiple_choice
    question: "What is the most formal way to address a female recipient when you don't know her marital status?"
    options:
      - "Mrs."
      - "Miss"
      - "Ms."
      - "Madam"
    answer: "Ms."
    xp_reward: 15

  - id: 5
    type: multiple_choice
    question: "Which greeting is appropriate when emailing a group of colleagues you know well?"
    options:
      - "Dear Sirs,"
      - "To whom it may concern,"
      - "Hi everyone,"
      - "Gentlemen,"
    answer: "Hi everyone,"
    xp_reward: 15

  # FILL IN THE BLANK (6-10)
  - id: 6
    type: fill_blank
    question: "Complete the professional greeting"
    text_with_blank: "___ Mr. Johnson, I hope this email finds you well."
    options: ["Hey", "Dear", "Hi", "Hello there"]
    correct_answer: "Dear"
    xp_reward: 15

  - id: 7
    type: fill_blank
    question: "Complete the sentence with the professional closing"
    text_with_blank: "Thank you for your time. ___ regards, Michael Chen"
    options: ["Best", "Warm", "Kind", "Friendly"]
    correct_answer: "Best"
    xp_reward: 15

  - id: 8
    type: fill_blank
    question: "Complete the professional phone greeting"
    text_with_blank: "Good morning, you've reached the office of David Kim. How ___ I help you?"
    options: ["can", "may", "should", "would"]
    correct_answer: "may"
    xp_reward: 15

  - id: 9
    type: fill_blank
    question: "Complete the formal email opening"
    text_with_blank: "I am writing to ___ regarding your job posting."
    options: ["ask", "question", "inquire", "request"]
    correct_answer: "inquire"
    xp_reward: 15

  - id: 10
    type: fill_blank
    question: "Complete the polite follow-up"
    text_with_blank: "I hope you had a ___ weekend."
    options: ["nice", "good", "pleasant", "wonderful"]
    correct_answer: "pleasant"
    xp_reward: 15

  # TRUE / FALSE (11-13)
  - id: 11
    type: true_false
    question: "Is this statement true or false? It is professional to address a senior executive as 'Hey dude' in an email."
    statement: "It is professional to address a senior executive as 'Hey dude' in an email."
    correct_answer: false
    xp_reward: 10

  - id: 12
    type: true_false
    question: "Is this statement true or false? Using 'Please' and 'Thank you' in business emails shows professionalism."
    statement: "Using 'Please' and 'Thank you' in business emails shows professionalism."
    correct_answer: true
    xp_reward: 10

  - id: 13
    type: true_false
    question: "Is this statement true or false? Responding to emails within 24-48 hours is considered good business practice."
    statement: "Responding to emails within 24-48 hours is considered good business practice."
    correct_answer: true
    xp_reward: 10

  # MATCHING (14-15)
  - id: 14
    type: matching
    question: "Match the greeting with the appropriate situation"
    pairs:
      - left: "Dear Sir or Madam,"
        right: "Formal email to unknown recipient"
      - left: "Hi Sarah,"
        right: "Casual email to a colleague you know well"
      - left: "Good morning, everyone"
        right: "Team meeting opening"
      - left: "To the Hiring Manager,"
        right: "Job application cover letter"
      - left: "Dear Dr. Williams,"
        right: "Email to someone with a doctorate degree"
    xp_reward: 25

  - id: 15
    type: matching
    question: "Match the email closing with its formality level"
    pairs:
      - left: "Sincerely,"
        right: "Very formal"
      - left: "Best regards,"
        right: "Standard professional"
      - left: "Warmly,"
        right: "Friendly but professional"
      - left: "Thanks,"
        right: "Informal/casual"
      - left: "Yours faithfully,"
        right: "Formal (when name unknown)"
    xp_reward: 25

  # ============================================
  # SECTION 2: INTRODUCING YOURSELF (16-30)
  # ============================================

  # MULTIPLE CHOICE (16-20)
  - id: 16
    type: multiple_choice
    question: "Which is the most professional way to introduce yourself in a meeting?"
    options:
      - "Hi, I'm John"
      - "Hey everyone, it's me, John"
      - "Good morning, I'm John Smith from the Marketing Department"
      - "Yo, I'm John"
    answer: "Good morning, I'm John Smith from the Marketing Department"
    xp_reward: 15

  - id: 17
    type: multiple_choice
    question: "What should you say after someone introduces themselves to you?"
    options:
      - "Whatever"
      - "Nice to meet you"
      - "I don't care"
      - "Tell me more"
    answer: "Nice to meet you"
    xp_reward: 15

  - id: 18
    type: multiple_choice
    question: "Which phrase correctly states your job title?"
    options:
      - "I am doing a manager"
      - "I work like a designer"
      - "I work as a marketing specialist"
      - "I make engineer"
    answer: "I work as a marketing specialist"
    xp_reward: 15

  - id: 19
    type: multiple_choice
    question: "Which introduction includes your role and department?"
    options:
      - "I'm Sarah"
      - "Hello, I'm Sarah from Accounting"
      - "Hi, I'm Sarah, nice to meet you"
      - "Hey, I'm Sarah"
    answer: "Hello, I'm Sarah from Accounting"
    xp_reward: 15

  - id: 20
    type: multiple_choice
    question: "When shaking hands professionally, you should:"
    options:
      - "Squeeze as hard as possible"
      - "Offer a limp hand"
      - "Make eye contact and offer a firm handshake"
      - "Avoid eye contact"
    answer: "Make eye contact and offer a firm handshake"
    xp_reward: 15

  # FILL IN THE BLANK (21-25)
  - id: 21
    type: fill_blank
    question: "Complete the professional introduction"
    text_with_blank: "Allow me to ___ myself. My name is David Kim."
    options: ["present", "introduce", "show", "tell"]
    correct_answer: "introduce"
    xp_reward: 15

  - id: 22
    type: fill_blank
    question: "Complete the introduction with your role"
    text_with_blank: "Hello, I'm Jessica. I ___ as a business analyst at TechCorp."
    options: ["job", "work", "do", "am"]
    correct_answer: "work"
    xp_reward: 15

  - id: 23
    type: fill_blank
    question: "Complete the response to an introduction"
    text_with_blank: "It's a ___ to meet you, Mr. Johnson."
    options: ["pleasure", "happy", "good", "nice"]
    correct_answer: "pleasure"
    xp_reward: 15

  - id: 24
    type: fill_blank
    question: "Complete the introductory sentence about experience"
    text_with_blank: "I have five years of ___ in project management."
    options: ["experience", "work", "job", "career"]
    correct_answer: "experience"
    xp_reward: 15

  - id: 25
    type: fill_blank
    question: "Complete the phrase about your background"
    text_with_blank: "My background is ___ finance and accounting."
    options: ["on", "at", "in", "for"]
    correct_answer: "in"
    xp_reward: 15

  # TRUE / FALSE (26-28)
  - id: 26
    type: true_false
    question: "Is this statement true or false? It is professional to interrupt someone while they are introducing themselves."
    statement: "It is professional to interrupt someone while they are introducing themselves."
    correct_answer: false
    xp_reward: 10

  - id: 27
    type: true_false
    question: "Is this statement true or false? You should always stand when introducing yourself to a senior executive."
    statement: "You should always stand when introducing yourself to a senior executive."
    correct_answer: true
    xp_reward: 10

  - id: 28
    type: true_false
    question: "Is this statement true or false? Repeating a person's name after they introduce themselves helps you remember it."
    statement: "Repeating a person's name after they introduce themselves helps you remember it."
    correct_answer: true
    xp_reward: 10

  # MATCHING (29-30)
  - id: 29
    type: matching
    question: "Match the introduction phrase with its purpose"
    pairs:
      - left: "Allow me to introduce myself"
        right: "Starting a self-introduction"
      - left: "I'm reaching out because..."
        right: "Stating the purpose of your email"
      - left: "I look forward to hearing from you"
        right: "Professional closing expectation"
      - left: "Please don't hesitate to contact me"
        right: "Inviting further communication"
      - left: "Thank you for your consideration"
        right: "Polite closing for requests"
    xp_reward: 25

  - id: 30
    type: matching
    question: "Match the introduction situation with the correct phrase"
    pairs:
      - left: "First meeting with a client"
        right: "It's a pleasure to meet you"
      - left: "Introducing yourself on a conference call"
