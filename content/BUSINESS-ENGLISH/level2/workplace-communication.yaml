lesson:
  name: "Workplace Communication"
  description: "Master professional communication skills for phone calls, video meetings, instructions, requests, and clarifications"
  xp_reward: 500

exercises:

  # ============================================
  # SECTION 1: PHONE CONVERSATIONS (1-20)
  # ============================================

  # MULTIPLE CHOICE (1-5)
  - id: 1
    type: multiple_choice
    question: "How should you answer a professional business phone call?"
    options:
      - "Yeah, hello?"
      - "Hello, this is John Smith from ABC Corp. How may I help you?"
      - "Who is this?"
      - "Talk to me."
    answer: "Hello, this is John Smith from ABC Corp. How may I help you?"
    xp_reward: 15

  - id: 2
    type: multiple_choice
    question: "What should you say if the person someone is calling for is unavailable?"
    options:
      - "They're not here. Call back later."
      - "I'm sorry, Ms. Johnson is in a meeting right now. May I take a message?"
      - "She's busy. What do you want?"
      - "I don't know where she is."
    answer: "I'm sorry, Ms. Johnson is in a meeting right now. May I take a message?"
    xp_reward: 15

  - id: 3
    type: multiple_choice
    question: "What does 'Could you please hold?' mean on a phone call?"
    options:
      - "Please wait on the line"
      - "Please call back later"
      - "Please hang up now"
      - "Please speak louder"
    answer: "Please wait on the line"
    xp_reward: 15

  - id: 4
    type: multiple_choice
    question: "How do you ask to speak to someone professionally?"
    options:
      - "Let me talk to John"
      - "Is John there?"
      - "May I please speak with Mr. Johnson?"
      - "I need to talk to John now"
    answer: "May I please speak with Mr. Johnson?"
    xp_reward: 15

  - id: 5
    type: multiple_choice
    question: "What should you say when you can't hear the other person clearly?"
    options:
      - "What? I can't hear you!"
      - "You're too quiet. Speak up!"
      - "I'm sorry, you're breaking up. Could you please repeat that?"
      - "This line is bad. Call me back."
    answer: "I'm sorry, you're breaking up. Could you please repeat that?"
    xp_reward: 15

  # FILL IN THE BLANK (6-10)
  - id: 6
    type: fill_blank
    question: "Complete the phone greeting"
    text_with_blank: "Good morning, you've reached the office of David Kim. How ___ I help you?"
    options: ["can", "may", "should", "would"]
    correct_answer: "may"
    xp_reward: 15

  - id: 7
    type: fill_blank
    question: "Complete the message-taking phrase"
    text_with_blank: "I'm sorry, she's unavailable at the moment. May I ___ a message?"
    options: ["take", "get", "leave", "give"]
    correct_answer: "take"
    xp_reward: 15

  - id: 8
    type: fill_blank
    question: "Complete the request to be transferred"
    text_with_blank: "Could you please ___ me to the billing department?"
    options: ["send", "transfer", "connect", "forward"]
    correct_answer: "transfer"
    xp_reward: 15

  - id: 9
    type: fill_blank
    question: "Complete the call ending phrase"
    text_with_blank: "Thank you for your call. Have a ___ day."
    options: ["good", "great", "nice", "pleasant"]
    correct_answer: "pleasant"
    xp_reward: 15

  - id: 10
    type: fill_blank
    question: "Complete the call-back promise"
    text_with_blank: "I'll have Mr. Johnson ___ your call as soon as possible."
    options: ["return", "call", "answer", "respond"]
    correct_answer: "return"
    xp_reward: 15

  # TRUE / FALSE (11-13)
  - id: 11
    type: true_false
    question: "Is this statement true or false? Eating or chewing gum during a business phone call is acceptable."
    statement: "Eating or chewing gum during a business phone call is acceptable."
    correct_answer: false
    xp_reward: 10

  - id: 12
    type: true_false
    question: "Is this statement true or false? You should always state your name and company when making a business call."
    statement: "You should always state your name and company when making a business call."
    correct_answer: true
    xp_reward: 10

  - id: 13
    type: true_false
    question: "Is this statement true or false? Using speakerphone without telling the other person is considered rude."
    statement: "Using speakerphone without telling the other person is considered rude."
    correct_answer: true
    xp_reward: 10

  # MATCHING (14-16)
  - id: 14
    type: matching
    question: "Match the phone phrase with its meaning"
    pairs:
      - left: "Could you please hold?"
        right: "Please wait on the line"
      - left: "I'll put you through"
        right: "I'll connect you"
      - left: "May I ask who's calling?"
        right: "Please identify yourself"
      - left: "I'm afraid the line is busy"
        right: "The person is on another call"
      - left: "Can I call you back?"
        right: "I will return your call later"
    xp_reward: 25

  - id: 15
    type: matching
    question: "Match the phone problem with the appropriate response"
    pairs:
      - left: "Can't hear the other person"
        right: "I'm sorry, you're breaking up"
      - left: "Person is not available"
        right: "May I take a message?"
      - left: "Wrong number"
        right: "I'm sorry, you have the wrong number"
      - left: "Need to end the call"
        right: "Thank you for your time. Goodbye."
      - left: "Call dropped"
        right: "I'll call you right back"
    xp_reward: 25

  - id: 16
    type: matching
    question: "Match the message-taking information"
    pairs:
      - left: "Caller's name"
        right: "May I ask who's calling?"
      - left: "Caller's phone number"
        right: "What's the best number to reach you?"
      - left: "Reason for call"
        right: "What is this regarding?"
      - left: "Return call time"
        right: "When is a good time to return your call?"
      - left: "Urgency level"
        right: "Is this urgent or can it wait?"
    xp_reward: 25

  # FLASHCARDS (17-20)
  - id: 17
    type: flashcards
    question: "Flashcards: Phone Call Openings"
    flashcards:
      - front: "Hello, this is [Name] from [Company]"
        back: "Standard professional phone greeting"
      - front: "May I please speak with [Name]?"
        back: "Polite way to ask for someone"
      - front: "Is this a good time to talk?"
        back: "Respects the other person's schedule"
      - front: "I'm returning your call"
        back: "Used when calling someone back"
      - front: "Thank you for taking my call"
        back: "Polite opening after someone answers"
    xp_reward: 30

  - id: 18
    type: flashcards
    question: "Flashcards: Phone Call Closings"
    flashcards:
      - front: "Thank you for your time"
        back: "Polite way to end a call"
      - front: "Have a pleasant day"
        back: "Professional closing"
      - front: "I look forward to hearing from you"
        back: "When expecting a follow-up"
      - front: "Please don't hesitate to call again"
        back: "Inviting future contact"
      - front: "I'll send that information right away"
        back: "Confirming follow-up action"
    xp_reward: 30

  - id: 19
    type: flashcards
    question: "Flashcards: Taking Messages"
    flashcards:
      - front: "May I take a message?"
        back: "Offer when person is unavailable"
      - front: "What is this regarding?"
        back: "Ask for the reason of the call"
      - front: "I'll make sure they get the message"
        back: "Confirms message will be delivered"
      - front: "Could you spell that for me?"
        back: "To ensure correct spelling"
      - front: "I'll have them call you back"
        back: "Promise of return call"
    xp_reward: 30

  - id: 20
    type: flashcards
    question: "Flashcards: Handling Difficult Calls"
    flashcards:
      - front: "I understand your frustration"
        back: "Acknowledges an angry caller's feelings"
      - front: "Let me look into that for you"
        back: "Takes responsibility to find answers"
      - front: "I apologize for the inconvenience"
        back: "Professional apology"
      - front: "Let me transfer you to someone who can help"
        back: "Directs caller to right person"
      - front: "I will personally ensure this is resolved"
        back: "Shows commitment to solving the problem"
    xp_reward: 30

  # ============================================
  # SECTION 2: VIDEO CALLS (21-40)
  # ============================================

  # MULTIPLE CHOICE (21-25)
  - id: 21
    type: multiple_choice
    question: "What should you do before joining a video call?"
    options:
      - "Start eating lunch"
      - "Check your camera angle, lighting, and background"
      - "Turn off your computer"
      - "Put on headphones and ignore the call"
    answer: "Check your camera angle, lighting, and background"
    xp_reward: 15

  - id: 22
    type: multiple_choice
    question: "When should you mute your microphone on a video call?"
    options:
      - "Never"
      - "Only when you are speaking"
      - "When you are not speaking to avoid background noise"
      - "Only at the beginning of the call"
    answer: "When you are not speaking to avoid background noise"
    xp_reward: 15

  - id: 23
    type: multiple_choice
    question: "What does it mean to 'share your screen'?"
    options:
      - "Show a picture of your desk"
      - "Allow others to see your computer screen"
      - "Turn off your camera"
      - "Send a photo to everyone"
    answer: "Allow others to see your computer screen"
    xp_reward: 15

  - id: 24
    type: multiple_choice
    question: "If your video freezes during a call, what should you do?"
    options:
      - "Yell at your computer"
      - "Ignore it and keep talking"
      - "Say 'I think my video has frozen. Can you still hear me?'"
      - "Hang up immediately"
    answer: "Say 'I think my video has frozen. Can you still hear me?'"
    xp_reward: 15

  - id: 25
    type: multiple_choice
    question: "What is appropriate video call attire?"
    options:
      - "Pajamas"
      - "Workout clothes"
      - "Professional or business casual attire"
      - "Swimwear"
    answer: "Professional or business casual attire"
    xp_reward: 15

  # FILL IN THE BLANK (26-30)
  - id: 26
    type: fill_blank
    question: "Complete the video call opening"
    text_with_blank: "Can everyone ___ me clearly?"
    options: ["see", "hear", "view", "watch"]
    correct_answer: "see"
    xp_reward: 15

  - id: 27
    type: fill_blank
    question: "Complete the audio check question"
    text_with_blank: "You are ___ on mute. Could you please unmute yourself?"
    options: ["still", "yet", "already", "currently"]
    correct_answer: "still"
    xp_reward: 15

  - id: 28
    type: fill_blank
    question: "Complete the screen sharing request"
    text_with_blank: "Could you please ___ your screen so we can see the presentation?"
    options: ["share", "show", "display", "present"]
    correct_answer: "share"
    xp_reward: 15

  - id: 29
    type: fill_blank
    question: "Complete the turn-taking phrase"
    text_with_blank: "I'm sorry to interrupt, but may I ___ something?"
    options: ["say", "add", "speak", "tell"]
    correct_answer: "add"
    xp_reward: 15

  - id: 30
    type: fill_blank
    question: "Complete the technical issue phrase"
    text_with_blank: "I think we ___ connection. Can you still hear me?"
    options: ["lost", "missed", "dropped", "failed"]
    correct_answer: "lost"
    xp_reward: 15

  # TRUE / FALSE (31-33)
  - id: 31
    type: true_false
    question: "Is this statement true or false? It is acceptable to multitask on other work during a video call."
    statement: "It is acceptable to multitask on other work during a video call."
    correct_answer: false
    xp_reward: 10

  - id: 32
    type: true_false
    question: "Is this statement true or false? Looking at the camera helps simulate eye contact on video calls."
    statement: "Looking at the camera helps simulate eye contact on video calls."
    correct_answer: true
    xp_reward: 10

  - id: 33
    type: true_false
    question: "Is this statement true or false? You should always introduce yourself at the start of a video call, even with regular team members."
    statement: "You should always introduce yourself at the start of a video call, even with regular team members."
    correct_answer: false
    xp_reward: 10

  # MATCHING (34-36)
  - id: 34
    type: matching
    question: "Match the video call feature with its use"
    pairs:
      - left: "Mute"
        right: "Turns off your microphone"
      - left: "Share screen"
        right: "Shows your computer display to others"
      - left: "Chat"
        right: "Send text messages during the call"
      - left: "Raise hand"
        right: "Signal that you want to speak"
      - left: "Record"
        right: "Saves the meeting for later viewing"
    xp_reward: 25

  - id: 35
    type: matching
    question: "Match the technical problem with the solution"
    pairs:
      - left: "No one can hear you"
        right: "Check if you are on mute"
      - left: "Video is blurry"
        right: "Check your internet connection"
      - left: "Echo on the line"
        right: "Use headphones or lower speaker volume"
      - left: "Can't share screen"
        right: "Check your settings or ask host for permission"
      - left: "Call keeps dropping"
        right: "Switch to phone audio"
    xp_reward: 25

  - id: 36
    type: matching
    question: "Match the video call phrase with the situation"
    pairs:
      - left: "You're breaking up"
        right: "Audio is cutting in and out"
      - left: "Can everyone see my screen?"
        right: "After starting screen share"
      - left: "I'll type that in the chat"
        right: "Sharing a link or information"
      - left: "Let me go off camera for a moment"
        right: "Need to step away briefly"
      - left: "I'll send a recap after the meeting"
        right: "Summary of decisions and action items"
    xp_reward: 25

  # FLASHCARDS (37-40)
  - id: 37
    type: flashcards
    question: "Flashcards: Video Call Etiquette"
    flashcards:
      - front: "Mute when not speaking"
        back: "Prevents background noise"
      - front: "Look at the camera"
        back: "Simulates eye contact"
      - front: "Use a professional background"
        back: "Avoids distractions"
      - front: "Dress professionally"
        back: "From head to toe, in case you stand up"
      - front: "Join on time"
        back: "Respects everyone's schedule"
    xp_reward: 30

  - id: 38
    type: flashcards
    question: "Flashcards: Video Call Openings"
    flashcards:
      - front: "Can everyone hear me?"
        back: "Audio check at start"
      - front: "Let's wait a moment for latecomers"
        back: "Polite acknowledgment of others"
      - front: "I'll share my screen now"
        back: "Announce before sharing"
      - front: "Let's go around and introduce ourselves"
        back: "For calls with new participants"
      - front: "Please state your name before speaking"
        back: "Helpful for large calls"
    xp_reward: 30

  - id: 39
    type: flashcards
    question: "Flashcards: Managing Interruptions"
    flashcards:
      - front: "May I jump in here?"
        back: "Polite way to interrupt"
      - front: "Let me finish this point first"
        back: "Politely decline interruption"
      - front: "We're getting off topic"
        back: "Redirect the conversation"
      - front: "Let's take that offline"
        back: "Discuss later, not in this meeting"
      - front: "I'll let [Name] finish"
        back: "Defers to the current speaker"
    xp_reward: 30

  - id: 40
    type: flashcards
    question: "Flashcards: Ending Video Calls"
    flashcards:
      - front: "Any final questions before we wrap up?"
        back: "Gives opportunity for last input"
      - front: "Let me summarize the action items"
        back: "Reviews next steps"
      - front: "Thank you everyone for your time"
        back: "Polite closing"
      - front: "I'll send out the meeting notes"
        back: "Follow-up commitment"
      - front: "Have a productive rest of your day"
        back: "Farewell wish"
    xp_reward: 30

  # ============================================
  # SECTION 3: GIVING & RECEIVING INFORMATION (41-60)
  # ============================================

  # MULTIPLE CHOICE (41-45)
  - id: 41
    type: multiple_choice
    question: "Which phrase best introduces important information?"
    options:
      - "Listen up, this is important"
      - "I'd like to bring to your attention that..."
      - "Hey, check this out"
      - "You need to know this"
    answer: "I'd like to bring to your attention that..."
    xp_reward: 15

  - id: 42
    type: multiple_choice
    question: "How should you acknowledge receiving information from a colleague?"
    options:
      - "Okay, whatever"
      - "Got it, thanks for letting me know"
      - "I already knew that"
      - "So what?"
    answer: "Got it, thanks for letting me know"
    xp_reward: 15

  - id: 43
    type: multiple_choice
    question: "What does it mean to 'keep someone in the loop'?"
    options:
      - "Ignore them completely"
      - "Update them regularly on progress"
      - "Keep them physically inside a circle"
      - "Stop sharing information with them"
    answer: "Update them regularly on progress"
    xp_reward: 15

  - id: 44
    type: multiple_choice
    question: "Which phrase confirms you have understood the information?"
    options:
      - "I have no idea what you're saying"
      - "Just to confirm, you're saying that..."
      - "That doesn't make sense"
      - "Whatever you say"
    answer: "Just to confirm, you're saying that..."
    xp_reward: 15

  - id: 45
    type: multiple_choice
    question: "How do you politely ask someone to repeat information?"
    options:
      - "What? Say it again"
      - "Huh?"
      - "Could you please repeat that? I didn't quite catch it."
      - "Again, please"
    answer: "Could you please repeat that? I didn't quite catch it."
    xp_reward: 15

  # FILL IN THE BLANK (46-50)
  - id: 46
    type: fill_blank
    question: "Complete the information-sharing phrase"
    text_with_blank: "I'd like to bring to your ___ that the deadline has changed."
    options: ["attention", "notice", "awareness", "knowledge"]
    correct_answer: "attention"
    xp_reward: 15

  - id: 47
    type: fill_blank
    question: "Complete the confirmation phrase"
    text_with_blank: "Just to ___ , the meeting is at 2 PM tomorrow."
    options: ["confirm", "check", "verify", "ensure"]
    correct_answer: "confirm"
    xp_reward: 15

  - id: 48
    type: fill_blank
    question: "Complete the update phrase"
    text_with_blank: "I'm writing to ___ you on the project status."
    options: ["update", "inform", "notify", "tell"]
    correct_answer: "update"
    xp_reward: 15

  - id: 49
    type: fill_blank
    question: "Complete the acknowledgment phrase"
    text_with_blank: "Thanks for keeping me in the ___ ."
    options: ["loop", "circle", "group", "know"]
    correct_answer: "loop"
    xp_reward: 15

  - id: 50
    type: fill_blank
    question: "Complete the request for clarification"
    text_with_blank: "Could you please ___ on that point? I want to make sure I understand."
    options: ["elaborate", "explain", "expand", "detail"]
    correct_answer: "elaborate"
    xp_reward: 15

  # TRUE / FALSE (51-53)
  - id: 51
    type: true_false
    question: "Is this statement true or false? You should always acknowledge when you receive information, even with a simple 'Got it, thanks'."
    statement: "You should always acknowledge when you receive information, even with a simple 'Got it, thanks'."
    correct_answer: true
    xp_reward: 10

  - id: 52
    type: true_false
    question: "Is this statement true or false? It is acceptable to assume someone knows information without telling them directly."
    statement: "It is acceptable to assume someone knows information without telling them directly."
    correct_answer: false
    xp_reward: 10

  - id: 53
    type: true_false
    question: "Is this statement true or false? Summarizing what you heard helps ensure you understood correctly."
    statement: "Summarizing what you heard helps ensure you understood correctly."
    correct_answer: true
    xp_reward: 10

  # MATCHING (54-56)
  - id: 54
    type: matching
    question: "Match the information-giving phrase with its purpose"
    pairs:
      - left: "I'd like to inform you that..."
        right: "Formal announcement"
      - left: "Just so you know..."
        right: "Casual information sharing"
      - left: "Please be advised that..."
        right: "Formal warning or notice"
      - left: "For your information..."
        right: "Sharing without requiring action"
      - left: "I wanted to let you know that..."
        right: "Polite heads-up"
    xp_reward: 25

  - id: 55
    type: matching
    question: "Match the acknowledgment phrase with its meaning"
    pairs:
      - left: "Noted"
        right: "I have received and understood"
      - left: "Copy that"
        right: "I understand and will comply"
      - left: "Duly noted"
        right: "Formal acknowledgment"
      - left: "Message received"
        right: "Confirmation of understanding"
      - left: "I'm on it"
        right: "I will take action"
    xp_reward: 25

  - id: 56
    type: matching
    question: "Match the information quality with its description"
    pairs:
      - left: "Accurate"
        right: "Information is correct and error-free"
      - left: "Relevant"
        right: "Information relates to the topic"
      - left: "Timely"
        right: "Information is shared at the right time"
      - left: "Complete"
        right: "Information includes all necessary details"
      - left: "Clear"
        right: "Information is easy to understand"
    xp_reward: 25

  # FLASHCARDS (57-60)
  - id: 57
    type: flashcards
    question: "Flashcards: Giving Information"
    flashcards:
      - front: "I'd like to bring to your attention"
        back: "Introduce important information"
      - front: "Please be aware that"
        back: "Formal notification"
      - front: "This is just a quick heads-up"
        back: "Casual advance notice"
      - front: "For your reference"
        back: "When sharing documents or resources"
      - front: "As a reminder"
        back: "When repeating previously shared information"
    xp_reward: 30

  - id: 58
    type: flashcards
    question: "Flashcards: Receiving Information"
    flashcards:
      - front: "Thanks for letting me know"
        back: "Standard acknowledgment"
      - front: "I appreciate the update"
        back: "Shows gratitude for information"
      - front: "Good to know"
        back: "Acknowledges useful information"
      - front: "I'll make a note of that"
        back: "Shows you will remember"
      - front: "Please keep me posted"
        back: "Request future updates"
    xp_reward: 30

  - id: 59
    type: flashcards
    question: "Flashcards: Confirming Understanding"
    flashcards:
      - front: "Just to confirm"
        back: "Check understanding before proceeding"
      - front: "Let me make sure I understand"
        back: "Polite way to verify"
      - front: "So what you're saying is"
        back: "Paraphrasing to confirm"
      - front: "If I understand correctly"
        back: "Humble confirmation"
      - front: "Let me summarize"
        back: "Review key points"
    xp_reward: 30

  - id: 60
    type: flashcards
    question: "Flashcards: Information Channels"
    flashcards:
      - front: "Email"
        back: "For formal, documented information"
      - front: "Instant message"
        back: "For quick, informal updates"
      - front: "Phone call"
        back: "For urgent or complex information"
      - front: "Meeting"
        back: "For collaborative discussion"
      - front: "Memo"
        back: "For company-wide announcements"
    xp_reward: 30

  # ============================================
  # SECTION 4: ASKING QUESTIONS PROFESSIONALLY (61-80)
  # ============================================

  # MULTIPLE CHOICE (61-65)
  - id: 61
    type: multiple_choice
    question: "Which is the most professional way to ask a question?"
    options:
      - "Hey, what's this?"
      - "Could you please clarify what you mean by that?"
      - "I don't get it"
      - "Explain this to me"
    answer: "Could you please clarify what you mean by that?"
    xp_reward: 15

  - id: 62
    type: multiple_choice
    question: "How do you politely ask for more time to answer a question?"
    options:
      - "I don't know"
      - "Give me a minute"
      - "That's a great question. Let me think about that for a moment."
      - "Next question please"
    answer: "That's a great question. Let me think about that for a moment."
    xp_reward: 15

  - id: 63
    type: multiple_choice
    question: "What is a 'leading question'?"
    options:
      - "A question that walks ahead of you"
      - "A question that suggests a particular answer"
      - "A question that has no answer"
      - "A question that is too long"
    answer: "A question that suggests a particular answer"
    xp_reward: 15

  - id: 64
    type: multiple_choice
    question: "How do you ask for an example professionally?"
    options:
      - "Give me an example"
      - "Show me what you mean"
      - "Could you provide an example to illustrate that?"
      - "Example, please"
    answer: "Could you provide an example to illustrate that?"
    xp_reward: 15

  - id: 65
    type: multiple_choice
    question: "What should you say before asking a question in a large meeting?"
    options:
      - "I have a question"
      - "Excuse me, I have a quick question"
      - "Question!"
      - "Hey, listen"
    answer: "Excuse me, I have a quick question"
    xp_reward: 15

  # FILL IN THE BLANK (66-70)
  - id: 66
