lesson:
  name: "Human Resources and Recruitment"
  description: "Master professional HR and recruitment communication including job applications, CVs, interviews, hiring, performance reviews, policies, and training"
  xp_reward: 500

exercises:

  # ============================================
  # SECTION 1: JOB APPLICATIONS (1-20)
  # ============================================

  # MULTIPLE CHOICE (1-7)
  - id: 1
    type: multiple_choice
    question: "What is the most important document to include with a job application?"
    options:
      - "A photo of yourself"
      - "Your CV/resume and cover letter"
      - "Your social media handles"
      - "Your birth certificate"
    answer: "Your CV/resume and cover letter"
    xp_reward: 15

  - id: 2
    type: multiple_choice
    question: "What is a 'cover letter'?"
    options:
      - "A letter that covers the envelope"
      - "A personalized letter explaining why you're interested in and qualified for a specific role"
      - "A letter about your hobbies"
      - "A letter from your previous employer"
    answer: "A personalized letter explaining why you're interested in and qualified for a specific role"
    xp_reward: 15

  - id: 3
    type: multiple_choice
    question: "How should you address a cover letter when you don't know the hiring manager's name?"
    options:
      - "To whom it may concern"
      - "Dear Sir/Madam"
      - "Dear Hiring Manager"
      - "Hey there"
    answer: "Dear Hiring Manager"
    xp_reward: 15

  - id: 4
    type: multiple_choice
    question: "What is an 'application tracking system' (ATS)?"
    options:
      - "A system for tracking applications"
      - "Software that screens and ranks job applications before human review"
      - "A calendar for interview scheduling"
      - "A database of rejected candidates"
    answer: "Software that screens and ranks job applications before human review"
    xp_reward: 15

  - id: 5
    type: multiple_choice
    question: "What should you do before submitting a job application?"
    options:
      - "Submit immediately without checking"
      - "Proofread carefully for spelling and grammar errors"
      - "Add irrelevant personal information"
      - "Use multiple fonts for creativity"
    answer: "Proofread carefully for spelling and grammar errors"
    xp_reward: 15

  - id: 6
    type: multiple_choice
    question: "What is a 'portfolio' in a job application?"
    options:
      - "A collection of stocks"
      - "A showcase of your work samples and achievements"
      - "A type of briefcase"
      - "A financial document"
    answer: "A showcase of your work samples and achievements"
    xp_reward: 15

  - id: 7
    type: multiple_choice
    question: "How soon should you follow up after submitting a job application?"
    options:
      - "The same day"
      - "1-2 weeks after the deadline or application date"
      - "3 months later"
      - "Never"
    answer: "1-2 weeks after the deadline or application date"
    xp_reward: 15

  # FILL IN THE BLANK (8-12)
  - id: 8
    type: fill_blank
    question: "Complete the cover letter opening"
    text_with_blank: "I am writing to ___ for the Marketing Manager position at your company."
    options: ["apply", "submit", "express interest", "be considered"]
    correct_answer: "apply"
    xp_reward: 15

  - id: 9
    type: fill_blank
    question: "Complete the application follow-up"
    text_with_blank: "I am writing to ___ on the status of my application submitted on October 15th."
    options: ["inquire", "check", "follow up", "ask"]
    correct_answer: "inquire"
    xp_reward: 15

  - id: 10
    type: fill_blank
    question: "Complete the attachment reference"
    text_with_blank: "Please find ___ my CV and cover letter for your review."
    options: ["attached", "enclosed", "included", "added"]
    correct_answer: "attached"
    xp_reward: 15

  - id: 11
    type: fill_blank
    question: "Complete the closing statement"
    text_with_blank: "Thank you for considering my application. I look forward to ___ from you."
    options: ["hearing", "responding", "receiving", "getting"]
    correct_answer: "hearing"
    xp_reward: 15

  - id: 12
    type: fill_blank
    question: "Complete the qualification statement"
    text_with_blank: "I believe my skills in project management and leadership make me an ideal ___ for this role."
    options: ["candidate", "applicant", "fit", "match"]
    correct_answer: "candidate"
    xp_reward: 15

  # TRUE / FALSE (13-15)
  - id: 13
    type: true_false
    question: "Is this statement true or false? A generic cover letter sent to many companies is as effective as a customized one."
    statement: "A generic cover letter sent to many companies is as effective as a customized one."
    correct_answer: false
    xp_reward: 10

  - id: 14
    type: true_false
    question: "Is this statement true or false? You should include references on your CV rather than 'References available upon request'."
    statement: "You should include references on your CV rather than 'References available upon request'."
    correct_answer: false
    xp_reward: 10

  - id: 15
    type: true_false
    question: "Is this statement true or false? Tailoring your application to the job description increases your chances of being selected."
    statement: "Tailoring your application to the job description increases your chances of being selected."
    correct_answer: true
    xp_reward: 10

  # MATCHING (16-18)
  - id: 16
    type: matching
    question: "Match the application document with its purpose"
    pairs:
      - left: "CV/Resume"
        right: "Summarizes work history, skills, and education"
      - left: "Cover letter"
        right: "Explains interest and fit for specific role"
      - left: "Portfolio"
        right: "Showcases work samples and achievements"
      - left: "References"
        right: "People who can vouch for your work"
      - left: "Application form"
        right: "Company-specific structured information"
    xp_reward: 25

  - id: 17
    type: matching
    question: "Match the application mistake with how to avoid it"
    pairs:
      - left: "Spelling errors"
        right: "Proofread and use spell-check"
      - left: "Generic cover letter"
        right: "Customize for each company"
      - left: "Missing keywords from job description"
        right: "Tailor CV to match job requirements"
      - left: "Too long CV"
        right: "Keep to 1-2 pages maximum"
      - left: "Unprofessional email address"
        right: "Create a professional email for job search"
    xp_reward: 25

  - id: 18
    type: matching
    question: "Match the cover letter section with its content"
    pairs:
      - left: "Opening paragraph"
        right: "State role applying for and how you heard about it"
      - left: "Body paragraph 1"
        right: "Highlight relevant experience and skills"
      - left: "Body paragraph 2"
        right: "Show knowledge of company and why you want to work there"
      - left: "Closing paragraph"
        right: "Thank you and call to action"
      - left: "Signature"
        right: "Sincerely, [Your Name]"
    xp_reward: 25

  # FLASHCARDS (19-20)
  - id: 19
    type: flashcards
    question: "Flashcards: Cover Letter Phrases"
    flashcards:
      - front: "I am writing to apply for"
        right: "Application opening"
      - front: "As you can see from my attached CV"
        right: "Reference to resume"
      - front: "I have X years of experience in"
        right: "Experience statement"
      - front: "I am particularly drawn to your company because"
        right: "Company interest statement"
      - front: "I would welcome the opportunity to discuss my application further"
        right: "Request for interview"
    xp_reward: 30

  - id: 20
    type: flashcards
    question: "Flashcards: Application Follow-up"
    flashcards:
      - front: "I wanted to check on the status of my application"
        right: "Polite inquiry"
      - front: "I remain very interested in this opportunity"
        right: "Reiterate interest"
      - front: "Please let me know if there is any additional information I can provide"
        right: "Offer more information"
      - front: "Thank you for your time and consideration"
        right: "Polite closing"
      - front: "I look forward to the possibility of interviewing with your team"
        right: "Positive expectation"
    xp_reward: 30

  # ============================================
  # SECTION 2: CV AND RESUME VOCABULARY (21-40)
  # ============================================

  # MULTIPLE CHOICE (21-27)
  - id: 21
    type: multiple_choice
    question: "What is the difference between a CV and a resume?"
    options:
      - "No difference - they are the same"
      - "CV is longer and more academic; resume is shorter and skills-focused"
      - "Resume is for jobs; CV is for school"
      - "CV includes photos; resume does not"
    answer: "CV is longer and more academic; resume is shorter and skills-focused"
    xp_reward: 15

  - id: 22
    type: multiple_choice
    question: "What does 'action verb' mean in resume writing?"
    options:
      - "A verb about action movies"
      - "A strong, active verb that describes achievements (e.g., 'led', 'created', 'improved')"
      - "A verb that is boring"
      - "A verb in past tense"
    answer: "A strong, active verb that describes achievements (e.g., 'led', 'created', 'improved')"
    xp_reward: 15

  - id: 23
    type: multiple_choice
    question: "What is a 'professional summary' on a resume?"
    options:
      - "A summary of your personal life"
      - "A brief overview of your key qualifications and career highlights"
      - "A list of your hobbies"
      - "Your contact information"
    answer: "A brief overview of your key qualifications and career highlights"
    xp_reward: 15

  - id: 24
    type: multiple_choice
    question: "What is 'quantifying achievements' on a resume?"
    options:
      - "Using numbers to measure your accomplishments (e.g., 'increased sales by 30%')"
      - "Guessing your achievements"
      - "Using vague language"
      - "Listing quantities of products"
    answer: "Using numbers to measure your accomplishments (e.g., 'increased sales by 30%')"
    xp_reward: 15

  - id: 25
    type: multiple_choice
    question: "What should you include in the 'work experience' section?"
    options:
      - "Only job titles and dates"
      - "Job titles, company names, dates, and bullet points of achievements"
      - "Your entire life story"
      - "Salary information"
    answer: "Job titles, company names, dates, and bullet points of achievements"
    xp_reward: 15

  - id: 26
    type: multiple_choice
    question: "What are 'transferable skills'?"
    options:
      - "Skills that can be transferred to another person"
      - "Skills that are useful across different jobs and industries"
      - "Skills that are only useful in one job"
      - "Skills about transportation"
    answer: "Skills that are useful across different jobs and industries"
    xp_reward: 15

  - id: 27
    type: multiple_choice
    question: "What is the recommended file format for submitting a resume electronically?"
    options:
      - ".docx (Word document)"
      - ".txt (text file)"
      - ".pdf (Portable Document Format)"
      - ".jpg (image file)"
    answer: ".pdf (Portable Document Format)"
    xp_reward: 15

  # FILL IN THE BLANK (28-32)
  - id: 28
    type: fill_blank
    question: "Complete the resume action verb phrase"
    text_with_blank: "___ a team of 12 people to complete the project ahead of schedule."
    options: ["Led", "Managed", "Directed", "Supervised"]
    correct_answer: "Led"
    xp_reward: 15

  - id: 29
    type: fill_blank
    question: "Complete the quantified achievement"
    text_with_blank: "Increased customer retention by 25% ___ the first year."
    options: ["within", "in", "during", "over"]
    correct_answer: "within"
    xp_reward: 15

  - id: 30
    type: fill_blank
    question: "Complete the skill description"
    text_with_blank: "Proficient in Microsoft Office ___ , including Excel and PowerPoint."
    options: ["Suite", "Package", "Collection", "Set"]
    correct_answer: "Suite"
    xp_reward: 15

  - id: 31
    type: fill_blank
    question: "Complete the education entry"
    text_with_blank: "Bachelor of Arts in Business Administration, ___ of 2020"
    options: ["Class", "Graduate", "Alumnus", "Cohort"]
    correct_answer: "Class"
    xp_reward: 15

  - id: 32
    type: fill_blank
    question: "Complete the professional summary"
    text_with_blank: "Results-driven marketing professional with 8+ years of ___ in digital strategy."
    options: ["experience", "expertise", "background", "knowledge"]
    correct_answer: "experience"
    xp_reward: 15

  # TRUE / FALSE (33-35)
  - id: 33
    type: true_false
    question: "Is this statement true or false? You should list every job you've ever had, no matter how relevant."
    statement: "You should list every job you've ever had, no matter how relevant."
    correct_answer: false
    xp_reward: 10

  - id: 34
    type: true_false
    question: "Is this statement true or false? Including a photo on your resume is standard practice in most countries."
    statement: "Including a photo on your resume is standard practice in most countries."
    correct_answer: false
    xp_reward: 10

  - id: 35
    type: true_false
    question: "Is this statement true or false? Using bullet points makes your resume easier to scan quickly."
    statement: "Using bullet points makes your resume easier to scan quickly."
    correct_answer: true
    xp_reward: 10

  # MATCHING (36-38)
  - id: 36
    type: matching
    question: "Match the resume section with its content"
    pairs:
      - left: "Contact information"
        right: "Name, phone, email, LinkedIn, location"
      - left: "Professional summary"
        right: "2-3 sentence career overview"
      - left: "Skills"
        right: "Technical and soft skills relevant to role"
      - left: "Work experience"
        right: "Reverse-chronological job history with achievements"
      - left: "Education"
        right: "Degrees, institutions, graduation dates"
    xp_reward: 25

  - id: 37
    type: matching
    question: "Match the action verb with the achievement type"
    pairs:
      - left: "Created"
        right: "Developing something new"
      - left: "Improved"
        right: "Making something better"
      - left: "Reduced"
        right: "Decreasing costs or time"
      - left: "Increased"
        right: "Growing revenue or engagement"
      - left: "Managed"
        right: "Overseeing people or projects"
    xp_reward: 25

  - id: 38
    type: matching
    question: "Match the resume keyword with its meaning"
    pairs:
      - left: "P&L responsibility"
        right: "Managing profit and loss"
      - left: "Cross-functional collaboration"
        right: "Working across departments"
      - left: "Strategic planning"
        right: "Long-term goal setting"
      - left: "Change management"
        right: "Leading organizational change"
      - left: "Stakeholder management"
        right: "Managing relationships with interested parties"
    xp_reward: 25

  # FLASHCARDS (39-40)
  - id: 39
    type: flashcards
    question: "Flashcards: Resume Action Verbs"
    flashcards:
      - front: "Achieved"
        right: "Successfully accomplished"
      - front: "Implemented"
        right: "Put into effect"
      - front: "Developed"
        right: "Created or grew"
      - front: "Coordinated"
        right: "Organized activities or people"
      - front: "Launched"
        right: "Started a new product or initiative"
    xp_reward: 30

  - id: 40
    type: flashcards
    question: "Flashcards: Skills Categories"
    flashcards:
      - front: "Hard skills"
        right: "Technical, teachable abilities (e.g., coding, accounting)"
      - front: "Soft skills"
        right: "Interpersonal, behavioral skills (e.g., communication, teamwork)"
      - front: "Technical skills"
        right: "Job-specific technical abilities"
      - front: "Language skills"
        right: "Proficiency in languages"
      - front: "Leadership skills"
        right: "Ability to guide and motivate teams"
    xp_reward: 30

  # ============================================
  # SECTION 3: JOB INTERVIEWS (41-65)
  # ============================================

  # MULTIPLE CHOICE (41-48)
  - id: 41
    type: multiple_choice
    question: "What is the best way to prepare for a job interview?"
    options:
      - "Show up without preparation"
      - "Research the company, practice common questions, and prepare questions to ask"
      - "Memorize a script word for word"
      - "Just be yourself with no preparation"
    answer: "Research the company, practice common questions, and prepare questions to ask"
    xp_reward: 15

  - id: 42
    type: multiple_choice
    question: "What is the 'STAR' method for answering behavioral interview questions?"
    options:
      - "Situation, Task, Action, Result"
      - "Start, Talk, Answer, Respond"
      - "State, Tell, Ask, Repeat"
      - "Sit, Think, Act, Review"
    answer: "Situation, Task, Action, Result"
    xp_reward: 15

  - id: 43
    type: multiple_choice
    question: "What should you wear to a professional job interview?"
    options:
      - "Casual clothes"
      - "Business professional or business casual appropriate to the company culture"
      - "Costume"
      - "Sportswear"
    answer: "Business professional or business casual appropriate to the company culture"
    xp_reward: 15

  - id: 44
    type: multiple_choice
    question: "What is the best way to answer 'Tell me about yourself'?"
    options:
      - "Recite your entire life story"
      - "Give a brief professional summary: past experience, present role, future goals relevant to position"
      - "Say 'What do you want to know?'"
      - "Just state your name"
    answer: "Give a brief professional summary: past experience, present role, future goals relevant to position"
    xp_reward: 15

  - id: 45
    type: multiple_choice
    question: "What is the best way to answer 'What is your greatest weakness?'"
    options:
      - "Say 'I have no weaknesses'"
      - "Give a real weakness and explain how you're working to improve it"
      - "Give a fake weakness like 'I work too hard'"
      - "Refuse to answer"
    answer: "Give a real weakness and explain how you're working to improve it"
    xp_reward: 15

  - id: 46
    type: multiple_choice
    question: "What questions should you ask at the end of an interview?"
    options:
      - "No questions - it's better to stay silent"
      - "Thoughtful questions about the role, team, company culture, and expectations"
      - "Questions about salary and benefits only"
      - "Personal questions about the interviewer's life"
    answer: "Thoughtful questions about the role, team, company culture, and expectations"
    xp_reward: 15

  - id: 47
    type: multiple_choice
    question: "How soon after an interview should you send a thank-you note?"
    options:
      - "1 month later"
      - "Within 24 hours"
      - "Before the interview"
      - "Only if you get the job"
    answer: "Within 24 hours"
    xp_reward: 15

  - id: 48
    type: multiple_choice
    question: "What is a 'panel interview'?"
    options:
      - "An interview with a panel of judges"
      - "An interview conducted by multiple interviewers at once"
      - "An interview about panels"
      - "A group interview with multiple candidates"
    answer: "An interview conducted by multiple interviewers at once"
    xp_reward: 15

  # FILL IN THE BLANK (49-53)
  - id: 49
    type: fill_blank
    question: "Complete the STAR method step"
    text_with_blank: "The first step in the STAR method is describing the ___ you faced."
    options: ["Situation", "Scenario", "Context", "Background"]
    correct_answer: "Situation"
    xp_reward: 15

  - id: 50
    type: fill_blank
    question: "Complete the weakness statement"
    text_with_blank: "One area I'm working to improve is my public speaking. I've been ___ Toastmasters to build confidence."
    options: ["attending", "joining", "participating in", "taking"]
    correct_answer: "attending"
    xp_reward: 15

  - id: 51
    type: fill_blank
    question: "Complete the thank-you note opening"
    text_with_blank: "Thank you for ___ the time to meet with me today. I enjoyed learning more about the team and role."
    options: ["taking", "spending", "finding", "allocating"]
    correct_answer: "taking"
    xp_reward: 15

  - id: 52
    type: fill_blank
    question: "Complete the follow-up question"
    text_with_blank: "Could you tell me more about the team's current ___ and priorities?"
    options: ["goals", "objectives", "targets", "initiatives"]
    correct_answer: "goals"
    xp_reward: 15

  - id: 53
    type: fill_blank
    question: "Complete the interest statement"
    text_with_blank: "Based on what we discussed, I'm even more excited about the ___ of joining your team."
    options: ["prospect", "possibility", "opportunity", "chance"]
    correct_answer: "opportunity"
    xp_reward: 15

  # TRUE / FALSE (54-56)
  - id: 54
    type: true_false
    question: "Is this statement true or false? Arriving 5-10 minutes early for an interview shows punctuality and respect."
    statement: "Arriving 5-10 minutes early for an interview shows punctuality and respect."
    correct_answer: true
    xp_reward: 10

  - id: 55
    type: true_false
    question: "Is this statement true or false? You should never ask questions at the end of an interview."
    statement: "You should never ask questions at the end of an interview."
    correct_answer: false
    xp_reward: 10

  - id: 56
    type: true_false
    question: "Is this statement true or false? Sending a personalized thank-you email after an interview can set you apart from other candidates."
    statement: "Sending a personalized thank-you email after an interview can set you apart from other candidates."
    correct_answer: true
    xp_reward: 10

  # MATCHING (57-60)
  - id: 57
    type: matching
    question: "Match the interview question with what it assesses"
    pairs:
      - left: "Tell me about yourself"
        right: "Communication and relevance of background"
      - left: "Why do you want to work here?"
        right: "Company research and motivation"
      - left: "Describe a time you faced a challenge"
        right: "Problem-solving and behavioral pattern"
      - left: "Where do you see yourself in 5 years?"
        right: "Ambition and career alignment"
      - left: "Why should we hire you?"
        right: "Self-awareness and value proposition"
    xp_reward: 25

  - id: 58
    type: matching
    question: "Match the interview type with its format"
    pairs:
      - left: "Phone screen"
        right: "Initial filter, usually 15-30 minutes"
      - left: "Video interview"
        right: "Remote interview via Zoom/Teams/Skype"
      - left: "Panel interview"
        right: "Multiple interviewers at once"
      - left: "Case interview"
        right: "Solving a business problem"
      - left: "Technical interview"
        right: "Testing job-specific skills"
    xp_reward: 25

  - id: 59
    type: matching
    question: "Match the red flag with what it signals to interviewers"
    pairs:
      - left: "Arriving late"
        right: "Poor time management"
      - left: "Speaking negatively about previous employer"
        right: "Unprofessionalism, potential attitude issues"
      - left: "No questions for interviewer"
        right: "Lack of interest or preparation"
      - left: "Phone ringing during interview"
        right: "Lack of professionalism"
      - left: "Vague or evasive answers"
        right: "Lack of substance or honesty"
    xp_reward: 25

  - id: 60
    type: matching
    question: "Match the interview follow-up step with its timing"
    pairs:
      - left: "Send thank-you email"
        right: "Within 24 hours of interview"
      - left: "Send follow-up inquiry"
        right: "1-2 weeks after interview if no response"
      - left: "Send final check-in"
        right: "Before the stated decision deadline"
      - left: "Withdraw application"
        right: "If you accept another offer"
      - left: "Ask for feedback if rejected"
        right: "After receiving rejection"
    xp_reward: 25

  # FLASHCARDS (61-65)
  - id: 61
    type: flashcards
    question: "Flashcards: Common Interview Questions"
    flashcards:
      - front: "Tell me about yourself"
        right: "Brief professional summary (past-present-future)"
      - front: "What are your strengths?"
        right: "Relevant skills with examples"
      - front: "What is your greatest weakness?"
        right: "Real weakness with improvement plan"
      - front: "Why did you leave your last job?"
        right: "Positive reason, focus on growth"
      - front: "What are your salary expectations?"
        right: "Market-aligned range, not exact number"
    xp_reward: 30

  - id: 62
    type: flashcards
    question: "Flashcards: Questions to Ask Interviewers"
    flashcards:
      - front: "What does success look like in this role?"
        right: "Shows forward-thinking"
      - front: "Can you describe the team culture?"
        right: "Shows interest in fit"
      - front: "What are the biggest challenges facing the team?"
        right: "Shows strategic thinking"
      - front: "How do you measure performance?"
        right: "Shows accountability focus"
      - front: "What are the next steps in the process?"
        right: "Shows organization"
    xp_reward: 30

  - id: 63
    type: flashcards
    question: "Flashcards: Virtual Interview Tips"
    flashcards:
      - front: "Test technology beforehand"
        right: "Check camera, mic, internet"
      - front: "Choose neutral background"
        right: "Avoid distractions"
      - front: "Dress professionally"
        right: "Full outfit, not just top"
      - front: "Look at camera, not screen"
        right: "Simulates eye contact"
      - front: "Minimize background noise"
        right: "Mute when not speaking"
    xp_reward: 30

  - id: 64
    type: flashcards
    question: "Flashcards: Illegal Interview Questions"
    flashcards:
      - front: "Are you married?"
        right: "Marital status - illegal"
      - front: "Do you have children?"
        right: "Family status - illegal"
      - front: "What is your religion?"
        right: "Religious belief - illegal"
      - front: "How old are you?"
        right: "Age - illegal in many places"
      - front: "What is your ethnicity?"
        right: "Race/national origin - illegal"
    xp_reward: 30

  - id: 65
    type: flashcards
    question: "Flashcards: Post-Interview Thank You"
    flashcards:
      - front: "Reference a specific discussion point"
        right: "Personalizes the note"
      - front: "Reiterate your interest"
        right: "Shows enthusiasm"
      - front: "Briefly restate your value"
        right: "Reminds them of your fit"
      - front: "Send within 24 hours"
        right: "Shows promptness"
      - front: "Proofread carefully"
        right: "Errors undermine professionalism"
