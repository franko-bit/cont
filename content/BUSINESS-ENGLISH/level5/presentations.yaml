lesson:
  name: "Presentations and Public Speaking"
  description: "Master professional presentation skills including structure, openings, data explanation, charts, Q&A, persuasion, and vocabulary"
  xp_reward: 500

exercises:

  # ============================================
  # SECTION 1: PRESENTATION STRUCTURE (1-20)
  # ============================================

  # MULTIPLE CHOICE (1-7)
  - id: 1
    type: multiple_choice
    question: "What is the classic three-part structure of a professional presentation?"
    options:
      - "Introduction, jokes, conclusion"
      - "Beginning, middle, end"
      - "Tell them what you'll tell them, tell them, tell them what you told them"
      - "Slide 1, Slide 2, Slide 3"
    answer: "Tell them what you'll tell them, tell them, tell them what you told them"
    xp_reward: 15

  - id: 2
    type: multiple_choice
    question: "What should be included in the introduction of a presentation?"
    options:
      - "Only your name"
      - "Hook, agenda, credibility statement, and overview"
      - "All your data and charts"
      - "A long story about your personal life"
    answer: "Hook, agenda, credibility statement, and overview"
    xp_reward: 15

  - id: 3
    type: multiple_choice
    question: "What is a 'hook' in a presentation?"
    options:
      - "A fishing reference"
      - "An attention-grabbing opening statement"
      - "The last slide"
      - "A question at the end"
    answer: "An attention-grabbing opening statement"
    xp_reward: 15

  - id: 4
    type: multiple_choice
    question: "How many main points should a typical business presentation have?"
    options:
      - "1-2 points"
      - "3-5 points"
      - "10-15 points"
      - "As many as possible"
    answer: "3-5 points"
    xp_reward: 15

  - id: 5
    type: multiple_choice
    question: "What should you include in the conclusion of a presentation?"
    options:
      - "New information you forgot"
      - "Summary, key takeaway, call to action, and thank you"
      - "More questions than answers"
      - "An apology for any mistakes"
    answer: "Summary, key takeaway, call to action, and thank you"
    xp_reward: 15

  - id: 6
    type: multiple_choice
    question: "What does 'signposting' mean in a presentation?"
    options:
      - "Putting signs on your slides"
      - "Using transition phrases to guide the audience ('First', 'Next', 'Finally')"
      - "Pointing at the screen"
      - "Reading every word on your slides"
    answer: "Using transition phrases to guide the audience ('First', 'Next', 'Finally')"
    xp_reward: 15

  - id: 7
    type: multiple_choice
    question: "How much time should you typically spend on the introduction?"
    options:
      - "50% of the presentation"
      - "10-15% of the presentation"
      - "90% of the presentation"
      - "0% - skip directly to content"
    answer: "10-15% of the presentation"
    xp_reward: 15

  # FILL IN THE BLANK (8-12)
  - id: 8
    type: fill_blank
    question: "Complete the presentation opening structure phrase"
    text_with_blank: "Today, I will ___ three main points about our quarterly results."
    options: ["cover", "discuss", "present", "share"]
    correct_answer: "cover"
    xp_reward: 15

  - id: 9
    type: fill_blank
    question: "Complete the signposting phrase"
    text_with_blank: "___ , let me begin with our sales performance."
    options: ["First", "Initially", "To start", "Beginning"]
    correct_answer: "First"
    xp_reward: 15

  - id: 10
    type: fill_blank
    question: "Complete the transition phrase"
    text_with_blank: "Now that we've covered sales, ___ 's move on to marketing."
    options: ["let", "we", "shall", "will"]
    correct_answer: "let"
    xp_reward: 15

  - id: 11
    type: fill_blank
    question: "Complete the conclusion starter"
    text_with_blank: "In ___ , our Q3 performance exceeded expectations across all metrics."
    options: ["summary", "conclusion", "short", "closing"]
    correct_answer: "summary"
    xp_reward: 15

  - id: 12
    type: fill_blank
    question: "Complete the call to action"
    text_with_blank: "I ___ you to approve this budget for the upcoming quarter."
    options: ["urge", "ask", "request", "encourage"]
    correct_answer: "urge"
    xp_reward: 15

  # TRUE / FALSE (13-15)
  - id: 13
    type: true_false
    question: "Is this statement true or false? The most effective presentations have a clear beginning, middle, and end."
    statement: "The most effective presentations have a clear beginning, middle, and end."
    correct_answer: true
    xp_reward: 10

  - id: 14
    type: true_false
    question: "Is this statement true or false? You should memorize your entire presentation word for word."
    statement: "You should memorize your entire presentation word for word."
    correct_answer: false
    xp_reward: 10

  - id: 15
    type: true_false
    question: "Is this statement true or false? A clear agenda helps the audience follow your presentation."
    statement: "A clear agenda helps the audience follow your presentation."
    correct_answer: true
    xp_reward: 10

  # MATCHING (16-18)
  - id: 16
    type: matching
    question: "Match the presentation section with its purpose"
    pairs:
      - left: "Introduction"
        right: "Grab attention, state purpose, preview structure"
      - left: "Body"
        right: "Present main points with evidence"
      - left: "Conclusion"
        right: "Summarize, reinforce key message, call to action"
      - left: "Q&A"
        right: "Address audience questions and concerns"
      - left: "Closing"
        right: "Thank audience and end professionally"
    xp_reward: 25

  - id: 17
    type: matching
    question: "Match the signposting phrase with its function"
    pairs:
      - left: "First, let me explain..."
        right: "Introducing first point"
      - left: "Moving on to my next point..."
        right: "Transition between points"
      - left: "Let me elaborate on this..."
        right: "Adding detail to current point"
      - left: "Turning now to..."
        right: "Changing topic"
      - left: "Finally, I'd like to discuss..."
        right: "Introducing last point"
    xp_reward: 25

  - id: 18
    type: matching
    question: "Match the hook type with its description"
    pairs:
      - left: "Question hook"
        right: "Start with a thought-provoking question"
      - left: "Statistic hook"
        right: "Open with a surprising number"
      - left: "Story hook"
        right: "Begin with a brief relevant anecdote"
      - left: "Quote hook"
        right: "Start with an expert or famous quote"
      - left: "Problem hook"
        right: "Identify a problem you will solve"
    xp_reward: 25

  # FLASHCARDS (19-20)
  - id: 19
    type: flashcards
    question: "Flashcards: Presentation Structure Elements"
    flashcards:
      - front: "Hook"
        back: "Attention-grabbing opening"
      - front: "Agenda"
        back: "Roadmap of what you'll cover"
      - front: "Credibility statement"
        back: "Why you're qualified to speak"
      - front: "Main body"
        back: "3-5 key points with supporting evidence"
      - front: "Call to action"
        back: "What you want the audience to do"
    xp_reward: 30

  - id: 20
    type: flashcards
    question: "Flashcards: Transition Phrases"
    flashcards:
      - front: "Let's start with"
        back: "Introduce first topic"
      - front: "Now let's turn to"
        back: "Change to new topic"
      - front: "Building on that idea"
        back: "Add to current point"
      - front: "This brings me to my next point"
        back: "Natural transition"
      - front: "To wrap up"
        back: "Begin conclusion"
    xp_reward: 30

  # ============================================
  # SECTION 2: OPENING A PRESENTATION (21-40)
  # ============================================

  # MULTIPLE CHOICE (21-27)
  - id: 21
    type: multiple_choice
    question: "What is the most effective way to open a business presentation?"
    options:
      - "Sorry I'm late"
      - "Thank you all for being here. Today I'll discuss..."
      - "Let me just check my notes"
      - "I'm not really prepared"
    answer: "Thank you all for being here. Today I'll discuss..."
    xp_reward: 15

  - id: 22
    type: multiple_choice
    question: "Which is an example of a strong hook for a sales presentation?"
    options:
      - "The weather today is nice"
      - "What if I told you we could increase your revenue by 30% in six months?"
      - "My name is John"
      - "Let me read this slide"
    answer: "What if I told you we could increase your revenue by 30% in six months?"
    xp_reward: 15

  - id: 23
    type: multiple_choice
    question: "What should you say immediately after your hook?"
    options:
      - "Tell a joke"
      - "Introduce yourself and state your credibility"
      - "Show a complex chart"
      - "Ask if anyone has questions"
    answer: "Introduce yourself and state your credibility"
    xp_reward: 15

  - id: 24
    type: multiple_choice
    question: "How do you establish credibility in a presentation opening?"
    options:
      - "List all your degrees and awards"
      - "Briefly state your relevant experience or role"
      - "Brag about your achievements for 10 minutes"
      - "Don't mention yourself at all"
    answer: "Briefly state your relevant experience or role"
    xp_reward: 15

  - id: 25
    type: multiple_choice
    question: "What should you say if you're presenting to senior executives?"
    options:
      - "Hey guys, listen up"
      - "Good morning, distinguished leaders. Thank you for your time today."
      - "Yo, what's up?"
      - "Let me just get through this quickly"
    answer: "Good morning, distinguished leaders. Thank you for your time today."
    xp_reward: 15

  - id: 26
    type: multiple_choice
    question: "What is a 'rhetorical question' in a presentation opening?"
    options:
      - "A question you expect the audience to answer out loud"
      - "A question asked for effect, not expecting an answer"
      - "A question about rhetoric"
      - "A question with no answer"
    answer: "A question asked for effect, not expecting an answer"
    xp_reward: 15

  - id: 27
    type: multiple_choice
    question: "How should you handle technical difficulties at the start of a presentation?"
    options:
      - "Panic and apologize repeatedly"
      - "Cancel the presentation"
      - "Stay calm, acknowledge the issue briefly, and have a backup plan"
      - "Blame the IT department"
    answer: "Stay calm, acknowledge the issue briefly, and have a backup plan"
    xp_reward: 15

  # FILL IN THE BLANK (28-32)
  - id: 28
    type: fill_blank
    question: "Complete the opening greeting"
    text_with_blank: "Good morning, everyone. Thank you for ___ today."
    options: ["being here", "coming", "attending", "joining"]
    correct_answer: "joining"
    xp_reward: 15

  - id: 29
    type: fill_blank
    question: "Complete the hook statement"
    text_with_blank: "___ if I told you we could cut costs by 20% without reducing quality?"
    options: ["What", "Imagine", "Suppose", "Consider"]
    correct_answer: "What"
    xp_reward: 15

  - id: 30
    type: fill_blank
    question: "Complete the credibility statement"
    text_with_blank: "For those who don't know me, I'm Sarah, the ___ of Marketing."
    options: ["Director", "Head", "VP", "Manager"]
    correct_answer: "Director"
    xp_reward: 15

  - id: 31
    type: fill_blank
    question: "Complete the agenda preview"
    text_with_blank: "Today, I'll cover three areas: our results, our challenges, and our ___ for next quarter."
    options: ["plan", "strategy", "recommendations", "proposal"]
    correct_answer: "recommendations"
    xp_reward: 15

  - id: 32
    type: fill_blank
    question: "Complete the time expectation statement"
    text_with_blank: "This presentation will take approximately 20 minutes, and we'll have ___ minutes for questions at the end."
    options: ["10", "several", "a few", "some"]
    correct_answer: "10"
    xp_reward: 15

  # TRUE / FALSE (33-35)
  - id: 33
    type: true_false
    question: "Is this statement true or false? Starting with an apology weakens your credibility."
    statement: "Starting with an apology weakens your credibility."
    correct_answer: true
    xp_reward: 10

  - id: 34
    type: true_false
    question: "Is this statement true or false? You should never make eye contact with the audience during your opening."
    statement: "You should never make eye contact with the audience during your opening."
    correct_answer: false
    xp_reward: 10

  - id: 35
    type: true_false
    question: "Is this statement true or false? Previewing your agenda helps the audience follow your presentation."
    statement: "Previewing your agenda helps the audience follow your presentation."
    correct_answer: true
    xp_reward: 10

  # MATCHING (36-38)
  - id: 36
    type: matching
    question: "Match the opening element with its example"
    pairs:
      - left: "Hook"
        right: "What if you could double your productivity in 30 days?"
      - left: "Welcome and thanks"
        right: "Thank you all for taking time out of your busy schedules"
      - left: "Self-introduction"
        right: "I'm Michael, and I've led this project for two years"
      - left: "Agenda preview"
        right: "I'll cover three areas: problem, solution, next steps"
      - left: "Timeframe"
        right: "This will take about 15 minutes"
    xp_reward: 25

  - id: 37
    type: matching
    question: "Match the hook type with its example"
    pairs:
      - left: "Shocking statistic"
        right: "90% of businesses fail within the first five years"
      - left: "Personal story"
        right: "When I started in this role three years ago, I faced the same challenge"
      - left: "Bold statement"
        right: "Everything you know about marketing is about to change"
      - left: "Question"
        right: "How many of you have struggled with work-life balance?"
      - left: "Quote"
        right: "As Peter Drucker said, 'What gets measured gets managed'"
    xp_reward: 25

  - id: 38
    type: matching
    question: "Match the audience type with the appropriate opening"
    pairs:
      - left: "Senior executives"
        right: "Good morning. Thank you for your time. I'll be brief."
      - left: "Internal team"
        right: "Hi everyone. Let's dive into our weekly update."
      - left: "New clients"
        right: "Thank you for the opportunity to present to you today."
      - left: "Conference audience"
        right: "Good afternoon. It's an honor to be here with you today."
      - left: "Technical experts"
        right: "I'll assume you're familiar with the basics, so let's jump into the data."
    xp_reward: 25

  # FLASHCARDS (39-40)
  - id: 39
    type: flashcards
    question: "Flashcards: Powerful Opening Phrases"
    flashcards:
      - front: "Imagine if..."
        back: "Engages audience imagination"
      - front: "What if I told you that..."
        back: "Creates curiosity"
      - front: "The problem we're solving is..."
        back: "Immediately relevant"
      - front: "By the end of this presentation, you'll understand..."
        back: "Sets expectation"
      - front: "Let me start with a story"
        back: "Personal connection"
    xp_reward: 30

  - id: 40
    type: flashcards
    question: "Flashcards: Opening Don'ts"
    flashcards:
      - front: "Sorry I'm not prepared"
        back: "Never apologize at the start"
      - front: "Let me just read this slide"
        back: "Audience can read themselves"
      - front: "I'm nervous"
        back: "Don't admit anxiety"
      - front: "I didn't have much time to prepare"
        back: "Shows lack of respect"
      - front: "I'll try to get through this quickly"
        back: "Suggests you don't want to be there"
    xp_reward: 30

  # ============================================
  # SECTION 3: EXPLAINING DATA (41-60)
  # ============================================

  # MULTIPLE CHOICE (41-47)
  - id: 41
    type: multiple_choice
    question: "When presenting data, what should you do first?"
    options:
      - "Show the raw numbers without context"
      - "State the key insight or conclusion the data supports"
      - "Apologize for the complexity"
      - "Read every number on the slide"
    answer: "State the key insight or conclusion the data supports"
    xp_reward: 15

  - id: 42
    type: multiple_choice
    question: "What does it mean to 'contextualize' data?"
    options:
      - "Hide the data"
      - "Explain what the numbers mean and why they matter"
      - "Make the data smaller"
      - "Ignore outliers"
    answer: "Explain what the numbers mean and why they matter"
    xp_reward: 15

  - id: 43
    type: multiple_choice
    question: "Which phrase best introduces a key data point?"
    options:
      - "Look at this number"
      - "The most important finding from this data is..."
      - "Here's a chart"
      - "This is interesting"
    answer: "The most important finding from this data is..."
    xp_reward: 15

  - id: 44
    type: multiple_choice
    question: "What should you avoid when presenting data?"
    options:
      - "Using clear labels"
      - "Highlighting key numbers"
      - "Showing unlabeled, cluttered charts"
      - "Explaining what the data means"
    answer: "Showing unlabeled, cluttered charts"
    xp_reward: 15

  - id: 45
    type: multiple_choice
    question: "What does 'year-over-year (YoY)' mean?"
    options:
      - "Compared to the previous month"
      - "Compared to the same period last year"
      - "Compared to the budget"
      - "Compared to the competition"
    answer: "Compared to the same period last year"
    xp_reward: 15

  - id: 46
    type: multiple_choice
    question: "What does 'quarter-over-quarter (QoQ)' mean?"
    options:
      - "Compared to the previous quarter"
      - "Compared to last year"
      - "Compared to the industry average"
      - "Compared to the target"
    answer: "Compared to the previous quarter"
    xp_reward: 15

  - id: 47
    type: multiple_choice
    question: "How should you present a negative data trend?"
    options:
      - "Hide it completely"
      - "Acknowledge it honestly, explain why it happened, and present solutions"
      - "Blame someone else"
      - "Use confusing charts to obscure it"
    answer: "Acknowledge it honestly, explain why it happened, and present solutions"
    xp_reward: 15

  # FILL IN THE BLANK (48-52)
  - id: 48
    type: fill_blank
    question: "Complete the data insight statement"
    text_with_blank: "As you can see from this chart, sales ___ by 15% compared to last quarter."
    options: ["increased", "grew", "rose", "climbed"]
    correct_answer: "increased"
    xp_reward: 15

  - id: 49
    type: fill_blank
    question: "Complete the comparison phrase"
    text_with_blank: "This represents a 10% ___ year-over-year."
    options: ["improvement", "increase", "growth", "gain"]
    correct_answer: "improvement"
    xp_reward: 15

  - id: 50
    type: fill_blank
    question: "Complete the data highlight"
    text_with_blank: "The ___ takeaway from this data is that customer satisfaction has reached an all-time high."
    options: ["key", "main", "primary", "major"]
    correct_answer: "key"
    xp_reward: 15

  - id: 51
    type: fill_blank
    question: "Complete the trend explanation"
    text_with_blank: "This upward ___ has continued for four consecutive quarters."
    options: ["trend", "pattern", "movement", "direction"]
    correct_answer: "trend"
    xp_reward: 15

  - id: 52
    type: fill_blank
    question: "Complete the data qualification"
    text_with_blank: "It's important to note that these numbers are ___ based on preliminary results."
    options: ["preliminary", "initial", "draft", "tentative"]
    correct_answer: "preliminary"
    xp_reward: 15

  # TRUE / FALSE (53-55)
  - id: 53
    type: true_false
    question: "Is this statement true or false? You should assume the audience can interpret data without your explanation."
    statement: "You should assume the audience can interpret data without your explanation."
    correct_answer: false
    xp_reward: 10

  - id: 54
    type: true_false
    question: "Is this statement true or false? Rounding numbers makes them easier to understand and remember."
    statement: "Rounding numbers makes them easier to understand and remember."
    correct_answer: true
    xp_reward: 10

  - id: 55
    type: true_false
    question: "Is this statement true or false? You should always cite the source of your data."
    statement: "You should always cite the source of your data."
    correct_answer: true
    xp_reward: 10

  # MATCHING (56-58)
  - id: 56
    type: matching
    question: "Match the data trend with its description"
    pairs:
      - left: "Upward trend"
        right: "Numbers are increasing over time"
      - left: "Downward trend"
        right: "Numbers are decreasing over time"
      - left: "Flat trend"
        right: "Numbers are stable with little change"
      - left: "Volatile trend"
        right: "Numbers fluctuate significantly"
      - left: "Seasonal trend"
        right: "Regular patterns based on time of year"
    xp_reward: 25

  - id: 57
    type: matching
    question: "Match the data comparison with its description"
    pairs:
      - left: "Year-over-year (YoY)"
        right: "Compared to same period last year"
      - left: "Quarter-over-quarter (QoQ)"
        right: "Compared to previous three months"
      - left: "Month-over-month (MoM)"
        right: "Compared to previous month"
      - left: "Actual vs. budget"
        right: "Compared to planned target"
      - left: "Actual vs. forecast"
        right: "Compared to predicted numbers"
    xp_reward: 25

  - id: 58
    type: matching
    question: "Match the data phrase with its meaning"
    pairs:
      - left: "Outperformed"
        right: "Did better than expected"
      - left: "Underperformed"
        right: "Did worse than expected"
      - left: "On track"
        right: "Meeting expectations"
      - left: "Exceeded"
        right: "Went above target"
      - left: "Missed"
        right: "Fell short of target"
    xp_reward: 25

  # FLASHCARDS (59-60)
  - id: 59
    type: flashcards
    question: "Flashcards: Data Presentation Phrases"
    flashcards:
      - front: "The data shows that"
        back: "Introduce finding"
      - front: "This represents a X% increase"
        back: "Quantify change"
      - front: "Compared to the same period last year"
        back: "Provide context"
      - front: "What's particularly interesting is"
        back: "Highlight key insight"
      - front: "This trend suggests that"
        back: "Draw conclusion"
    xp_reward: 30

  - id: 60
    type: flashcards
    question: "Flashcards: Data Storytelling"
    flashcards:
      - front: "Start with the insight"
        back: "Tell them what the data means first"
      - front: "Show the evidence"
        back: "Then present the data"
      - front: "Explain the implications"
        back: "Why it matters"
      - front: "Connect to the big picture"
        back: "How it supports your message"
      - front: "Recommend action"
        back: "What to do next"
    xp_reward: 30

  # ============================================
  # SECTION 4: USING CHARTS AND GRAPHS (61-80)
  # ============================================

  # MULTIPLE CHOICE (61-67)
  - id: 61
    type: multiple_choice
    question: "Which chart is best for showing trends over time?"
    options:
      - "Pie chart"
      - "Bar chart"
      - "Line chart"
      - "Scatter plot"
    answer: "Line chart"
    xp_reward: 15

  - id: 62
    type: multiple_choice
    question: "Which chart is best for comparing categories or ranking?"
    options:
      - "Line chart"
      - "Pie chart"
      - "Bar chart"
      - "Area chart"
    answer: "Bar chart"
    xp_reward: 15

  - id: 63
    type: multiple_choice
    question: "Which chart is best for showing parts of a whole (percentages)?"
    options:
      - "Line chart"
      - "Pie chart or stacked bar"
      - "Scatter plot"
      - "Histogram"
    answer: "Pie chart or stacked bar"
    xp_reward: 15

  - id: 64
    type: multiple_choice
    question: "What should you always include on every chart?"
    options:
      - "A colorful background"
      - "Clear title, labeled axes, and legend if needed"
      - "At least 20 data points"
      - "Animation effects"
    answer: "Clear title, labeled axes, and legend if needed"
    xp_reward: 15

  - id: 65
    type: multiple_choice
    question: "How many colors should you typically use in a chart for clarity?"
    options:
      - "As many as possible"
      - "2-4 colors maximum"
      - "Only black and white"
      - "Rainbow all colors"
    answer: "2-4 colors maximum"
    xp_reward: 15

  - id: 66
    type: multiple_choice
    question: "What does the 'x-axis' typically show on a chart?"
    options:
      - "The measured values"
      - "The categories or time periods"
      - "The title"
      - "The data labels"
    answer: "The categories or time periods"
    xp_reward: 15

  - id: 67
    type: multiple_choice
    question: "What does the 'y-axis' typically show on a chart?"
    options:
      - "The categories or time"
      - "The measured values or quantities"
      - "The chart title"
      - "The source information"
    answer: "The measured values or quantities"
    xp_reward: 15

  # FILL IN THE BLANK (68-72)
  - id: 68
    type: fill_blank
    question: "Complete the chart introduction"
    text_with_blank: "Let me ___ you this chart, which shows our revenue growth over the past year."
    options: ["show", "present", "share", "display"]
    correct_answer: "show"
    xp_reward: 15

  - id: 69
    type: fill_blank
    question: "Complete the chart explanation"
    text_with_blank: "The x-axis ___ the months, while the y-axis shows sales in thousands."
    options: ["represents", "shows", "indicates", "displays"]
