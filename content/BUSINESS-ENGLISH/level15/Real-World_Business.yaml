lesson:
  name: "Real-World Business Scenarios"
  description: "Master professional English for real-world business situations including job interviews, team meetings, client meetings, investor pitches, sales calls, customer complaints, and networking events"
  xp_reward: 500

exercises:

  # ============================================
  # SECTION 1: JOB INTERVIEWS (1-20)
  # ============================================

  # MULTIPLE CHOICE (1-7)
  - id: 1
    type: multiple_choice
    question: "How should you answer 'Tell me about yourself' in a job interview?"
    options:
      - "Recite your entire life story from birth"
      - "Give a brief professional summary: past experience, current role, why this opportunity interests you"
      - "Just say your name and where you went to school"
      - "Ask what they want to know"
    answer: "Give a brief professional summary: past experience, current role, why this opportunity interests you"
    xp_reward: 15

  - id: 2
    type: multiple_choice
    question: "What is the STAR method used for?"
    options:
      - "Navigating by stars"
      - "Answering behavioral interview questions: Situation, Task, Action, Result"
      - "Writing cover letters"
      - "Negotiating salary"
    answer: "Answering behavioral interview questions: Situation, Task, Action, Result"
    xp_reward: 15

  - id: 3
    type: multiple_choice
    question: "What should you say when asked 'What is your greatest weakness?'"
    options:
      - "I have no weaknesses"
      - "I work too hard"
      - "A genuine weakness with specific steps you're taking to improve"
      - "I'm perfect at everything"
    answer: "A genuine weakness with specific steps you're taking to improve"
    xp_reward: 15

  - id: 4
    type: multiple_choice
    question: "What questions should you ask at the end of an interview?"
    options:
      - "What time do I start?"
      - "How much vacation time do I get?"
      - "What does success look like in this role? What are the biggest challenges facing the team?"
      - "Can you drive me home?"
    answer: "What does success look like in this role? What are the biggest challenges facing the team?"
    xp_reward: 15

  - id: 5
    type: multiple_choice
    question: "How soon after an interview should you send a thank-you note?"
    options:
      - "One month later"
      - "Within 24 hours"
      - "Before the interview ends"
      - "Only if you get the job"
    answer: "Within 24 hours"
    xp_reward: 15

  - id: 6
    type: multiple_choice
    question: "What should you wear to a professional job interview?"
    options:
      - "Casual clothes"
      - "Business professional or business casual appropriate to company culture"
      - "Sportswear"
      - "Costume"
    answer: "Business professional or business casual appropriate to company culture"
    xp_reward: 15

  - id: 7
    type: multiple_choice
    question: "How should you handle a question about your salary expectations?"
    options:
      - "Give an exact number immediately"
      - "Say 'I'm flexible' and let them offer first"
      - "Provide a research-based range and ask about total compensation package"
      - "Refuse to answer"
    answer: "Provide a research-based range and ask about total compensation package"
    xp_reward: 15

  # FILL IN THE BLANK (8-12)
  - id: 8
    type: fill_blank
    question: "Complete the STAR method step"
    text_with_blank: "The S in STAR stands for ___ - describe the context of your example."
    options: ["Situation", "Scenario", "Setting", "Context"]
    correct_answer: "Situation"
    xp_reward: 15

  - id: 9
    type: fill_blank
    question: "Complete the weakness statement"
    text_with_blank: "One area I'm actively developing is my public speaking. I've been ___ Toastmasters for the past six months."
    options: ["attending", "joining", "participating in", "taking"]
    correct_answer: "attending"
    xp_reward: 15

  - id: 10
    type: fill_blank
    question: "Complete the thank-you email opening"
    text_with_blank: "Thank you for ___ the time to meet with me today. I really enjoyed learning about the team and the role."
    options: ["taking", "spending", "finding", "making"]
    correct_answer: "taking"
    xp_reward: 15

  - id: 11
    type: fill_blank
    question: "Complete the follow-up phrase"
    text_with_blank: "I wanted to ___ my interest in the position and reiterate how my skills align with your needs."
    options: ["reiterate", "restate", "reaffirm", "confirm"]
    correct_answer: "reiterate"
    xp_reward: 15

  - id: 12
    type: fill_blank
    question: "Complete the closing statement"
    text_with_blank: "I look forward to ___ from you regarding the next steps in the process."
    options: ["hearing", "receiving", "getting", "seeing"]
    correct_answer: "hearing"
    xp_reward: 15

  # TRUE / FALSE (13-15)
  - id: 13
    type: true_false
    question: "Is this statement true or false? You should arrive 5-10 minutes early for an interview to show punctuality."
    statement: "You should arrive 5-10 minutes early for an interview to show punctuality."
    correct_answer: true
    xp_reward: 10

  - id: 14
    type: true_false
    question: "Is this statement true or false? It is acceptable to check your phone during an interview."
    statement: "It is acceptable to check your phone during an interview."
    correct_answer: false
    xp_reward: 10

  - id: 15
    type: true_false
    question: "Is this statement true or false? Researching the company before an interview is essential."
    statement: "Researching the company before an interview is essential."
    correct_answer: true
    xp_reward: 10

  # MATCHING (16-18)
  - id: 16
    type: matching
    question: "Match the interview question with what it assesses"
    pairs:
      - left: "Why do you want to work here?"
        right: "Your research and motivation"
      - left: "Describe a time you failed"
        right: "Self-awareness and learning ability"
      - left: "Where do you see yourself in 5 years?"
        right: "Ambition and career alignment"
      - left: "Why should we hire you?"
        right: "Your value proposition"
      - left: "Describe a conflict you resolved"
        right: "Interpersonal skills"
    xp_reward: 25

  - id: 17
    type: matching
    question: "Match the interview type with its format"
    pairs:
      - left: "Phone screen"
        right: "Initial filter, 15-30 minutes"
      - left: "Video interview"
        right: "Remote via Zoom/Teams"
      - left: "Panel interview"
        right: "Multiple interviewers at once"
      - left: "Case interview"
        right: "Solving a business problem"
      - left: "Technical interview"
        right: "Testing job-specific skills"
    xp_reward: 25

  - id: 18
    type: matching
    question: "Match the red flag with what it signals"
    pairs:
      - left: "Arriving late"
        right: "Poor time management"
      - left: "Speaking negatively about previous employer"
        right: "Unprofessionalism"
      - left: "No questions for interviewer"
        right: "Lack of interest"
      - left: "Phone ringing during interview"
        right: "Lack of preparation"
      - left: "Vague answers"
        right: "Lack of substance"
    xp_reward: 25

  # FLASHCARDS (19-20)
  - id: 19
    type: flashcards
    question: "Flashcards: Interview Questions to Ask"
    flashcards:
      - front: "What does a typical day look like in this role?"
        right: "Understand daily responsibilities"
      - front: "What are the biggest challenges facing the team?"
        right: "Show strategic thinking"
      - front: "How do you measure success in this position?"
        right: "Understand expectations"
      - front: "What is the company culture like?"
        right: "Assess fit"
      - front: "What are the next steps in the process?"
        right: "Show organization"
    xp_reward: 30

  - id: 20
    type: flashcards
    question: "Flashcards: Post-Interview Follow-up"
    flashcards:
      - front: "Send within 24 hours"
        right: "Timing for thank-you email"
      - front: "Reference a specific discussion point"
        right: "Personalize the note"
      - front: "Reiterate your interest"
        right: "Show enthusiasm"
      - front: "Briefly restate your value"
        right: "Remind them of your fit"
      - front: "Proofread carefully"
        right: "Errors undermine professionalism"
    xp_reward: 30

  # ============================================
  # SECTION 2: TEAM MEETINGS (21-40)
  # ============================================

  # MULTIPLE CHOICE (21-28)
  - id: 21
    type: multiple_choice
    question: "What should you do before a team meeting?"
    options:
      - "Show up without preparation"
      - "Review the agenda, prepare updates, and gather necessary materials"
      - "Skip the meeting"
      - "Arrive late"
    answer: "Review the agenda, prepare updates, and gather necessary materials"
    xp_reward: 15

  - id: 22
    type: multiple_choice
    question: "How should you share your status update in a team meeting?"
    options:
      - "Read every detail of your work"
      - "Be concise: what you accomplished, what you're working on, and any blockers"
      - "Say nothing"
      - "Talk for 20 minutes"
    answer: "Be concise: what you accomplished, what you're working on, and any blockers"
    xp_reward: 15

  - id: 23
    type: multiple_choice
    question: "What should you say when you need to disagree with a colleague in a meeting?"
    options:
      - "You're wrong"
      - "That's a terrible idea"
      - "I see your point, but I have a different perspective. Here's why..."
      - "I disagree with everything you said"
    answer: "I see your point, but I have a different perspective. Here's why..."
    xp_reward: 15

  - id: 24
    type: multiple_choice
    question: "How should you volunteer for a task in a team meeting?"
    options:
      - "Stay silent and hope someone else does it"
      - "I can take that on. I'll have it done by Friday."
      - "Someone should do that"
      - "That's not my job"
    answer: "I can take that on. I'll have it done by Friday."
    xp_reward: 15

  - id: 25
    type: multiple_choice
    question: "How should you respond when you don't know the answer to a question in a meeting?"
    options:
      - "Make something up"
      - "Say 'I don't know' and stop talking"
      - "That's a great question. I don't have that information right now, but I'll find out and follow up."
      - "Ask someone else to answer"
    answer: "That's a great question. I don't have that information right now, but I'll find out and follow up."
    xp_reward: 15

  - id: 26
    type: multiple_choice
    question: "What is the best way to politely interrupt in a team meeting?"
    options:
      - "Just start talking loudly"
      - "Excuse me, may I add something to that point?"
      - "Shout over everyone"
      - "Wave your arms wildly"
    answer: "Excuse me, may I add something to that point?"
    xp_reward: 15

  - id: 27
    type: multiple_choice
    question: "How should you end your contribution in a team meeting?"
    options:
      - "Just stop talking"
      - "That's all I have. Over to you, [Name]."
      - "I'm done"
      - "Someone else talk now"
    answer: "That's all I have. Over to you, [Name]."
    xp_reward: 15

  - id: 28
    type: multiple_choice
    question: "What should you do after a team meeting?"
    options:
      - "Forget everything discussed"
      - "Review action items, complete assigned tasks, and follow up as needed"
      - "Complain about the meeting"
      - "Do nothing until the next meeting"
    answer: "Review action items, complete assigned tasks, and follow up as needed"
    xp_reward: 15

  # FILL IN THE BLANK (29-33)
  - id: 29
    type: fill_blank
    question: "Complete the status update phrase"
    text_with_blank: "Here's my quick ___. Last week I completed the market analysis. This week I'm working on the presentation. No blockers at the moment."
    options: ["update", "status", "report", "summary"]
    correct_answer: "update"
    xp_reward: 15

  - id: 30
    type: fill_blank
    question: "Complete the blocker notification"
    text_with_blank: "I've hit a ___ on the Johnson project. I'm waiting for approval from legal before I can proceed."
    options: ["blocker", "roadblock", "obstacle", "issue"]
    correct_answer: "blocker"
    xp_reward: 15

  - id: 31
    type: fill_blank
    question: "Complete the agreement phrase"
    text_with_blank: "I completely ___ with Sarah's recommendation. That aligns with what we discussed last week."
    options: ["agree", "concur", "align", "share"]
    correct_answer: "agree"
    xp_reward: 15

  - id: 32
    type: fill_blank
    question: "Complete the action item commitment"
    text_with_blank: "I'll ___ the report and have a draft ready by Wednesday COB."
    options: ["draft", "write", "prepare", "complete"]
    correct_answer: "draft"
    xp_reward: 15

  - id: 33
    type: fill_blank
    question: "Complete the meeting wrap-up phrase"
    text_with_blank: "Let me ___ our action items: David will update the budget, Sarah will reach out to the client, and I'll schedule the follow-up."
    options: ["recap", "summarize", "review", "repeat"]
    correct_answer: "recap"
    xp_reward: 15

  # TRUE / FALSE (34-36)
  - id: 34
    type: true_false
    question: "Is this statement true or false? It is acceptable to multitask (check email) during a team meeting."
    statement: "It is acceptable to multitask (check email) during a team meeting."
    correct_answer: false
    xp_reward: 10

  - id: 35
    type: true_false
    question: "Is this statement true or false? You should speak up if you have a concern about a decision being made."
    statement: "You should speak up if you have a concern about a decision being made."
    correct_answer: true
    xp_reward: 10

  - id: 36
    type: true_false
    question: "Is this statement true or false? Meetings should start on time, even if some participants are late."
    statement: "Meetings should start on time, even if some participants are late."
    correct_answer: true
    xp_reward: 10

  # MATCHING (37-38)
  - id: 37
    type: matching
    question: "Match the meeting phrase with its purpose"
    pairs:
      - left: "Can we circle back to that?"
        right: "Return to a previous topic"
      - left: "Let's park that for now"
        right: "Set aside for later discussion"
      - left: "Could you elaborate on that?"
        right: "Request more detail"
      - left: "Let me play devil's advocate"
        right: "Challenge an idea constructively"
      - left: "To build on what [Name] said"
        right: "Add to someone's point"
    xp_reward: 25

  - id: 38
    type: matching
    question: "Match the meeting role with the responsibility"
    pairs:
      - left: "Facilitator"
        right: "Leads discussion and keeps on track"
      - left: "Timekeeper"
        right: "Monitors agenda timing"
      - left: "Note-taker"
        right: "Records decisions and action items"
      - left: "Participant"
        right: "Contributes and engages"
      - left: "Decision-maker"
        right: "Makes final call when needed"
    xp_reward: 25

  # FLASHCARDS (39-40)
  - id: 39
    type: flashcards
    question: "Flashcards: Meeting Etiquette"
    flashcards:
      - front: "Come prepared"
        right: "Review agenda beforehand"
      - front: "Be on time"
        right: "Respect everyone's schedule"
      - front: "Participate actively"
        right: "Share updates and ideas"
      - front: "Listen to others"
        right: "Don't interrupt"
      - front: "Stay on topic"
        right: "Avoid tangents"
    xp_reward: 30

  - id: 40
    type: flashcards
    question: "Flashcards: Virtual Meeting Phrases"
    flashcards:
      - front: "You're on mute"
        right: "Reminder to unmute"
      - front: "Can everyone see my screen?"
        right: "Before screen sharing"
      - front: "I think [Name] is trying to speak"
        right: "Help with turn-taking"
      - front: "I'll type that in the chat"
        right: "Share information"
      - front: "Let me stop sharing"
        right: "End screen share"
    xp_reward: 30

  # ============================================
  # SECTION 3: CLIENT MEETINGS (41-60)
  # ============================================

  # MULTIPLE CHOICE (41-48)
  - id: 41
    type: multiple_choice
    question: "How should you open a client meeting?"
    options:
      - "Let's get this over with"
      - "Thank you for meeting with us today. To make the most of our time, here's what we'd like to cover."
      - "Tell me what you want"
      - "I'm busy so let's make this quick"
    answer: "Thank you for meeting with us today. To make the most of our time, here's what we'd like to cover."
    xp_reward: 15

  - id: 42
    type: multiple_choice
    question: "What should you do before a client meeting?"
    options:
      - "Show up without preparation"
      - "Research the client, their business, recent news, and prepare an agenda"
      - "Assume you know everything"
      - "Wing it"
    answer: "Research the client, their business, recent news, and prepare an agenda"
    xp_reward: 15

  - id: 43
    type: multiple_choice
    question: "How should you handle a client's objection during a meeting?"
    options:
      - "Argue with them"
      - "I understand your concern. Let me address that directly."
      - "Ignore the objection"
      - "Get defensive"
    answer: "I understand your concern. Let me address that directly."
    xp_reward: 15

  - id: 44
    type: multiple_choice
    question: "What should you say when a client asks a question you can't answer immediately?"
    options:
      - "I don't know"
      - "That's an excellent question. I don't have that information at hand, but I will research it and follow up by [specific time]."
      - "Ask someone else"
      - "Make up an answer"
    answer: "That's an excellent question. I don't have that information at hand, but I will research it and follow up by [specific time]."
    xp_reward: 15

  - id: 45
    type: multiple_choice
    question: "How should you end a client meeting?"
    options:
      - "Just stand up and leave"
      - "Summarize key points, confirm next steps, thank the client for their time"
      - "Ask if they're happy"
      - "Say 'That's all I have'"
    answer: "Summarize key points, confirm next steps, thank the client for their time"
    xp_reward: 15

  - id: 46
    type: multiple_choice
    question: "What should you do after a client meeting?"
    options:
      - "Forget about it"
      - "Send a follow-up email summarizing decisions, action items, and next steps within 24 hours"
      - "Wait for the client to contact you"
      - "Do nothing"
    answer: "Send a follow-up email summarizing decisions, action items, and next steps within 24 hours"
    xp_reward: 15

  - id: 47
    type: multiple_choice
    question: "How should you respond if a client is unhappy with your work?"
    options:
      - "Blame someone else"
      - "I understand your frustration. Let me understand what went wrong and how we can make it right."
      - "That's not my problem"
      - "Get defensive"
    answer: "I understand your frustration. Let me understand what went wrong and how we can make it right."
    xp_reward: 15

  - id: 48
    type: multiple_choice
    question: "What should you bring to a client meeting?"
    options:
      - "Nothing"
      - "Agenda, presentation materials, note-taking tools, business cards"
      - "Only your phone"
      - "Coffee for yourself"
    answer: "Agenda, presentation materials, note-taking tools, business cards"
    xp_reward: 15

  # FILL IN THE BLANK (49-53)
  - id: 49
    type: fill_blank
    question: "Complete the meeting opening"
    text_with_blank: "Thank you for ___ us today. We've prepared a brief presentation followed by time for discussion."
    options: ["meeting with", "joining", "seeing", "hosting"]
    correct_answer: "joining"
    xp_reward: 15

  - id: 50
    type: fill_blank
    question: "Complete the agenda preview"
    text_with_blank: "Here's what we'd like to ___ today: first, a quick project update, then discussion of next quarter's priorities."
    options: ["cover", "discuss", "review", "address"]
    correct_answer: "cover"
    xp_reward: 15

  - id: 51
    type: fill_blank
    question: "Complete the understanding check"
    text_with_blank: "Let me make sure I ___ your requirements correctly. You need the report by the 15th, is that right?"
    options: ["understand", "interpret", "hear", "capture"]
    correct_answer: "understand"
    xp_reward: 15

  - id: 52
    type: fill_blank
    question: "Complete the follow-up commitment"
    text_with_blank: "I'll ___ a revised proposal to you by end of week based on our discussion today."
    options: ["send", "email", "provide", "share"]
    correct_answer: "send"
    xp_reward: 15

  - id: 53
    type: fill_blank
    question: "Complete the thank-you statement"
    text_with_blank: "Thank you again for your ___ today. We look forward to continuing our partnership."
    options: ["time", "input", "feedback", "insights"]
    correct_answer: "time"
    xp_reward: 15

  # TRUE / FALSE (54-56)
  - id: 54
    type: true_false
    question: "Is this statement true or false? You should always confirm next steps before leaving a client meeting."
    statement: "You should always confirm next steps before leaving a client meeting."
    correct_answer: true
    xp_reward: 10

  - id: 55
    type: true_false
    question: "Is this statement true or false? It is acceptable to check your phone during a client meeting."
    statement: "It is acceptable to check your phone during a client meeting."
    correct_answer: false
    xp_reward: 10

  - id: 56
    type: true_false
    question: "Is this statement true or false? Active listening is crucial in client meetings."
    statement: "Active listening is crucial in client meetings."
    correct_answer: true
    xp_reward: 10

  # MATCHING (57-58)
  - id: 57
    type: matching
    question: "Match the client meeting phase with the appropriate phrase"
    pairs:
      - left: "Opening"
        right: "Thank you for meeting with us. Here's our agenda."
      - left: "Discovery"
        right: "Can you tell me more about your current challenges?"
      - left: "Presentation"
        right: "Let me walk you through our proposed solution."
      - left: "Discussion"
        right: "What are your thoughts on this approach?"
      - left: "Closing"
        right: "Let me summarize next steps and when you can expect follow-up."
    xp_reward: 25

  - id: 58
    type: matching
    question: "Match the client concern with the appropriate response"
    pairs:
      - left: "Budget concern"
        right: "I understand budget is a priority. Let me show you the ROI we're projecting."
      - left: "Timeline concern"
        right: "I hear your concern about the timeline. Let me walk you through our accelerated plan."
      - left: "Quality concern"
        right: "Quality is our top priority. Let me share our quality assurance process."
      - left: "Previous bad experience"
        right: "I'm sorry to hear about your past experience. Let me explain how our approach differs."
      - left: "Competitor comparison"
        right: "That's a fair question. Let me highlight what makes our solution unique."
    xp_reward: 25

  # FLASHCARDS (59-60)
  - id: 59
    type: flashcards
    question: "Flashcards: Client Meeting Follow-up Email"
    flashcards:
      - front: "Subject line"
        right: "Follow-up: [Meeting topic] - [Date]"
      - front: "Thank you statement"
        right: "Thank you for your time today"
      - front: "Summary of discussion"
        right: "Brief recap of key points"
      - front: "Action items"
        right: "What each party will do and by when"
      - front: "Next meeting"
        right: "Proposed date or confirmation of next steps"
    xp_reward: 30

  - id: 60
    type: flashcards
    question: "Flashcards: Building Client Rapport"
    flashcards:
      - front: "Use the client's name"
        right: "Personalizes the conversation"
      - front: "Show genuine interest"
        right: "Ask about their business goals"
      - front: "Acknowledge their expertise"
        right: "You clearly know your market well"
      - front: "Follow through on promises"
        right: "Builds trust and credibility"
      - front: "Be responsive"
        right: "Answer questions promptly after meeting"
    xp_reward: 30

  # ============================================
  # SECTION 4: INVESTOR PITCHES (61-80)
  # ============================================

  # MULTIPLE CHOICE (61-68)
  - id: 61
    type: multiple_choice
    question: "What is the ideal length of an investor pitch deck?"
    options:
      - "30-40 slides"
      - "10-15 slides"
      - "50-60 slides"
      - "2-3 slides"
    answer: "10-15 slides"
    xp_reward: 15

  - id: 62
    type: multiple_choice
    question: "What is the most important thing to include in an investor pitch?"
    options:
      - "Your personal life story"
      - "Clear articulation of the problem, solution, and market opportunity"
      - "Detailed technical specifications"
      - "Photos of your office"
    answer: "Clear articulation of the problem, solution, and market opportunity"
    xp_reward: 15

  - id: 63
    type: multiple_choice
    question: "How long should your verbal pitch be?"
    options:
      - "5 minutes or less"
      - "30-60 minutes"
      - "2 hours"
      - "10 seconds"
    answer: "5 minutes or less"
    xp_reward: 15

  - id: 64
    type: multiple_choice
    question: "What should you include on your 'traction' slide?"
    options:
      - "Photos of your team"
      - "Revenue, user growth, partnerships, or other proof of market demand"
      - "Your personal hobbies"
      - "Office photos"
    answer: "Revenue, user growth, partnerships, or other proof of market demand"
    xp_reward: 15

  - id: 65
    type: multiple_choice
    question: "What should you say when an investor asks about your competition?"
    options:
      - "We have no competition"
      - "Acknowledge competitors honestly, then explain your unique differentiation"
      - "Ignore the question"
      - "Say the competition is terrible"
    answer: "Acknowledge competitors honestly, then explain your unique differentiation"
    xp_reward: 15

  - id: 66
    type: multiple_choice
    question: "What should you include on the 'ask' slide?"
    options:
      - "A request for money only"
      - "How much you're raising, valuation (if applicable), and exactly how you'll use the funds"
      - "A phone number to call"
      - "Your bank account details"
    answer: "How much you're raising, valuation (if applicable), and exactly how you'll use the funds"
