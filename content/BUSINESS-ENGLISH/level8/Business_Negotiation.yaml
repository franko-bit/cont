lesson:
  name: "Business Negotiation"
  description: "Master professional business negotiation skills including strategies, offers, counteroffers, agreements, contracts, pricing, and conflict resolution"
  xp_reward: 500

exercises:

  # ============================================
  # SECTION 1: NEGOTIATION STRATEGIES (1-25)
  # ============================================

  # MULTIPLE CHOICE (1-8)
  - id: 1
    type: multiple_choice
    question: "What is the most important thing to do before entering any negotiation?"
    options:
      - "Prepare thoroughly: know your goals, BATNA, and walk-away point"
      - "Show up and improvise"
      - "Assume you'll get everything you want"
      - "Plan to argue aggressively"
    answer: "Prepare thoroughly: know your goals, BATNA, and walk-away point"
    xp_reward: 15

  - id: 2
    type: multiple_choice
    question: "What does 'BATNA' stand for in negotiation?"
    options:
      - "Best Alternative To a Negotiated Agreement"
      - "Basic Agreement Terms and Negotiation Approach"
      - "Business And Trade Negotiation Association"
      - "Before Any Talk, Note Alternatives"
    answer: "Best Alternative To a Negotiated Agreement"
    xp_reward: 15

  - id: 3
    type: multiple_choice
    question: "What is a 'win-win' negotiation outcome?"
    options:
      - "One side wins everything, the other loses everything"
      - "Both parties walk away feeling they gained value"
      - "Neither side gets anything"
      - "The negotiation ends in a tie"
    answer: "Both parties walk away feeling they gained value"
    xp_reward: 15

  - id: 4
    type: multiple_choice
    question: "What is 'ZOPA' in negotiation?"
    options:
      - "Zone of Possible Agreement - the range where both parties can find common ground"
      - "Zero Profit Agreement"
      - "Zonal Operating Procedure Agreement"
      - "Zone of Preferred Alternatives"
    answer: "Zone of Possible Agreement - the range where both parties can find common ground"
    xp_reward: 15

  - id: 5
    type: multiple_choice
    question: "What is the difference between 'positional' and 'interest-based' negotiation?"
    options:
      - "Positional focuses on stated demands; interest-based focuses on underlying needs"
      - "They are exactly the same"
      - "Positional is always better"
      - "Interest-based ignores what parties want"
    answer: "Positional focuses on stated demands; interest-based focuses on underlying needs"
    xp_reward: 15

  - id: 6
    type: multiple_choice
    question: "What is 'anchoring' in negotiation strategy?"
    options:
      - "A boat reference"
      - "Making the first offer to set the reference point for the negotiation"
      - "Refusing to move from your position"
      - "Ending the negotiation early"
    answer: "Making the first offer to set the reference point for the negotiation"
    xp_reward: 15

  - id: 7
    type: multiple_choice
    question: "What does 'distributive negotiation' refer to?"
    options:
      - "A negotiation where parties try to distribute value equally"
      - "A 'fixed pie' negotiation where one party's gain is the other's loss"
      - "A negotiation about distribution of goods"
      - "A collaborative negotiation approach"
    answer: "A 'fixed pie' negotiation where one party's gain is the other's loss"
    xp_reward: 15

  - id: 8
    type: multiple_choice
    question: "What is 'integrative negotiation'?"
    options:
      - "A competitive, adversarial approach"
      - "A collaborative approach seeking to expand the pie for mutual gain"
      - "A negotiation about integration"
      - "A one-sided negotiation"
    answer: "A collaborative approach seeking to expand the pie for mutual gain"
    xp_reward: 15

  # FILL IN THE BLANK (9-14)
  - id: 9
    type: fill_blank
    question: "Complete the BATNA statement"
    text_with_blank: "Before we begin, I want to be clear about our ___ . We have other suppliers interested."
    options: ["BATNA", "alternatives", "options", "leverage"]
    correct_answer: "BATNA"
    xp_reward: 15

  - id: 10
    type: fill_blank
    question: "Complete the interest exploration"
    text_with_blank: "Instead of focusing on positions, let's explore our underlying ___ ."
    options: ["interests", "needs", "concerns", "motivations"]
    correct_answer: "interests"
    xp_reward: 15

  - id: 11
    type: fill_blank
    question: "Complete the collaboration invitation"
    text_with_blank: "Let's work ___ to find a solution that benefits both of us."
    options: ["together", "collaboratively", "jointly", "cooperatively"]
    correct_answer: "together"
    xp_reward: 15

  - id: 12
    type: fill_blank
    question: "Complete the ZOPA identification"
    text_with_blank: "I believe there's a ___ of possible agreement between $45,000 and $52,000."
    options: ["zone", "range", "area", "window"]
    correct_answer: "zone"
    xp_reward: 15

  - id: 13
    type: fill_blank
    question: "Complete the preparation statement"
    text_with_blank: "Before our meeting, I've ___ my objectives and walk-away points."
    options: ["prepared", "defined", "clarified", "identified"]
    correct_answer: "defined"
    xp_reward: 15

  - id: 14
    type: fill_blank
    question: "Complete the value creation statement"
    text_with_blank: "How can we ___ value here rather than just dividing it?"
    options: ["create", "generate", "add", "expand"]
    correct_answer: "create"
    xp_reward: 15

  # TRUE / FALSE (15-17)
  - id: 15
    type: true_false
    question: "Is this statement true or false? The best negotiators focus on winning at all costs, even if it damages relationships."
    statement: "The best negotiators focus on winning at all costs, even if it damages relationships."
    correct_answer: false
    xp_reward: 10

  - id: 16
    type: true_false
    question: "Is this statement true or false? Preparation is more important than in-negotiation tactics."
    statement: "Preparation is more important than in-negotiation tactics."
    correct_answer: true
    xp_reward: 10

  - id: 17
    type: true_false
    question: "Is this statement true or false? A strong BATNA gives you leverage in negotiation."
    statement: "A strong BATNA gives you leverage in negotiation."
    correct_answer: true
    xp_reward: 10

  # MATCHING (18-21)
  - id: 18
    type: matching
    question: "Match the negotiation concept with its definition"
    pairs:
      - left: "BATNA"
        right: "Best alternative if no deal is reached"
      - left: "Reservation price"
        right: "Your walk-away point"
      - left: "ZOPA"
        right: "Range where agreement is possible"
      - left: "Anchoring"
        right: "Setting the reference point with first offer"
      - left: "Leverage"
        right: "Advantage or power in negotiation"
    xp_reward: 25

  - id: 19
    type: matching
    question: "Match the negotiation style with its characteristics"
    pairs:
      - left: "Competitive"
        right: "Winning is primary, aggressive, short-term focus"
      - left: "Collaborative"
        right: "Problem-solving, mutual gain, long-term relationship"
      - left: "Accommodating"
        right: "Prioritizes relationship over outcome"
      - left: "Avoiding"
        right: "Postpones or withdraws from negotiation"
      - left: "Compromising"
        right: "Splits differences, moderate outcome"
    xp_reward: 25

  - id: 20
    type: matching
    question: "Match the negotiation phase with the key activity"
    pairs:
      - left: "Preparation"
        right: "Research, set goals, know BATNA"
      - left: "Opening"
        right: "Set the tone, make first offer"
      - left: "Exploration"
        right: "Ask questions, identify interests"
      - left: "Bargaining"
        right: "Exchange offers, make concessions"
      - left: "Closing"
        right: "Finalize agreement, confirm terms"
    xp_reward: 25

  - id: 21
    type: matching
    question: "Match the psychological tactic with its description"
    pairs:
      - left: "Framing"
        right: "Presenting information to influence perception"
      - left: "Reciprocity"
        right: "Giving something to get something"
      - left: "Scarcity"
        right: "Highlighting limited availability"
      - left: "Social proof"
        right: "Mentioning what others have agreed to"
      - left: "Authority"
        right: "Referencing experts or data"
    xp_reward: 25

  # FLASHCARDS (22-25)
  - id: 22
    type: flashcards
    question: "Flashcards: Pre-negotiation Preparation"
    flashcards:
      - front: "Know your BATNA"
        right: "Your best alternative if no deal"
      - front: "Know your reservation price"
        right: "Your walk-away point"
      - front: "Identify your interests"
        right: "What you really need (not just positions)"
      - front: "Research the other party"
        right: "Understand their needs and constraints"
      - front: "Set aspirational goals"
        right: "Aim high but realistically"
    xp_reward: 30

  - id: 23
    type: flashcards
    question: "Flashcards: Opening Strategies"
    flashcards:
      - front: "Make the first offer"
        right: "Anchors the negotiation in your favor"
      - front: "Start with a range"
        right: "Softens your anchor point"
      - front: "Ask for more than you expect"
        right: "Creates room to concede"
      - front: "Start with an extreme anchor"
        right: "Very high first offer (use cautiously)"
      - front: "Defer making the first offer"
        right: "Let the other party anchor first"
    xp_reward: 30

  - id: 24
    type: flashcards
    question: "Flashcards: Power in Negotiation"
    flashcards:
      - front: "Alternatives = power"
        right: "Strong BATNA = more leverage"
      - front: "Information = power"
        right: "Know more than the other party"
      - front: "Time = power"
        right: "Less time pressure = more power"
      - front: "Expertise = power"
        right: "Unique knowledge or skill"
      - front: "Legitimacy = power"
        right: "Authority, title, or position"
    xp_reward: 30

  - id: 25
    type: flashcards
    question: "Flashcards: Common Negotiation Mistakes"
    flashcards:
      - front: "Failing to prepare"
        right: "Entering without BATNA or goals"
      - front: "Conceding too quickly"
        right: "Not testing the other side"
      - front: "Taking positions personally"
        right: "Emotional attachment to demands"
      - front: "Not listening enough"
        right: "Missing valuable information"
      - front: "Leaving value on the table"
        right: "Not exploring creative options"
    xp_reward: 30

  # ============================================
  # SECTION 2: MAKING OFFERS (26-50)
  # ============================================

  # MULTIPLE CHOICE (26-33)
  - id: 26
    type: multiple_choice
    question: "What is the best way to present your first offer?"
    options:
      - "Demand aggressively"
      - "State your offer confidently, with justification, and leave room to negotiate"
      - "Whisper it quietly"
      - "Don't make an offer at all"
    answer: "State your offer confidently, with justification, and leave room to negotiate"
    xp_reward: 15

  - id: 27
    type: multiple_choice
    question: "What is a 'conditional offer'?"
    options:
      - "An offer that depends on something else happening"
      - "An offer with no conditions"
      - "An offer that is final"
      - "An offer that is vague"
    answer: "An offer that depends on something else happening"
    xp_reward: 15

  - id: 28
    type: multiple_choice
    question: "How should you phrase a professional offer?"
    options:
      - "Take it or leave it"
      - "We are prepared to offer $50,000, subject to a 30-day payment term"
      - "Here's what we'll give you"
      - "This is our final offer"
    answer: "We are prepared to offer $50,000, subject to a 30-day payment term"
    xp_reward: 15

  - id: 29
    type: multiple_choice
    question: "What is a 'package offer'?"
    options:
      - "An offer in a package"
      - "An offer that bundles multiple items or terms together"
      - "A discounted offer"
      - "A final offer"
    answer: "An offer that bundles multiple items or terms together"
    xp_reward: 15

  - id: 30
    type: multiple_choice
    question: "What should you include when making a proposal offer?"
    options:
      - "Only the price"
      - "Price, terms, conditions, timeline, and any contingencies"
      - "Only your demands"
      - "A threat"
    answer: "Price, terms, conditions, timeline, and any contingencies"
    xp_reward: 15

  - id: 31
    type: multiple_choice
    question: "What does it mean to 'test an offer'?"
    options:
      - "To test if the offer is physically strong"
      - "To propose an offer informally to gauge reaction before making it formally"
      - "To reject an offer"
      - "To accept an offer immediately"
    answer: "To propose an offer informally to gauge reaction before making it formally"
    xp_reward: 15

  - id: 32
    type: multiple_choice
    question: "What is a 'take-it-or-leave-it' offer also known as?"
    options:
      - "Anchoring offer"
      - "Boulwarism or final offer"
      - "Conditional offer"
      - "Opening offer"
    answer: "Boulwarism or final offer"
    xp_reward: 15

  - id: 33
    type: multiple_choice
    question: "When is a 'take-it-or-leave-it' offer appropriate?"
    options:
      - "In every negotiation"
      - "Never"
      - "When you have strong BATNA and no interest in ongoing relationship"
      - "Only when you're angry"
    answer: "When you have strong BATNA and no interest in ongoing relationship"
    xp_reward: 15

  # FILL IN THE BLANK (34-39)
  - id: 34
    type: fill_blank
    question: "Complete the offer presentation"
    text_with_blank: "We are ___ to offer $75,000 for the initial contract."
    options: ["prepared", "ready", "willing", "able"]
    correct_answer: "prepared"
    xp_reward: 15

  - id: 35
    type: fill_blank
    question: "Complete the conditional offer"
    text_with_blank: "We can agree to that price, ___ on delivery being completed by December 15th."
    options: ["conditional", "subject", "dependent", "contingent"]
    correct_answer: "subject"
    xp_reward: 15

  - id: 36
    type: fill_blank
    question: "Complete the package offer description"
    text_with_blank: "Our ___ includes the software license, training, and 12 months of support."
    options: ["package", "bundle", "offer", "proposal"]
    correct_answer: "package"
    xp_reward: 15

  - id: 37
    type: fill_blank
    question: "Complete the offer justification"
    text_with_blank: "Our offer is based on market rates and the ___ of the project."
    options: ["scope", "size", "complexity", "scale"]
    correct_answer: "scope"
    xp_reward: 15

  - id: 38
    type: fill_blank
    question: "Complete the test offer phrase"
    text_with_blank: "I want to ___ an idea. What would you think of a three-year contract?"
    options: ["test", "float", "propose", "suggest"]
    correct_answer: "test"
    xp_reward: 15

  - id: 39
    type: fill_blank
    question: "Complete the proposal delivery"
    text_with_blank: "I'll ___ a formal proposal by the end of the week."
    options: ["send", "submit", "provide", "deliver"]
    correct_answer: "send"
    xp_reward: 15

  # TRUE / FALSE (40-42)
  - id: 40
    type: true_false
    question: "Is this statement true or false? Your first offer should always be your best and final offer."
    statement: "Your first offer should always be your best and final offer."
    correct_answer: false
    xp_reward: 10

  - id: 41
    type: true_false
    question: "Is this statement true or false? Offering too low can offend the other party and harm the negotiation."
    statement: "Offering too low can offend the other party and harm the negotiation."
    correct_answer: true
    xp_reward: 10

  - id: 42
    type: true_false
    question: "Is this statement true or false? You should always explain the rationale behind your offer."
    statement: "You should always explain the rationale behind your offer."
    correct_answer: true
    xp_reward: 10

  # MATCHING (43-46)
  - id: 43
    type: matching
    question: "Match the offer type with its description"
    pairs:
      - left: "Opening offer"
        right: "First offer made in negotiation"
      - left: "Aspirational offer"
        right: "Ideal outcome, higher than expected"
      - left: "Concession offer"
        right: "Moving from previous position"
      - left: "Final offer"
        right: "Last offer before walking away"
      - left: "Split-the-difference offer"
        right: "Meeting exactly in the middle"
    xp_reward: 25

  - id: 44
    type: matching
    question: "Match the offer component with what it addresses"
    pairs:
      - left: "Price/Financial terms"
        right: "Monetary value"
      - left: "Timeline/Delivery"
        right: "When something happens"
      - left: "Quality/Specifications"
        right: "What is being delivered"
      - left: "Terms and conditions"
        right: "Legal and operational requirements"
      - left: "Contingencies"
        right: "What must happen for offer to be valid"
    xp_reward: 25

  - id: 45
    type: matching
    question: "Match the offer justification with its example"
    pairs:
      - left: "Market-based"
        right: "Our research shows similar services cost between X and Y"
      - left: "Cost-based"
        right: "Our costs for materials have increased 15% this year"
      - left: "Value-based"
        right: "This solution will save you $100,000 annually"
      - left: "Competitor-based"
        right: "Our competitors are offering similar terms at this price point"
      - left: "Relationship-based"
        right: "Given our long partnership, we're offering our best terms"
    xp_reward: 25

  - id: 46
    type: matching
    question: "Match the offer delivery style with the situation"
    pairs:
      - left: "Direct and confident"
        right: "When you have strong leverage"
      - left: "Tentative and exploratory"
        right: "Early stage, building relationship"
      - left: "Formal and documented"
        right: "Major contract, legal review needed"
      - left: "Quick and verbal"
        right: "Small items, established relationship"
      - left: "Conditional with qualifiers"
        right: "Complex multi-party negotiation"
    xp_reward: 25

  # FLASHCARDS (47-50)
  - id: 47
    type: flashcards
    question: "Flashcards: Making Your First Offer"
    flashcards:
      - front: "Anchor high but credibly"
        right: "Set a high but justifiable starting point"
      - front: "Provide justification"
        right: "Explain why your offer is reasonable"
      - front: "Leave room to move"
        right: "Don't start at your bottom line"
      - front: "Be specific, not round"
        right: "$47,500 sounds more researched than $50,000"
      - front: "Use conditional language"
        right: "Subject to... based on... assuming that..."
    xp_reward: 30

  - id: 48
    type: flashcards
    question: "Flashcards: Offer Phrases"
    flashcards:
      - front: "We propose the following terms"
        right: "Formal offer introduction"
      - front: "Our proposal is as follows"
        right: "Alternative formal opening"
      - front: "What if we structured it this way?"
        right: "Exploratory offer"
      - front: "We could consider [X] if you can agree to [Y]"
        right: "Conditional offer"
      - front: "Based on what we've discussed, we're prepared to offer"
        right: "Building on conversation"
    xp_reward: 30

  - id: 49
    type: flashcards
    question: "Flashcards: Responding to an Offer"
    flashcards:
      - front: "Thank you for the proposal"
        right: "Polite acknowledgment"
      - front: "Let me review this with my team"
        right: "Buy time to consider"
      - front: "I appreciate your offer. However..."
        right: "Polite rejection or counter"
      - front: "That's an interesting starting point"
        right: "Neutral response to high anchor"
      - front: "We're not in alignment yet, but let's explore"
        right: "Keep negotiation open"
    xp_reward: 30

  - id: 50
    type: flashcards
    question: "Flashcards: Negotiation Variables"
    flashcards:
      - front: "Price"
        right: "Monetary amount"
      - front: "Payment terms"
        right: "When and how payment is made"
      - front: "Delivery schedule"
        right: "Timing of goods or services"
      - front: "Warranty/guarantee"
        right: "Assurances and protections"
      - front: "Service level"
        right: "Quality and responsiveness of support"
    xp_reward: 30

  # ============================================
  # SECTION 3: COUNTEROFFERS (51-75)
  # ============================================

  # MULTIPLE CHOICE (51-58)
  - id: 51
    type: multiple_choice
    question: "What is the best way to respond to an offer you find unreasonable?"
    options:
      - "Get angry and walk away"
      - "Accept it anyway"
      - "Stay calm, acknowledge the offer, and make a counteroffer"
      - "Ignore it completely"
    answer: "Stay calm, acknowledge the offer, and make a counteroffer"
    xp_reward: 15

  - id: 52
    type: multiple_choice
    question: "What is a 'bracketing' counteroffer strategy?"
    options:
      - "Putting the offer in a bracket"
      - "Moving from your anchor toward their offer, but less than half"
      - "Accepting immediately"
      - "Rejecting without alternative"
    answer: "Moving from your anchor toward their offer, but less than half"
    xp_reward: 15

  - id: 53
    type: multiple_choice
    question: "What should you avoid when making a counteroffer?"
    options:
      - "Providing justification"
      - "Making a counteroffer without a clear rationale"
      - "Being polite"
      - "Leaving room to negotiate"
    answer: "Making a counteroffer without a clear rationale"
    xp_reward: 15

  - id: 54
    type: multiple_choice
    question: "What does 'concession pattern' refer to?"
    options:
      - "A pattern on clothing"
      - "The size and frequency of your concessions during negotiation"
      - "A type of negotiation strategy"
      - "A legal document"
    answer: "The size and frequency of your concessions during negotiation"
    xp_reward: 15

  - id: 55
    type: multiple_choice
    question: "What is the recommended concession pattern?"
    options:
      - "Large first concession, then smaller, then none"
      - "Make the same size concessions every time"
      - "Start small, then get larger"
      - "Never make any concessions"
    answer: "Large first concession, then smaller, then none"
    xp_reward: 15

  - id: 56
    type: multiple_choice
    question: "What is 'reciprocal concession'?"
    options:
      - "Making a concession without getting anything"
      - "Only conceding when the other side also concedes"
      - "Never conceding"
      - "Conceding everything at once"
    answer: "Only conceding when the other side also concedes"
    xp_reward: 15

  - id: 57
    type: multiple_choice
    question: "What should you say when you receive a counteroffer?"
    options:
      - "That's ridiculous"
      - "Thank you. Let me consider this and get back to you."
      - "Never talk to me again"
      - "I accept immediately"
    answer: "Thank you. Let me consider this and get back to you."
    xp_reward: 15

  - id: 58
    type: multiple_choice
    question: "What is a 'deadline concession'?"
    options:
      - "Conceding because you're out of time"
      - "Giving the other party more time to respond"
      - "Conceding on the deadline itself"
      - "Using time pressure as leverage"
    answer: "Using time pressure as leverage"
    xp_reward: 15

  # FILL IN THE BLANK (59-64)
  - id: 59
    type: fill_blank
    question: "Complete the counteroffer opening"
    text_with_blank: "I appreciate your offer. However, we were hoping for something in the ___ of $60,000."
    options: ["range", "area", "neighborhood", "ballpark"]
    correct_answer: "range"
    xp_reward: 15

  - id: 60
    type: fill_blank
    question: "Complete the bracketing example"
    text_with_blank: "You offered $40,000. We proposed $60,000. How about we ___ the difference at $50,000?"
    options: ["split", "halve", "divide", "meet"]
    correct_answer: "split"
    xp_reward: 15

  - id: 61
    type: fill_blank
    question: "Complete the reciprocal concession statement"
    text_with_blank: "If you can move on price, we may be able to ___ on delivery timeline."
    options: ["compromise", "concede", "flex", "adjust"]
    correct_answer: "compromise"
    xp_reward: 15

  - id: 62
    type: fill_blank
    question: "Complete the justification for counteroffer"
    text_with_blank: "Our counteroffer is based on the additional ___ we're bringing to this project."
    options: ["value", "expertise", "resources", "capabilities"]
    correct_answer: "value"
    xp_reward: 15

  - id: 63
    type: fill_blank
    question: "Complete the concession pattern statement"
    text_with_blank: "We've already moved ___ on several points. We need to see movement from your side."
    options: ["significantly", "substantially", "considerably", "materially"]
    correct_answer: "significantly"
    xp_reward: 15

  - id: 64
    type: fill_blank
    question: "Complete the counteroffer limitation"
    text_with_blank: "This is our best and ___ counteroffer."
    options: ["final", "last", "ultimate", "conclusive"]
    correct_answer: "final"
    xp_reward: 15

  # TRUE / FALSE (65-67)
  - id: 65
    type: true_false
    question: "Is this statement true or false? You should always counteroffer, never accept the first offer."
    statement: "You should always counteroffer, never accept the first offer."
    correct_answer: false
    xp_reward: 10

  - id: 66
    type: true_false
    question: "Is this statement true or false? Making concessions too quickly signals weakness."
    statement: "Making concessions too quickly signals weakness."
    correct_answer: true
    xp_reward: 10

  - id: 67
    type: true_false
    question: "Is this statement true or false? Each concession should be smaller than the previous one."
    statement: "Each concession should be smaller than the previous one."
    correct_answer: true
    xp_reward: 10

  # MATCHING (68-71)
  - id: 68
    type: matching
    question: "Match the counteroffer strategy with its description"
    pairs:
      - left: "Bracketing"
        right: "Split the difference by moving less than halfway"
      - left: "Reciprocal concession"
