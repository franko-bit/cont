  # ============================================
  # SECTION 1: LEADERSHIP SKILLS (1-20)
  # ============================================

  # MULTIPLE CHOICE (1-7)
  - id: 1
    type: multiple_choice
    question: "What is the difference between a 'manager' and a 'leader'?"
    options:
      - "There is no difference"
      - "Managers focus on systems and control; leaders focus on vision and inspiration"
      - "Managers are higher rank than leaders"
      - "Leaders only exist in sports"
    answer: "Managers focus on systems and control; leaders focus on vision and inspiration"
    xp_reward: 15

  - id: 2
    type: multiple_choice
    question: "What is 'emotional intelligence' (EQ) in leadership?"
    options:
      - "A type of IQ test"
      - "The ability to recognize, understand, and manage one's own emotions and others' emotions"
      - "Being overly emotional at work"
      - "Ignoring emotions completely"
    answer: "The ability to recognize, understand, and manage one's own emotions and others' emotions"
    xp_reward: 15

  - id: 3
    type: multiple_choice
    question: "What are the five components of emotional intelligence according to Goleman?"
    options:
      - "Smart, strong, fast, tall, rich"
      - "Self-awareness, self-regulation, motivation, empathy, social skill"
      - "IQ, EQ, SQ, AQ, PQ"
      - "Planning, organizing, leading, controlling, staffing"
    answer: "Self-awareness, self-regulation, motivation, empathy, social skill"
    xp_reward: 15

  - id: 4
    type: multiple_choice
    question: "What is 'visionary leadership'?"
    options:
      - "Leadership about vision"
      - "A leadership style that focuses on creating and communicating a compelling future vision"
      - "Leadership for visually impaired people"
      - "A type of strategic planning"
    answer: "A leadership style that focuses on creating and communicating a compelling future vision"
    xp_reward: 15

  - id: 5
    type: multiple_choice
    question: "What does 'leading by example' mean?"
    options:
      - "Following others"
      - "Demonstrating the behaviors and work ethic you expect from your team"
      - "Telling others what to do without doing it yourself"
      - "Being the first in line"
    answer: "Demonstrating the behaviors and work ethic you expect from your team"
    xp_reward: 15

  - id: 6
    type: multiple_choice
    question: "What is 'servant leadership'?"
    options:
      - "Leadership about servants"
      - "A philosophy where the leader's primary role is to serve and empower their team"
      - "Leadership by servants"
      - "A type of customer service"
    answer: "A philosophy where the leader's primary role is to serve and empower their team"
    xp_reward: 15

  - id: 7
    type: multiple_choice
    question: "What is 'decisiveness' in leadership?"
    options:
      - "Making decisions slowly"
      - "The ability to make timely, clear decisions even with incomplete information"
      - "Never making decisions"
      - "Letting others decide"
    answer: "The ability to make timely, clear decisions even with incomplete information"
    xp_reward: 15

