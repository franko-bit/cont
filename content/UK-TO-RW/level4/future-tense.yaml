exercises:

 # 1. Translation Exercises - Basic Future Words ONLY (Safe for single words/phrases)
 # Basic Future Словниковий запас
 - id: 1
 type: translation
 Питання: "Як сказати 'Will' кіньяруанда? (as in 'will go')"
 Відповідь: "Nzajya / Azajya"
 note: "Nzajya means 'I will go', Azajya means 'he/she will go'"
 xp_reward: 15

