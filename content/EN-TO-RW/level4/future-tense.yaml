exercises:

  # 1. Translation Exercises - Basic Future Words ONLY (Safe for single words/phrases)
  # Basic Future Vocabulary
  - id: 1
    type: translation
    question: "How do you say 'Will' in Kinyarwanda? (as in 'will go')"
    answer: "Nzajya / Azajya"
    note: "Nzajya means 'I will go', Azajya means 'he/she will go'"
    xp_reward: 15

  - id: 2
