 # Translation - Common Conditional Phrases
 - id: 17
 type: translation
 שאלה: "איך אומרים 'If it rains, I will stay home' בקיניארוואנדה?"
 תשובה: "Niba imvura iguye, nzaguma mu rugo."
 xp_reward: 20

 - id: 18
 type: translation
 שאלה: "איך אומרים 'If I go to Kigali, I will visit my friend' בקיניארוואנדה?"
 תשובה: "Niba ngiye i Kigali, nzasura inshuti yanjye."
 xp_reward: 20

 - id: 19
 type: translation
 שאלה: "איך אומרים 'If you study, you will succeed' בקיניארוואנדה?"
 תשובה: "Niba wiga, uzatsinda."
 xp_reward: 18

 - id: 20
 type: translation
 שאלה: "איך אומרים 'If he comes, we will start the meeting' בקיניארוואנדה?"
 תשובה: "Niba aje, tuzatangira inama."
 xp_reward: 20

 - id: 21
 type: translation
 שאלה: "איך אומרים 'Unless you hurry, you will miss the bus' בקיניארוואנדה?"
 תשובה: "Ntiwihutira, uzacika bisi."
 xp_reward: 20

 - id: 22
 type: translation
 שאלה: "איך אומרים 'If I had money, I would buy a car' בקיניארוואנדה?"
 תשובה: "Niba nari mfite amafaranga, nari kugura imodoka."
 xp_reward: 22

 - id: 23
 type: translation
 שאלה: "איך אומרים 'If she were here, she could help' בקיניארוואנדה?"
 תשובה: "Iyo yari hano, yashoboraga gufasha."
 xp_reward: 22

 - id: 24
 type: translation
 שאלה: "איך אומרים 'I would טיולים if I had more time' בקיניארוואנדה?"
 תשובה: "Nari gutembera iyo nari mfite igihe kinini."
 xp_reward: 22

 - id: 25
 type: translation
 שאלה: "איך אומרים 'You should eat before leaving' בקיניארוואנדה?"
