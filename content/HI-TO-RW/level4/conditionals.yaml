 # Translation - Common Conditional Phrases
 - id: 17
 type: translation
 प्रश्न: "आप कैसे कहते हैं 'If it rains, I will stay home' किन्यार्वाण्डा में?"
 उत्तर: "Niba imvura iguye, nzaguma mu rugo."
 xp_reward: 20

 - id: 18
 type: translation
 प्रश्न: "आप कैसे कहते हैं 'If I go to Kigali, I will visit my friend' किन्यार्वाण्डा में?"
 उत्तर: "Niba ngiye i Kigali, nzasura inshuti yanjye."
 xp_reward: 20

 - id: 19
 type: translation
