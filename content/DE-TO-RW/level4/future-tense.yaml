 # 1. Translation Exercises - Basic Future Words ONLY (Safe für single words/phrases)
 # Basic Future Vokabular
 - id: 1
 type: translation
 Frage: "Wie sagt man 'Will' auf Kinyarwanda? (ein in 'will gehen')"
 Antwort: "Nzajya / Azajya"
 note: "Nzajya means 'I will gehen', Azajya means 'he/she will gehen'"
 xp_reward: 15

