  # Translation - Common Conditional Phrases
  - id: 17
    type: translation
    question: "How do you say 'If it rains, I will stay home' in Kiswahili?"
    answer: "Kama mvua itanyesha, nitabaki nyumbani."
    xp_reward: 20

  - id: 18
    type: translation
    question: "How do you say 'If I go to Kigali, I will visit my friend' in Kiswahili?"
    answer: "Kama nitaenda Kigali, nitamtembelea rafiki yangu."
    xp_reward: 20

  - id: 19
    type: translation
    question: "How do you say 'If you study, you will succeed' in Kiswahili?"
    answer: "Kama utasoma, utafaulu."
    xp_reward: 18

  - id: 20
    type: translation
    question: "How do you say 'If he comes, we will start the meeting' in Kiswahili?"
    answer: "Kama atakuja, tutaanza mkutano."
    xp_reward: 20

  - id: 21
    type: translation
    question: "How do you say 'Unless you hurry, you will miss the bus' in Kiswahili?"
    answer: "Usipofanya haraka, utakosa basi."
    xp_reward: 20

  - id: 22
    type: translation
    question: "How do you say 'If I had money, I would buy a car' in Kiswahili?"
    answer: "Kama ningekuwa na pesa, ningenunua gari."
    xp_reward: 22

  - id: 23
    type: translation
    question: "How do you say 'If she were here, she could help' in Kiswahili?"
    answer: "Kama angekuwa hapa, angeweza kusaidia."
    xp_reward: 22

  - id: 24
    type: translation
    question: "How do you say 'I would travel if I had more time' in Kiswahili?"
    answer: "Ningesafiri kama ningekuwa na muda zaidi."
    xp_reward: 22

  - id: 25
    type: translation
    question: "How do you say 'You should eat before leaving' in Kiswahili?"
    answer: "Unapaswa kula kabla ya kuondoka."
    xp_reward: 20

  - id: 26
    type: translation
    question: "How do you say 'If it is possible, I will come tomorrow' in Kiswahili?"
    answer: "Kama inawezekana, nitakuja kesho."
    xp_reward: 18

